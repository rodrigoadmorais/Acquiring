<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TPV — Actual vs Forecasts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
:root {
  --yellow: #FFE600;
  --blue:   #2563EB;
  --bg:     #F5F7FA;
  --card:   #FFFFFF;
  --border: #E5E7EB;
  --text:   #1F2937;
  --sub:    #6B7280;
  --c-ac:   #2563EB;
  --c-f48:  #F97316;
  --c-f39:  #DC2626;
  --c-pl:   #16A34A;
  --a-ac:   rgba(37,99,235,.12);
  --a-f48:  rgba(249,115,22,.12);
  --a-f39:  rgba(220,38,38,.12);
  --a-pl:   rgba(22,163,74,.12);
}
[data-theme=dark] {
  --bg:     #111827;
  --card:   #1F2937;
  --border: #374151;
  --text:   #F9FAFB;
  --sub:    #9CA3AF;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  background:
    radial-gradient(circle at top left,  rgba(255,230,0,.24),   transparent 34%),
    radial-gradient(circle at top right, rgba(52,131,250,.16),  transparent 30%),
    var(--bg);
  color: var(--text);
  min-height: 100vh;
}
/* Header */
.hdr {
  background: var(--yellow);
  padding: 12px 28px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 8px rgba(0,0,0,.10);
}
.hdr-left { display: flex; align-items: center; gap: 14px; }
.hdr-title { font-size: 18px; font-weight: 800; color: #111; letter-spacing: -.3px; }
.hdr-sub   { font-size: 12px; font-weight: 600; color: #444; }
.hdr-right { display: flex; align-items: center; gap: 10px; }
.icon-btn {
  background: rgba(0,0,0,.08); border: none; border-radius: 8px;
  width: 34px; height: 34px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 16px; transition: background .15s;
}
.icon-btn:hover { background: rgba(0,0,0,.16); }
/* Legend */
.legend-bar {
  background: var(--card); border-bottom: 1px solid var(--border);
  padding: 8px 28px; display: flex; gap: 20px; flex-wrap: wrap; align-items: center;
}
.pill {
  display: flex; align-items: center; gap: 7px;
  font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px;
  border: 2px solid transparent; cursor: pointer; transition: all .15s; user-select: none;
}
.pill.muted { opacity: .35; }
.pill:hover { opacity: .85; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.pill-ac  { border-color: var(--a-ac);  background: var(--a-ac);  color: var(--c-ac);  }
.pill-f48 { border-color: var(--a-f48); background: var(--a-f48); color: var(--c-f48); }
.pill-f39 { border-color: var(--a-f39); background: var(--a-f39); color: var(--c-f39); }
.pill-pl  { border-color: var(--a-pl);  background: var(--a-pl);  color: var(--c-pl);  }
/* Filters */
.filters {
  background: var(--card); border-bottom: 1px solid var(--border);
  padding: 10px 28px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
}
.fgrp { display: flex; align-items: center; gap: 7px; }
.fgrp label { font-size: 11px; font-weight: 700; color: var(--sub); text-transform: uppercase; letter-spacing: .4px; }
select {
  padding: 5px 10px; border: 1px solid var(--border); border-radius: 7px;
  background: var(--bg); color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer;
}
select:focus { outline: 2px solid var(--yellow); }
.rbtn-grp { display: flex; gap: 4px; }
.rbtn {
  background: transparent; color: var(--sub); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 11px; font-size: 11px; font-weight: 600;
  cursor: pointer; font-family: inherit; transition: all .12s;
}
.rbtn.active { background: var(--yellow); color: #111; border-color: var(--yellow); }
.rbtn:hover:not(.active) { border-color: var(--sub); }
/* KPIs */
.kpi-grid {
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 12px; padding: 18px 28px 0;
}
.kpi {
  background: var(--card); border-radius: 12px; padding: 16px 18px 14px;
  border: 1px solid var(--border); box-shadow: 0 1px 4px rgba(0,0,0,.04);
  transition: box-shadow .15s;
}
.kpi:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); }
.kpi-lbl { font-size: 10px; font-weight: 700; color: var(--sub); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
.kpi-val { font-size: 22px; font-weight: 800; line-height: 1.1; }
.kpi-delta { font-size: 11px; font-weight: 600; margin-top: 5px; color: var(--sub); }
.kpi.kac  { border-top: 3px solid var(--c-ac);  }
.kpi.kf48 { border-top: 3px solid var(--c-f48); }
.kpi.kf39 { border-top: 3px solid var(--c-f39); }
.kpi.kpl  { border-top: 3px solid var(--c-pl);  }
.kpi.kvar { border-top: 3px solid #9333EA; }
.pos { color: #16A34A; } .neg { color: #DC2626; }
/* Charts */
.chart-wrap { padding: 18px 28px 0; }
.card {
  background: var(--card); border-radius: 14px; padding: 20px 22px 16px;
  border: 1px solid var(--border); box-shadow: 0 1px 4px rgba(0,0,0,.04);
  transition: box-shadow .15s;
}
.card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); }
.card-title { font-size: 13px; font-weight: 700; margin-bottom: 16px; }
.bottom-row {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 14px; padding: 14px 28px 0;
}
canvas { max-width: 100%; }
/* Table */
.tbl-wrap {
  margin: 14px 28px 28px; background: var(--card);
  border-radius: 14px; border: 1px solid var(--border);
  overflow-x: auto; max-height: 340px; overflow-y: auto;
}
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead th {
  background: var(--yellow); color: #111; padding: 9px 12px;
  text-align: left; font-weight: 700; position: sticky; top: 0;
  white-space: nowrap; z-index: 1;
}
tbody td { padding: 7px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
tbody tr:hover td { background: rgba(255,230,0,.06); }
.num { text-align: right; font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.badge {
  display: inline-block; padding: 2px 8px; border-radius: 20px;
  font-size: 10px; font-weight: 700;
}
.bac  { background: var(--a-ac);  color: var(--c-ac);  }
.bf48 { background: var(--a-f48); color: #C2410C; }
.bf39 { background: var(--a-f39); color: #991B1B; }
.bpl  { background: var(--a-pl);  color: #15803D; }
/* Responsive */
@media (max-width: 1180px) {
  .kpi-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 768px) {
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .bottom-row { grid-template-columns: 1fr; }
  .hdr-sub { display: none; }
}
@media (max-width: 520px) {
  .hdr, .legend-bar, .filters, .kpi-grid, .chart-wrap, .bottom-row, .tbl-wrap {
    padding-left: 14px; padding-right: 14px;
  }
  .kpi-val { font-size: 18px; }
}
</style>
</head>
<body>

<!-- Header -->
<header class="hdr">
  <div class="hdr-left">
    <div>
      <div class="hdr-title">TPV — Actual vs Forecasts</div>
      <div class="hdr-sub">Acquiring Brasil · Atualizado em 04/05/2026</div>
    </div>
  </div>
  <div class="hdr-right">
    <button class="icon-btn" id="themeBtn" title="Alternar tema">🌙</button>
  </div>
</header>

<!-- Legend / scenario toggles -->
<div class="legend-bar">
  <div class="pill pill-ac"  data-scen="ac"  onclick="toggleScen(this)"><div class="dot" style="background:var(--c-ac)"></div>Actual</div>
  <div class="pill pill-f48" data-scen="f48" onclick="toggleScen(this)"><div class="dot" style="background:var(--c-f48)"></div>Forecast 4+8</div>
  <div class="pill pill-f39" data-scen="f39" onclick="toggleScen(this)"><div class="dot" style="background:var(--c-f39)"></div>Forecast 3+9</div>
  <div class="pill pill-pl"  data-scen="pl"  onclick="toggleScen(this)"><div class="dot" style="background:var(--c-pl)"></div>Plano 2026</div>
  <span style="font-size:11px;color:var(--sub);margin-left:auto">Último Actual completo: <strong>Abr/26</strong></span>
</div>

<!-- Filters -->
<div class="filters">
  <div class="fgrp">
    <label>Período</label>
    <div class="rbtn-grp">
      <button class="rbtn" data-yr="2025" onclick="setYear(this)">2025</button>
      <button class="rbtn active" data-yr="2026" onclick="setYear(this)">2026</button>
      <button class="rbtn" data-yr="all" onclick="setYear(this)">Todos</button>
    </div>
  </div>
  <div class="fgrp">
    <label>BU</label>
    <select id="buFilter" onchange="render()">
      <option value="all">Todos</option>
      <option value="OP">OP</option>
      <option value="POINT">POINT</option>
      <option value="QR">QR</option>
    </select>
  </div>
  <div class="fgrp">
    <label>Segmento</label>
    <select id="segFilter" onchange="render()">
      <option value="all">Todos</option>
      <option value="BIG SELLERS">Big Sellers</option>
      <option value="LONGTAIL">Longtail</option>
      <option value="SMB">SMB</option>
    </select>
  </div>
</div>

<!-- KPIs -->
<div class="kpi-grid" id="kpiGrid"></div>

<!-- Main line chart -->
<div class="chart-wrap">
  <div class="card">
    <div class="card-title">Evolução Mensal do TPV (R$ bi)</div>
    <canvas id="mainChart" height="110"></canvas>
  </div>
</div>

<!-- Bottom row -->
<div class="bottom-row">
  <div class="card">
    <div class="card-title">Breakdown por BU</div>
    <canvas id="buChart" height="200"></canvas>
  </div>
  <div class="card">
    <div class="card-title">Breakdown por Segmento</div>
    <canvas id="segChart" height="200"></canvas>
  </div>
</div>

<!-- Table -->
<div class="tbl-wrap">
  <table id="dataTable">
    <thead><tr id="tableHead"></tr></thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

  const bu  = activeBU;
  const seg = activeSeg;
  let src;
  if (scen === 'actual')    src = D.actual;
  else if (scen === 'f48')  src = D.f48;
  else if (scen === 'f39')  src = D.f39;
  else                      src = D.plano2026;

  if (bu !== 'all' && seg !== 'all') {
    // Both filters: need intersection — approximate by min(buShare, segShare) * total
    // Better: just show total and note filters
    return getSeries_buSeg(scen, bu, seg);
  }
  if (bu !== 'all') {
    const key = bu === 'QR'
      ? (scen === 'actual' ? 'QR' : 'QR SELLERS')
      : bu;
    return src.by_bu[key] || new Array(24).fill(0);
  }
  if (seg !== 'all') {
    return src.by_segment[seg] || new Array(24).fill(0);
  }
  return src.total;
}

function getSeries_buSeg(scen, bu, seg) {
  // Both BU and Seg filtered: data not pre-aggregated at this level.
  // Show the smaller of the two (conservative estimate) — a known limitation.
  // For now, show total (the dashboard note will explain).
  return getSeries_bu(scen, bu);
}
function getSeries_bu(scen, bu) {
  const src = scen === 'actual' ? D.actual : scen === 'f48' ? D.f48 : scen === 'f39' ? D.f39 : D.plano2026;
  const key = bu === 'QR' ? (scen === 'actual' ? 'QR' : 'QR SELLERS') : bu;
  return src.by_bu[key] || new Array(24).fill(0);
}

function getVisibleMonths() {
  const { start, end } = getIdxRange();
  return D.months.slice(start, end);
}
function getVisibleLabels() {
  const { start, end } = getIdxRange();
  return D.labels.slice(start, end);
}
function getVisibleSeries(scen) {
  const { start, end } = getIdxRange();
  return getSeries(scen).slice(start, end);
}

// ── KPIs ─────────────────────────────────────────────────────────────────────
function renderKPIs() {
  const { start, end } = getIdxRange();
  const months = D.months.slice(start, end);

  // For Actual, only count up to LAST_ACTUAL_IDX
  const acEnd = Math.min(end, LAST_ACTUAL_IDX + 1);
  const acIdxs = [];
  for (let i = start; i < acEnd; i++) acIdxs.push(i);

  const acSeries  = getSeries('actual');
  const f48Series = getSeries('f48');
  const f39Series = getSeries('f39');
  const plSeries  = getSeries('plano2026');

  const acTotal  = acIdxs.reduce((s,i) => s + acSeries[i],  0);
  const f48Total = acIdxs.reduce((s,i) => s + f48Series[i], 0);
  const f39Total = acIdxs.reduce((s,i) => s + f39Series[i], 0);
  const plTotal  = acIdxs.reduce((s,i) => s + plSeries[i],  0);

  const acVsPlPct  = plTotal  ? (acTotal/plTotal  - 1)*100 : null;
  const acVsF48Pct = f48Total ? (acTotal/f48Total - 1)*100 : null;
  const monthLabel = acIdxs.length > 0
    ? `(${D.labels[start]}–${D.labels[acEnd-1]})`
    : '(sem dados)';

  const grid = document.getElementById('kpiGrid');
  grid.innerHTML = `
    <div class="kpi kac">
      <div class="kpi-lbl">Actual ${monthLabel}</div>
      <div class="kpi-val">R$ ${fmtB(acTotal)}B</div>
      <div class="kpi-delta">YTD ${acIdxs.length}m</div>
    </div>
    <div class="kpi kf48">
      <div class="kpi-lbl">F 4+8 ${monthLabel}</div>
      <div class="kpi-val">R$ ${fmtB(f48Total)}B</div>
      <div class="kpi-delta ${acVsF48Pct !== null ? (acVsF48Pct>=0?'pos':'neg') : ''}">
        Actual ${acVsF48Pct !== null ? (acVsF48Pct>=0?'+':'')+acVsF48Pct.toFixed(1)+'%' : '—'} vs F4+8
      </div>
    </div>
    <div class="kpi kf39">
      <div class="kpi-lbl">F 3+9 ${monthLabel}</div>
      <div class="kpi-val">R$ ${fmtB(f39Total)}B</div>
      <div class="kpi-delta">Mesmo período</div>
    </div>
    <div class="kpi kpl">
      <div class="kpi-lbl">Plano 2026 ${monthLabel}</div>
      <div class="kpi-val">R$ ${fmtB(plTotal)}B</div>
      <div class="kpi-delta ${acVsPlPct !== null ? (acVsPlPct>=0?'pos':'neg') : ''}">
        Actual ${acVsPlPct !== null ? (acVsPlPct>=0?'+':'')+acVsPlPct.toFixed(1)+'%' : '—'} vs Plano
      </div>
    </div>
    <div class="kpi kvar">
      <div class="kpi-lbl">F 4+8 Full Year 2026</div>
      <div class="kpi-val">R$ ${fmtB(sum(getSeries('f48').slice(12)))+'B'}</div>
      <div class="kpi-delta">Plano: R$ ${fmtB(sum(getSeries('plano2026').slice(12)))+'B'}</div>
    </div>`;
}

// ── MAIN LINE CHART ───────────────────────────────────────────────────────────
function makeDataset(label, scen, color, dash) {
  const data = getVisibleSeries(scen).map(v => v ? parseFloat(fmtB(v)) : null);
  const ds = {
    label, data,
    borderColor: color,
    backgroundColor: color.replace(')', ',.08)').replace('rgb', 'rgba'),
    borderWidth: 2.5,
    tension: 0.42,
    pointRadius: 3,
    pointHoverRadius: 6,
    hidden: hiddenScen.has(scen),
  };
  if (dash) { ds.borderDash = dash; ds.pointRadius = 2; }
  if (scen === 'actual') {
    ds.spanGaps = false;
  }
  return ds;
}

function renderMainChart() {
  const ctx = document.getElementById('mainChart').getContext('2d');
  if (charts.main) charts.main.destroy();

  const labels = getVisibleLabels();

  // Mark last actual with a vertical annotation via a dummy dataset
  const { start } = getIdxRange();
  const acEnd = Math.min(LAST_ACTUAL_IDX - start + 1, labels.length);

  charts.main = new Chart(ctx, {
    type: 'line',
    plugins: [ChartDataLabels],
    data: {
      labels,
      datasets: [
        makeDataset('Actual',       'actual', '#2563EB', null),
        makeDataset('Forecast 4+8', 'f48',    '#F97316', [6,3]),
        makeDataset('Forecast 3+9', 'f39',    '#DC2626', [4,4]),
        makeDataset('Plano 2026',   'pl',     '#16A34A', [8,4]),
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#111827',
          titleColor: '#F9FAFB',
          bodyColor: '#D1D5DB',
          padding: 14,
          cornerRadius: 12,
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: R$ ${ctx.parsed.y !== null ? ctx.parsed.y.toFixed(2)+'B' : '—'}`
          }
        },
        datalabels: { display: false },
      },
      scales: {
        x: {
          grid: { color: 'rgba(0,0,0,.05)' },
          ticks: { font: { size: 11 }, color: '#6B7280' }
        },
        y: {
          display: true,
          grid: { color: 'rgba(0,0,0,.05)' },
          ticks: {
            font: { size: 11 }, color: '#6B7280',
            callback: v => v + 'B'
          }
        }
      }
    }
  });
}

// ── BU CHART ──────────────────────────────────────────────────────────────────
function renderBUChart() {
  const ctx = document.getElementById('buChart').getContext('2d');
  if (charts.bu) charts.bu.destroy();

  const bus  = ['OP', 'POINT', 'QR'];
  const { start } = getIdxRange();
  const acEnd = Math.min(LAST_ACTUAL_IDX + 1, start === 0 ? 12 : 24);

  function buSum(scen, bu) {
    const key = bu === 'QR' ? (scen === 'actual' ? 'QR' : 'QR SELLERS') : bu;
    const src  = scen === 'actual' ? D.actual : scen === 'f48' ? D.f48 : scen === 'f39' ? D.f39 : D.plano2026;
    const idxs = [];
    const lo = start === 0 ? 0 : 12;
    const hi = start === 0 ? 12 : 24;
    for (let i = lo; i < hi; i++) idxs.push(i);
    return idxs.reduce((s,i) => s + (src.by_bu[key]?.[i] || 0), 0) / 1e9;
  }

  charts.bu = new Chart(ctx, {
    type: 'bar',
    plugins: [ChartDataLabels],
    data: {
      labels: bus,
      datasets: [
        { label:'Actual',       data: bus.map(b=>buSum('actual',b)), backgroundColor:'rgba(37,99,235,.75)',   hidden: hiddenScen.has('actual') },
        { label:'F 4+8',        data: bus.map(b=>buSum('f48',b)),    backgroundColor:'rgba(249,115,22,.75)',  hidden: hiddenScen.has('f48') },
        { label:'F 3+9',        data: bus.map(b=>buSum('f39',b)),    backgroundColor:'rgba(220,38,38,.75)',   hidden: hiddenScen.has('f39') },
        { label:'Plano 2026',   data: bus.map(b=>buSum('pl',b)),     backgroundColor:'rgba(22,163,74,.75)',   hidden: hiddenScen.has('pl') },
      ]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: true, labels: { font: { size: 11 }, boxWidth: 12 } },
        tooltip: {
          backgroundColor: '#111827', titleColor: '#F9FAFB', bodyColor: '#D1D5DB',
          padding: 12, cornerRadius: 12,
          callbacks: { label: c => ` ${c.dataset.label}: R$ ${c.parsed.y.toFixed(2)}B` }
        },
        datalabels: {
          anchor: 'end', align: 'top', font: { size: 10, weight: 700 },
          formatter: v => v > 0 ? v.toFixed(1) : '',
          color: '#374151',
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 12 } } },
        y: { grid: { color: 'rgba(0,0,0,.05)' }, ticks: { font: { size: 11 }, callback: v => v+'B' } }
      }
    }
  });
}

// ── SEGMENT CHART ─────────────────────────────────────────────────────────────
function renderSegChart() {
  const ctx = document.getElementById('segChart').getContext('2d');
  if (charts.seg) charts.seg.destroy();

  const segs = ['BIG SELLERS', 'LONGTAIL', 'SMB'];
  const { start } = getIdxRange();

  function segSum(scen, seg) {
    const src  = scen === 'actual' ? D.actual : scen === 'f48' ? D.f48 : scen === 'f39' ? D.f39 : D.plano2026;
    const lo = start, hi = start === 0 ? 12 : 24;
    return Array.from({length: hi - lo}, (_,k) => lo+k)
      .reduce((s,i) => s + (src.by_segment[seg]?.[i] || 0), 0) / 1e9;
  }

  charts.seg = new Chart(ctx, {
    type: 'bar',
    plugins: [ChartDataLabels],
    data: {
      labels: segs.map(s => s === 'BIG SELLERS' ? 'Big Sellers' : s === 'LONGTAIL' ? 'Longtail' : s),
      datasets: [
        { label:'Actual',     data: segs.map(s=>segSum('actual',s)), backgroundColor:'rgba(37,99,235,.75)',  hidden: hiddenScen.has('actual') },
        { label:'F 4+8',      data: segs.map(s=>segSum('f48',s)),    backgroundColor:'rgba(249,115,22,.75)', hidden: hiddenScen.has('f48') },
        { label:'F 3+9',      data: segs.map(s=>segSum('f39',s)),    backgroundColor:'rgba(220,38,38,.75)',  hidden: hiddenScen.has('f39') },
        { label:'Plano 2026', data: segs.map(s=>segSum('pl',s)),     backgroundColor:'rgba(22,163,74,.75)',  hidden: hiddenScen.has('pl') },
      ]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: true, labels: { font: { size: 11 }, boxWidth: 12 } },
        tooltip: {
          backgroundColor: '#111827', titleColor: '#F9FAFB', bodyColor: '#D1D5DB',
          padding: 12, cornerRadius: 12,
          callbacks: { label: c => ` ${c.dataset.label}: R$ ${c.parsed.y.toFixed(2)}B` }
        },
        datalabels: {
          anchor: 'end', align: 'top', font: { size: 10, weight: 700 },
          formatter: v => v > 0 ? v.toFixed(1) : '',
          color: '#374151',
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 11 } } },
        y: { grid: { color: 'rgba(0,0,0,.05)' }, ticks: { font: { size: 11 }, callback: v => v+'B' } }
      }
    }
  });
}

// ── TABLE ─────────────────────────────────────────────────────────────────────
function renderTable() {
  const { start, end } = getIdxRange();
  const labels  = D.labels.slice(start, end);
  const acSer   = getSeries('actual').slice(start, end);
  const f48Ser  = getSeries('f48').slice(start, end);
  const f39Ser  = getSeries('f39').slice(start, end);
  const plSer   = getSeries('plano2026').slice(start, end);

  document.getElementById('tableHead').innerHTML =
    '<th>Mês</th><th>Actual</th><th>F 4+8</th><th>F 3+9</th><th>Plano 2026</th><th>Δ Actual vs F4+8</th><th>Δ Actual vs Plano</th>';

  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = labels.map((lbl, i) => {
    const ac = acSer[i], f48 = f48Ser[i], f39 = f39Ser[i], pl = plSer[i];
    const isActual = (start + i) <= LAST_ACTUAL_IDX;
    const vsF48 = ac && f48 ? ((ac/f48-1)*100) : null;
    const vsPl  = ac && pl  ? ((ac/pl-1)*100)  : null;
    const fmtDelta = v => v === null ? '<span style="color:var(--sub)">—</span>'
      : `<span class="${v>=0?'pos':'neg'}">${v>=0?'+':''}${v.toFixed(1)}%</span>`;
    return `<tr>
      <td><strong>${lbl}</strong>${isActual ? ' <span class="badge bac">A</span>' : ''}</td>
      <td class="num">${ac ? 'R$ '+fmtB(ac)+'B' : '<span style="color:var(--sub)">—</span>'}</td>
      <td class="num">${f48 ? 'R$ '+fmtB(f48)+'B' : '<span style="color:var(--sub)">—</span>'}</td>
      <td class="num">${f39 ? 'R$ '+fmtB(f39)+'B' : '<span style="color:var(--sub)">—</span>'}</td>
      <td class="num">${pl ? 'R$ '+fmtB(pl)+'B' : '<span style="color:var(--sub)">—</span>'}</td>
      <td class="num">${fmtDelta(vsF48)}</td>
      <td class="num">${fmtDelta(vsPl)}</td>
    </tr>`;
  }).join('');
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  activeBU  = document.getElementById('buFilter').value;
  activeSeg = document.getElementById('segFilter').value;
  renderKPIs();
  renderMainChart();
  renderBUChart();
  renderSegChart();
  renderTable();
}

// ── INTERACTIONS ──────────────────────────────────────────────────────────────
function setYear(btn) {
  document.querySelectorAll('.rbtn[data-yr]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeYear = btn.dataset.yr;
  render();
}

function toggleScen(pill) {
  const scen = pill.dataset.scen;
  if (hiddenScen.has(scen)) {
    hiddenScen.delete(scen);
    pill.classList.remove('muted');
  } else {
    hiddenScen.add(scen);
    pill.classList.add('muted');
  }
  render();
}

// Dark mode
const themeBtn = document.getElementById('themeBtn');
themeBtn.onclick = () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? '' : 'dark');
  themeBtn.textContent = dark ? '🌙' : '☀️';
  render();
};

// ── INIT ──────────────────────────────────────────────────────────────────────
Chart.register(ChartDataLabels);
render();
</script>
