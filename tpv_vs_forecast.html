<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TPV — Actual vs Forecasts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
:root{
  --y:#FFE600;--bg:#F5F7FA;--card:#FFF;--brd:#E5E7EB;
  --tx:#1F2937;--sub:#6B7280;
  --ac:#2563EB;--f48:#F97316;--f39:#DC2626;--pl:#16A34A;
  --aac:rgba(37,99,235,.10);--af48:rgba(249,115,22,.10);
  --af39:rgba(220,38,38,.10);--apl:rgba(22,163,74,.10);
}
[data-theme=dark]{--bg:#111827;--card:#1F2937;--brd:#374151;--tx:#F9FAFB;--sub:#9CA3AF}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Inter","Segoe UI",system-ui,sans-serif;color:var(--tx);min-height:100vh;
  background:radial-gradient(circle at top left,rgba(255,230,0,.22),transparent 34%),
             radial-gradient(circle at top right,rgba(52,131,250,.14),transparent 30%),var(--bg);
}
/* header */
.hdr{background:var(--y);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.10)}
.ht{font-size:16px;font-weight:800;color:#111;letter-spacing:-.2px}
.hs{font-size:11px;font-weight:600;color:#555}
.ib{background:rgba(0,0,0,.08);border:none;border-radius:8px;width:30px;height:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:.15s}
.ib:hover{background:rgba(0,0,0,.18)}
/* legend pills */
.leg{background:var(--card);border-bottom:1px solid var(--brd);padding:6px 24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;border:1.5px solid transparent;cursor:pointer;user-select:none;transition:opacity .12s}
.pill.off{opacity:.28}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.pac{background:var(--aac);border-color:var(--aac);color:var(--ac)}
.pf48{background:var(--af48);border-color:var(--af48);color:var(--f48)}
.pf39{background:var(--af39);border-color:var(--af39);color:var(--f39)}
.ppl{background:var(--apl);border-color:var(--apl);color:var(--pl)}
.lnote{font-size:10px;color:var(--sub);margin-left:auto}
/* filters */
.fbar{background:var(--card);border-bottom:1px solid var(--brd);padding:7px 24px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fg{display:flex;align-items:center;gap:4px}
.fg label{font-size:9.5px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
select{padding:3px 7px;border:1px solid var(--brd);border-radius:6px;background:var(--bg);color:var(--tx);font-size:11px;font-family:inherit;cursor:pointer}
select:focus{outline:2px solid var(--y)}
.rg{display:flex;gap:2px}
.rb{background:transparent;color:var(--sub);border:1px solid var(--brd);border-radius:5px;padding:3px 9px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;transition:.1s}
.rb.on{background:var(--y);color:#111;border-color:var(--y)}
.rb:hover:not(.on){border-color:var(--sub)}
.sep{width:1px;background:var(--brd);margin:0 2px;align-self:stretch}
.rsep{width:1px;background:var(--brd);margin:0 3px;align-self:stretch}

.fnote{font-size:9.5px;color:var(--sub);padding:3px 24px;font-style:italic;min-height:18px}
/* kpis */
.kg{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;padding:12px 24px 0}
.kpi{background:var(--card);border-radius:10px;padding:12px 14px 10px;border:1px solid var(--brd);box-shadow:0 1px 3px rgba(0,0,0,.04);transition:.12s}
.kpi:hover{box-shadow:0 3px 12px rgba(0,0,0,.08)}
.kl{font-size:9.5px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.kv{font-size:19px;font-weight:800;line-height:1.1}
.kd{font-size:10px;font-weight:600;margin-top:3px;color:var(--sub)}
.kac{border-top:3px solid var(--ac)}.kf48{border-top:3px solid var(--f48)}
.kf39{border-top:3px solid var(--f39)}.kpl{border-top:3px solid var(--pl)}
.kv5{border-top:3px solid #9333EA}
.pos{color:#16A34A}.neg{color:#DC2626}
.drill td{background:rgba(0,0,0,.025);font-size:11px;color:var(--sub)}
.drill td:first-child{padding-left:22px}
.arr{display:inline-block;transition:transform .15s;font-size:9px;margin-right:4px;color:var(--sub);cursor:pointer}
.arr.open{transform:rotate(90deg)}
em.sh{font-style:italic;color:var(--sub);font-size:10px;margin-left:2px}
.chart-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.chart-hd .ct{margin-bottom:0}
/* main row */
.main-section{display:grid;grid-template-columns:1fr 320px;gap:12px;padding:12px 24px 0;align-items:start}
.main-left{display:flex;flex-direction:column;gap:12px;min-width:0}
.main-section .kg{padding:0}
.mrow{display:grid;grid-template-columns:1fr 320px;gap:12px;padding:12px 24px 0;align-items:start}
.card{background:var(--card);border-radius:12px;padding:16px 18px 14px;border:1px solid var(--brd);box-shadow:0 1px 3px rgba(0,0,0,.04);transition:.12s}
.card:hover{box-shadow:0 3px 12px rgba(0,0,0,.08)}
.ct{font-size:11px;font-weight:700;margin-bottom:12px;color:var(--tx)}
/* comparison panel */
.cmpbox{background:var(--card);border-radius:12px;border:1px solid var(--brd);box-shadow:0 1px 3px rgba(0,0,0,.04);padding:14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.cmptit{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.selrow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.selrow select{font-size:10px}
.pgrp{display:flex;gap:3px;flex-wrap:wrap}
.pb{background:transparent;color:var(--sub);border:1px solid var(--brd);border-radius:4px;padding:2px 7px;font-size:9.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.1s}
.pb.on{background:var(--y);color:#111;border-color:var(--y)}
.pb:hover:not(.on){border-color:var(--sub)}
/* comparison table */
.ctbl{width:100%;border-collapse:collapse;font-size:10.5px}
.ctbl th{text-align:left;padding:4px 5px;font-weight:700;color:var(--sub);font-size:9px;text-transform:uppercase;border-bottom:1px solid var(--brd);white-space:nowrap}
.ctbl td{padding:4px 5px;border-bottom:1px solid var(--brd);white-space:nowrap}
.ctbl .sep td{background:rgba(255,230,0,.07);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--sub);padding:3px 5px}
.ctbl td:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums}
/* bottom row */
.brow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px 24px 0}
/* table */
.tw{margin:12px 24px 24px;background:var(--card);border-radius:12px;border:1px solid var(--brd);overflow-x:auto;max-height:320px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
thead th{background:var(--y);color:#111;padding:7px 10px;text-align:left;font-weight:700;position:sticky;top:0;z-index:1;white-space:nowrap}
tbody td{padding:5px 10px;border-bottom:1px solid var(--brd);white-space:nowrap}
tbody tr:hover td{background:rgba(255,230,0,.05)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:1px 6px;border-radius:20px;font-size:9px;font-weight:700}
.bac{background:var(--aac);color:var(--ac)}
/* main layout */






/* responsive */
@media(max-width:900px){.mrow{grid-template-columns:1fr}.brow{grid-template-columns:1fr 1fr}}
@media(max-width:900px){.kg{grid-template-columns:repeat(3,1fr)}.brow{grid-template-columns:1fr}}
@media(max-width:640px){.kg{grid-template-columns:repeat(2,1fr)}.hs{display:none}}
</style>
</head>
<body>

<header class="hdr">
  <div><div class="ht">TPV &mdash; Actual vs Forecasts</div><div class="hs">Acquiring Brasil &middot; 04/05/2026</div></div>
  <button class="ib" id="themeBtn" title="Tema">🌙</button>

      <button class="rb" data-yr="2025q1" onclick="setYr(this)">Q1 25</button>

  <div class="fg"><label>MOP</label>

  <div class="fg"><label>Carteira</label>
    <select id="fCart" onchange="render()">
      <option value="">Todas</option>
      <option value="AQUISICAO">Aquisição</option>
      <option value="ENGAJAMENTO">Engajamento</option>
    </select>
  </div>
</div>
<div class="fnote" id="fnote"></div>

<div class="main-section">
<div class="main-left">
<div class="kg" id="kg"></div>

<div class="card">
    <div class="chart-hd">
      <div class="ct">Evolução Mensal do TPV</div>
      <div style="display:flex;gap:4px">
        <button id="btnYoY25" class="rb" onclick="toggleYoY25()" title="Sobrepõe Actual 2025 alinhado por mês">+2025</button>

  const cart  = gCart();
  const seg   = gSeg();
  const bu    = gBU();
  // priority: prod > mop > canal > cart > seg > bu > total
  if (prod)  return sc.by_product[prod]  || new Array(24).fill(0);
  if (mop)   return sc.by_mop[mop]       || new Array(24).fill(0);
  if (canal) return sc.by_canal[canal]   || new Array(24).fill(0);
  if (cart)  return sc.by_carteira[cart] || new Array(24).fill(0);
  if (seg) {
    if (seg.includes('|')) {
      const parts = seg.split('|');
      const arr = new Array(24).fill(0);
      parts.forEach(p => { const a=sc.by_segment[p]; if(a) a.forEach((v,i)=>arr[i]+=(v||0)); });
      return arr;
    }
    return sc.by_segment[seg] || new Array(24).fill(0);
  }
  if (bu) {
    const key = (BU_KEY[scen]||{})[bu] || bu;
    return sc.by_bu[key] || new Array(24).fill(0);
  }
  return sc.total;
}

// ── COMPARISON PANEL ─────────────────────────────────────────────────────────
function parseSpec(spec) {
  const [scen,yr,period] = spec.split('|');
  const base = yr==='2025' ? 0 : 12;
  let lo,hi;
  switch(period) {
    case 'full': lo=base;            hi=base+12; break;
    case 'ytd':  lo=base;            hi=Math.min(base+12, LAST_AC+1); break;
    case 'ytg':  lo=Math.min(base+12, LAST_AC+1); hi=base+12; break;
    case 'q1':   lo=base;            hi=base+3;  break;
    case 'q2':   lo=base+3;          hi=base+6;  break;
    case 'q3':   lo=base+6;          hi=base+9;  break;
    case 'q4':   lo=base+9;          hi=base+12; break;
    case 'h1':   lo=base;            hi=base+6;  break;
    case 'h2':   lo=base+6;          hi=base+12; break;
    default:     lo=base;            hi=base+12;
  }
  return {scen, lo, hi};
}

function renderCmp() {
  const A = parseSpec($id('cA').value);
  const B = parseSpec($id('cB').value);
  const scA = D.scenarios[A.scen];
  const scB = D.scenarios[B.scen];
  const slc = (arr,lo,hi) => arr ? sa(arr.slice(lo,hi)) : 0;

  const fBu   = gBU();
  const fSeg  = gSeg(); const fSegK = fSeg&&!fSeg.includes('|')?fSeg:null;
  const fMop  = gMop();
  const fOth  = !!(gProd()||gCanal()||gCart());

  const totA = slc(getSeries(A.scen), A.lo, A.hi);
  const totB = slc(getSeries(B.scen), B.lo, B.hi);

  const diff = (a,b) => {
    if (!a&&!b) return '<span style="color:var(--sub)">—</span>';
    const v = pctN(a,b);
    const pstr = v!==null?` <span class="${v>=0?'pos':'neg'}">(${v>=0?'+':''}${v.toFixed(1)}%)</span>`:'';
    return fmtBs(a)+pstr;
  };
  const sh  = (v,tot) => tot>0?(v/tot*100).toFixed(1)+'%':'';
  const ND  = `<tr><td colspan="3" style="color:var(--sub);font-style:italic;font-size:10px">— sem dados —</td></tr>`;
  const NA  = `<tr><td colspan="3" style="color:var(--sub);font-style:italic;font-size:10px">— cruzamento não disponível —</td></tr>`;
  const xGet = (sc,xd,k1,k2) => sc[xd]?.[k1]?.[k2]||null;

  // ── BU section — cross-filtered by active Seg or MOP ─────────────────────────
  function getBuVal(b_) {
    const kA=(BU_KEY[A.scen]||{})[b_]||b_, kB=(BU_KEY[B.scen]||{})[b_]||b_;
    if (fOth) return [null,null];
    if (fSegK) {
      const xA=xGet(scA,'by_bu_by_seg',kA,fSegK), xB=xGet(scB,'by_bu_by_seg',kB,fSegK);
      return [xA?slc(xA,A.lo,A.hi):null, xB?slc(xB,B.lo,B.hi):null];
    }
    if (fMop) {
      const xA=xGet(scA,'by_bu_by_mop',kA,fMop), xB=xGet(scB,'by_bu_by_mop',kB,fMop);
      return [xA?slc(xA,A.lo,A.hi):null, xB?slc(xB,B.lo,B.hi):null];
    }
    return [slc(scA.by_bu[kA],A.lo,A.hi), slc(scB.by_bu[kB],B.lo,B.hi)];
  }
  const showBus = fBu?[fBu]:buses;
  const buRows = fOth ? NA : showBus.map(b_=>{
    const [a,b] = getBuVal(b_);
    if (a===null&&b===null) return NA;
    if (!a&&!b) return '';
    return `<tr><td>${b_}</td><td>${diff(a??0,b??0)}</td><td>${b?fmtBs(b):''}</td></tr>`;
  }).join('');

  // ── Segment section — cross-filtered by active BU or MOP ─────────────────────
  function getSegVal(k) {
    if (fOth) return [null,null];
    if (fBu) {
      const kA=(BU_KEY[A.scen]||{})[fBu]||fBu, kB=(BU_KEY[B.scen]||{})[fBu]||fBu;
      const xA=xGet(scA,'by_bu_by_seg',kA,k), xB=xGet(scB,'by_bu_by_seg',kB,k);
      return [xA?slc(xA,A.lo,A.hi):null, xB?slc(xB,B.lo,B.hi):null];
    }
    if (fMop) {
      const xA=xGet(scA,'by_seg_by_mop',k,fMop), xB=xGet(scB,'by_seg_by_mop',k,fMop);
      return [xA?slc(xA,A.lo,A.hi):null, xB?slc(xB,B.lo,B.hi):null];
    }
    return [slc(scA.by_segment[k],A.lo,A.hi), slc(scB.by_segment[k],B.lo,B.hi)];
  }
  const segsK=['BIG SELLERS','LONGTAIL','SMB'];
  const segLbl={'BIG SELLERS':'Big Sellers','LONGTAIL':'Longtail','SMB':'SMB'};
  const showSegs = fSegK?[fSegK]:(fSeg&&fSeg.includes('|')?fSeg.split('|'):segsK);
  let stA=0, stB=0;
  showSegs.forEach(k=>{ const [a,b]=getSegVal(k); stA+=(a||0); stB+=(b||0); });
  const segRows = fOth ? NA : showSegs.map(k=>{
    const [a,b] = getSegVal(k);
    if (a===null&&b===null) return NA;
    if (!a&&!b) return '';
    const saStr=stA>0&&a?` <em>${sh(a,stA)}</em>`:'';
    const sbStr=stB>0&&b?` <em>${sh(b,stB)}</em>`:'';
    return `<tr><td>${segLbl[k]||k}</td><td>${fmtBs(a||0)}${saStr}</td><td>${fmtBs(b||0)}${sbStr}</td></tr>`;
  }).join('');

  // ── MOP section — cross-filtered by active BU or Seg ─────────────────────────
  function getMopVal(m) {
    if (fOth) return [null,null];
    if (fBu) {
      const kA=(BU_KEY[A.scen]||{})[fBu]||fBu, kB=(BU_KEY[B.scen]||{})[fBu]||fBu;
      const xA=xGet(scA,'by_bu_by_mop',kA,m), xB=xGet(scB,'by_bu_by_mop',kB,m);
      return [xA?slc(xA,A.lo,A.hi):null, xB?slc(xB,B.lo,B.hi):null];
    }
    if (fSegK) {
      const xA=xGet(scA,'by_seg_by_mop',fSegK,m), xB=xGet(scB,'by_seg_by_mop',fSegK,m);
      return [xA?slc(xA,A.lo,A.hi):null, xB?slc(xB,B.lo,B.hi):null];
    }
    return [slc(scA.by_mop[m],A.lo,A.hi), slc(scB.by_mop[m],B.lo,B.hi)];
  }
  const mops=['CREDIT_CARD','DEBIT_CARD','BANK_TRANSFER','ACCOUNT_MONEY','TICKET'];
  const showMops = fMop?[fMop]:mops;
  let mtA=0, mtB=0;
  showMops.forEach(m=>{ const [a,b]=getMopVal(m); mtA+=(a||0); mtB+=(b||0); });
  const mopRows = fOth ? NA : (showMops.map(m=>{
    const [a,b] = getMopVal(m);
    if (a===null&&b===null) return NA;
    if (!a&&!b) return '';
    const saStr=mtA>0&&a?` <em>${sh(a,mtA)}</em>`:'';
    const sbStr=mtB>0&&b?` <em>${sh(b,mtB)}</em>`:'';
    return `<tr><td>${MOP_LBL[m]||m}</td><td>${fmtBs(a||0)}${saStr}</td><td>${fmtBs(b||0)}${sbStr}</td></tr>`;
  }).join('')||ND);

  const lA=$id('cA').options[$id('cA').selectedIndex].text.replace(' — ',' ');
  const lB=$id('cB').options[$id('cB').selectedIndex].text.replace(' — ',' ');
  // ── Products section when BU filter active ────────────────────────────
  const BU_PRODS = {
    POINT:[{k:'POINT',l:'Device'},{k:'TTP',l:'TTP'}],
    OP:   [{k:'LINK',l:'Link'},{k:'CHECKOUT',l:'Checkout'}],
    QR:   [],
  };
  let prodSection = '';
  if (fBu && BU_PRODS[fBu] && BU_PRODS[fBu].length > 0) {
    let ptA=0, ptB=0;
    BU_PRODS[fBu].forEach(({k})=>{ ptA+=slc(scA.by_product[k],A.lo,A.hi); ptB+=slc(scB.by_product[k],B.lo,B.hi); });
    const prodRows2 = BU_PRODS[fBu].map(({k,l})=>{
      const a=slc(scA.by_product[k],A.lo,A.hi), b=slc(scB.by_product[k],B.lo,B.hi);
      if(!a&&!b) return '';
      const saStr=ptA>0&&a?` <em>${sh(a,ptA)}</em>`:'', sbStr=ptB>0&&b?` <em>${sh(b,ptB)}</em>`:'';
      return `<tr><td>${l}</td><td>${fmtBs(a)}${saStr}</td><td>${fmtBs(b)}${sbStr}</td></tr>`;
    }).join('');
    if (prodRows2) prodSection = `<tr class="sep"><td colspan="3">Produtos</td></tr>${prodRows2}`;
  }

  $id('cmpDiv').innerHTML=`<table class="ctbl">
    <thead><tr><th>Métrica</th><th>A: ${lA}</th><th>B: ${lB}</th></tr></thead>
    <tbody>
      <tr class="sep"><td colspan="3">Total</td></tr>
      <tr><td>TPV</td><td>${diff(totA,totB)}</td><td>${fmtBs(totB)}</td></tr>
      <tr class="sep"><td colspan="3">Por BU</td></tr>${buRows}
      ${prodSection}
      <tr class="sep"><td colspan="3">Segmento</td></tr>${segRows}
      <tr class="sep"><td colspan="3">Share MOP</td></tr>${mopRows}
    </tbody></table>`;
}

function renderMain() {
  const [lo,hi] = getRange();
  const ctx = $id('cMain').getContext('2d');
  if (charts.main) charts.main.destroy();
  const names  = {actual:'Actual',f48:'F 4+8',f39:'F 3+9',plano2026:'Plano'};
  const is2026 = lo >= 12;
  const ac2025 = getSeries('actual');

  let datasets, yTick, tooltipFmt;

  if (yoyGr && is2026) {
    datasets = Object.keys(names).map(s => {
      const s26 = getSeries(s);
      const data = Array.from({length:hi-lo},(_,i)=>{
        const v = s26[lo+i], prev = ac2025[lo-12+i];
        return (v && prev) ? +((v/prev-1)*100).toFixed(2) : null;
      });
      return {label:names[s],data,borderColor:CC[s],backgroundColor:CA[s],
        borderWidth:2.2,tension:0.42,pointRadius:3,pointHoverRadius:6,
        borderDash:DASH[s]||[],spanGaps:false,hidden:hidden.has(s)};
    });
    yTick = v => (v>=0?'+':'')+v.toFixed(1)+'%';
    tooltipFmt = c=>` ${c.dataset.label}: ${c.parsed.y!==null?(c.parsed.y>=0?'+':'')+c.parsed.y.toFixed(1)+'%':'—'}`;
  } else {
    datasets = Object.keys(names).map(s => {
      const d = {
        label:names[s],
        data:getSeries(s).slice(lo,hi).map(v=>v?+(v/1e9).toFixed(3):null),
        borderColor:CC[s],backgroundColor:CA[s],borderWidth:2.2,tension:0.42,
        pointRadius:3,pointHoverRadius:6,borderDash:DASH[s]||[],spanGaps:false,hidden:hidden.has(s),
        datalabels:{display:false},
      };
      if (s==='f48' && yoy25 && is2026) {
        const f48raw = getSeries('f48');
        d.datalabels = {
          display: true,
          anchor:'end', align:'top',
          font:{size:8.5,weight:700},
          color: CC['f48'],
          formatter: (_,ctx) => {
            const i = ctx.dataIndex;
            const v26 = f48raw[lo+i], v25 = ac2025[lo-12+i];

            const pct = (v26/v25-1)*100;
            return (pct>=0?'+':'')+pct.toFixed(1)+'%';
          },
        };
      }
      return d;
    });
    if (yoy25 && is2026) {
      datasets.push({
        label:'Actual 2025',
        data:ac2025.slice(lo-12,hi-12).map(v=>v?+(v/1e9).toFixed(3):null),
        borderColor:'#9CA3AF',backgroundColor:'transparent',borderWidth:1.5,
        tension:0.42,pointRadius:2,pointHoverRadius:4,borderDash:[3,3],spanGaps:false,
        datalabels:{display:false},

    tooltipFmt = c=>` ${c.dataset.label}: ${c.parsed.y!==null?'R$ '+c.parsed.y.toFixed(2)+'B':'—'}`;
  }

  charts.main = new Chart(ctx,{
    type:'line', plugins:[ChartDataLabels],
    data:{labels:getLabels(), datasets},
    options:{
      responsive:true, maintainAspectRatio:true,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{backgroundColor:'#111827',titleColor:'#F9FAFB',bodyColor:'#D1D5DB',padding:12,cornerRadius:12,
          callbacks:{label:tooltipFmt}},
        datalabels:{display:false},
      },
      scales:{
        x:{grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{size:10},color:'#6B7280'}},
        y:{grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{size:10},color:'#6B7280',callback:yTick}}
      }
    }
  });
}

    const filtLbl = gProd()?(PROD_LBL[gProd()]||gProd()):gMop()?(MOP_LBL[gMop()]||gMop()):gCanal()?gCanal():gCart()?gCart():bu||'Filtrado';
    labels = [filtLbl];
    getRaw = s => [sa(getSeries(s).slice(lo,hi))];
  } else if (segK) {
    labels = [SEG_LBL[segK]||segK];
    getRaw = s => { const arr=D.scenarios[s].by_segment[segK]; return [arr?sa(arr.slice(lo,hi)):0]; };

    labels = slugs;

  const getData = s => getRaw(s).map(v=>v/1e9);
  charts.seg = new Chart(ctx,{

  });
}

// ── MOP CHART ────────────────────────────────────────────────────────────────
function renderMop() {
  const [lo,hi] = getRange();
  const ctx = $id('cMop').getContext('2d');
  if (charts.mop) charts.mop.destroy();
  const mops  = ['CREDIT_CARD','DEBIT_CARD','BANK_TRANSFER','ACCOUNT_MONEY','TICKET'];
  const mlabs = mops.map(m=>MOP_LBL[m]||m);
  const scens = ['actual','f48','f39','plano2026'];
  const names = {actual:'Actual',f48:'F 4+8',f39:'F 3+9',plano2026:'Plano'};
  const mop = gMop();
  const bu = gBU();
  const seg = gSeg(); const segK = seg&&!seg.includes('|')?seg:null;
  const hasOtherFilter = gProd()||gCanal()||gCart();
  const isPct = mopMode === 'pct';
  let labels, getRaw;
  if (mop) {
    // Single MOP selected
    labels = [MOP_LBL[mop]||mop];
    getRaw = s => { const arr=D.scenarios[s].by_mop[mop]; return [arr?sa(arr.slice(lo,hi)):0]; };
  } else if (!hasOtherFilter && bu && !segK) {
    // BU only → MOPs within BU
    labels = mlabs;
    getRaw = s => { const key=(BU_KEY[s]||{})[bu]||bu; return mops.map(m => { const arr=D.scenarios[s].by_bu_by_mop?.[key]?.[m]; return arr?sa(arr.slice(lo,hi)):0; }); };
  } else if (!hasOtherFilter && segK && !bu) {
    // Seg only → MOPs within Segment
    labels = mlabs;
    getRaw = s => mops.map(m => { const arr=D.scenarios[s].by_seg_by_mop?.[segK]?.[m]; return arr?sa(arr.slice(lo,hi)):0; });
  } else if (hasOtherFilter || bu || segK) {
    // Complex filter: show total with label
    const filtLbl = gProd()?(PROD_LBL[gProd()]||gProd()):gCanal()?gCanal():gCart()?gCart():bu?bu:(SEG_LBL[segK]||segK||'Filtrado');
    labels = [filtLbl];
    getRaw = s => [sa(getSeries(s).slice(lo,hi))];
  } else {
    labels = mlabs;
    getRaw = s => mops.map(m => { const arr=D.scenarios[s].by_mop[m]; return arr?sa(arr.slice(lo,hi)):0; });
  }
  const getData = s => {
    const raw = getRaw(s);
    if (!isPct) return raw.map(v=>v/1e9);
    const tot = sa(getSeries(s).slice(lo,hi));
    return raw.map(v=>tot>0?+(v/tot*100).toFixed(2):0);
  };
  charts.mop = new Chart(ctx,{
    type:'bar', plugins:[ChartDataLabels],
    data:{labels, datasets:scens.map(s=>({label:names[s],data:getData(s),backgroundColor:CC[s]+'AA',hidden:hidden.has(s)}))},
    options:{
      responsive:true,
      indexAxis:'y',
      plugins:{
        legend:{display:true,labels:{font:{size:9.5},boxWidth:9,padding:6}},
        tooltip:{backgroundColor:'#111827',titleColor:'#F9FAFB',bodyColor:'#D1D5DB',padding:10,cornerRadius:10,
          callbacks:{label:c=>` ${c.dataset.label}: ${isPct?c.parsed.x.toFixed(1)+'%':'R$ '+c.parsed.x.toFixed(1)+'B'}`}},
        datalabels:{anchor:'end',align:'end',font:{size:8.5,weight:700},
          formatter:v=>v>0?(isPct?v.toFixed(1)+'%':v.toFixed(1)):'',color:'#374151',
          display:ctx=>ctx.chart.data.datasets.filter(d=>!d.hidden).length<=3},
      },
      scales:{
        x:{grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{size:10},callback:v=>isPct?v.toFixed(0)+'%':v+'B'}},
        y:{grid:{display:false},ticks:{font:{size:10}}}
      }
    },
  });
}

function barOpts() {
  return {
    responsive:true,
    plugins:{
      legend:{display:true,labels:{font:{size:9.5},boxWidth:9,padding:6}},
      tooltip:{backgroundColor:'#111827',titleColor:'#F9FAFB',bodyColor:'#D1D5DB',padding:10,cornerRadius:10,
        callbacks:{label:c=>` ${c.dataset.label}: R$ ${(c.parsed.y??c.parsed.x??0).toFixed(1)}B`}},
      datalabels:{anchor:'end',align:'end',font:{size:8.5,weight:700},
        formatter:v=>v>0?v.toFixed(1):'',color:'#374151',
        display:ctx=>ctx.chart.data.datasets.filter(d=>!d.hidden).length<=3},
    },
    scales:{
      x:{grid:{display:false},ticks:{font:{size:10}}},
      y:{grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{size:10},color:'#6B7280',callback:v=>v+'B'}}
    }
  };
}

// ── TABLE ────────────────────────────────────────────────────────────────────
function renderTable() {
  const [lo,hi] = getRange();
  const labels = D.labels.slice(lo,hi);
  const acFull  = getSeries('actual');
  const f48Full = getSeries('f48');
  const f39Full = getSeries('f39');
  const plFull  = getSeries('plano2026');

  // Override F4+8 Jan-Apr 2026 and F3+9 Jan-Mar 2026 with actual
  const f48Eff = f48Full.map((v,i)=>(i>=12&&i<=15&&acFull[i])?acFull[i]:v);
  const f39Eff = f39Full.map((v,i)=>(i>=12&&i<=14&&acFull[i])?acFull[i]:v);

  const prods   = ['CHECKOUT','LINK','POINT','QR','TTP'];
  const prodLbl = {CHECKOUT:'Checkout',LINK:'Link',POINT:'Point',QR:'QR',TTP:'TTP'};

  $id('tHead').innerHTML = `<th>Mês</th>
    <th class="num">2025</th><th class="num">Actual</th><th class="num">F 4+8</th>
    <th class="num">F 3+9</th><th class="num">Plano 2026</th>
    <th class="num">Δ F4+8 vs F3+9</th><th class="num">Δ F4+8 vs Plano</th>
    <th class="num">Δ F4+8 vs 2025</th>`;

  const nil = '<span style="color:var(--sub)">—</span>';
  const fR  = v => v ? `R$ ${fmtB(v)}` : nil;
  const fDl = v => v===null?nil:`<span class="${v>=0?'pos':'neg'}">${v>=0?'+':''}${v.toFixed(1)}%</span>`;
  const dlt = (a,b) => fDl(a&&b?pctN(a,b):null);
  const sh  = (v,tot) => tot>0?`<em class="sh">${(v/tot*100).toFixed(1)}%</em>`:'';

  $id('tBody').innerHTML = labels.map((lbl,i) => {
    const gi    = lo+i;
    const isAc  = gi<=LAST_AC;
    const is26  = gi>=12;
    const ac    = acFull[gi];
    const f48   = f48Eff[gi];
    const f39   = f39Eff[gi];
    const pl    = plFull[gi];
    const ac25  = is26 ? acFull[gi-12] : null;   // same month 2025
    const open  = expandedMonths.has(gi);

    let rows = `<tr style="cursor:pointer" onclick="toggleDrill(${gi})">
      <td><span class="arr ${open?'open':''}">▶</span><strong>${lbl}</strong>${isAc?' <span class="badge bac">A</span>':''}</td>
      <td class="num">${fR(ac25)}</td>
      <td class="num">${fR(ac)}</td><td class="num">${fR(f48)}</td>
      <td class="num">${fR(f39)}</td><td class="num">${fR(pl)}</td>
      <td class="num">${dlt(f48,f39)}</td>
      <td class="num">${dlt(f48,pl)}</td>
      <td class="num">${is26?dlt(f48,ac25):nil}</td>
    </tr>`;

    if (open) {
      const useAc48 = gi>=12&&gi<=15&&!!acFull[gi];
      const useAc39 = gi>=12&&gi<=14&&!!acFull[gi];
      const getP = (scen,prod,useAc) => { const src=useAc?'actual':scen; return (D.scenarios[src].by_product[prod]||[])[gi]||0; };
      const getBuT = (scen,buK) => { const key=(BU_KEY[scen]||{})[buK]||buK; return (D.scenarios[scen].by_bu[key]||[])[gi]||0; };
      const BU_GROUPS = [
        {bu:'POINT',label:'POINT',prods:[{k:'POINT',l:'Device'},{k:'TTP',l:'TTP'}]},
        {bu:'OP',   label:'OP',   prods:[{k:'LINK',l:'Link'},{k:'CHECKOUT',l:'Checkout'}]},
        {bu:'QR',   label:'QR',   prods:[{k:'QR',l:'QR'}]},
      ];
      BU_GROUPS.forEach(grp=>{
        const buA  = getBuT('actual',grp.bu);
        const buF48= getBuT('f48',grp.bu);
        const buF39= getBuT('f39',grp.bu);
        const buPl = getBuT('plano2026',grp.bu);
        const buA25= is26?((D.scenarios.actual.by_bu[(BU_KEY.actual||{})[grp.bu]||grp.bu]||[])[gi-12]||0):0;
        if(!buA&&!buF48&&!buF39&&!buPl&&!buA25) return;
        rows+=`<tr class="drill" style="font-weight:600">
          <td>↳ ${grp.label}</td>
          <td class="num">${buA25?fmtBs(buA25)+' '+sh(buA25,ac25||1):nil}</td>
          <td class="num">${buA?fmtBs(buA)+' '+sh(buA,ac||1):nil}</td>
          <td class="num">${buF48?fmtBs(buF48)+' '+sh(buF48,f48||1):nil}</td>
          <td class="num">${buF39?fmtBs(buF39)+' '+sh(buF39,f39||1):nil}</td>
          <td class="num">${buPl?fmtBs(buPl)+' '+sh(buPl,pl||1):nil}</td>
          <td class="num" colspan="3"></td></tr>`;
        if(grp.prods.length>1) grp.prods.forEach(({k,l})=>{
          const pA  = (D.scenarios.actual.by_product[k]||[])[gi]||0;
          const pF48= getP('f48',k,useAc48), pF39=getP('f39',k,useAc39);
          const pPl = (D.scenarios.plano2026.by_product[k]||[])[gi]||0;
          const p25 = is26?(D.scenarios.actual.by_product[k]||[])[gi-12]||0:0;
          if(!pA&&!pF48&&!pF39&&!pPl&&!p25) return;
          rows+=`<tr class="drill">
            <td style="padding-left:26px">↳ ${l}</td>
            <td class="num">${p25?fmtBs(p25)+' '+sh(p25,buA25||1):nil}</td>
            <td class="num">${pA?fmtBs(pA)+' '+sh(pA,buA||1):nil}</td>
            <td class="num">${pF48?fmtBs(pF48)+' '+sh(pF48,buF48||1):nil}</td>
            <td class="num">${pF39?fmtBs(pF39)+' '+sh(pF39,buF39||1):nil}</td>
            <td class="num">${pPl?fmtBs(pPl)+' '+sh(pPl,buPl||1):nil}</td>
            <td class="num" colspan="3"></td></tr>`;
        });
      });
    }
    return rows;
  }).join('');
}

// ── MASTER RENDER ────────────────────────────────────────────────────────────
function render() {
  updateNote();
  renderKPIs();
  renderMain();
  renderMopTrend();
  renderSeg();
  renderMop();
  renderTable();
  renderCmp();
}

// ── CONTROLS ─────────────────────────────────────────────────────────────────
function setYr(btn) {
  document.querySelectorAll('.rb[data-yr]').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  activeYr = btn.dataset.yr;
  render();
}

function toggleChartMode() { /* removed */ }

function toggleDrill(gi) {
  if (expandedMonths.has(gi)) expandedMonths.delete(gi);
  else expandedMonths.add(gi);
  renderTable();
}

function toggleYoY25() {
  yoy25 = !yoy25;
  if (yoy25) yoyGr = false;
  $id('btnYoY25').classList.toggle('on', yoy25);
  $id('btnYoYGr').classList.remove('on');
  renderMain();
}

function toggleYoYGr() {
  yoyGr = !yoyGr;
  if (yoyGr) yoy25 = false;
  $id('btnYoYGr').classList.toggle('on', yoyGr);
  $id('btnYoY25').classList.remove('on');
  renderMain();
}

function toggleScen(pill) {
  const s = pill.dataset.s;
  if (hidden.has(s)) { hidden.delete(s); pill.classList.remove('off'); }
  else               { hidden.add(s);    pill.classList.add('off');    }
  render();
}

$id('themeBtn').onclick = () => {
  const d = document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',d?'':'dark');
  $id('themeBtn').textContent = d?'🌙':'☀️';
  render();
};

Chart.register(ChartDataLabels);
render();
$id('btnYoY25').classList.add('on');
</script>
