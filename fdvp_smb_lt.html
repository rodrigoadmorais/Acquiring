<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FDVP | SMB & LT</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; background: #f0f0f0; padding: 20px; }
  .page { max-width: 1200px; margin: 0 auto; background: #fff; padding: 24px 28px 32px; border-radius: 4px; }

  /* Header */
  .top-bar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
  .header-title { font-size: 20px; font-weight: bold; color: #222; }
  .header-sub { font-size: 11px; color: #888; margin-top: 3px; }
  .header-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .tag { border: 1.5px solid #333; border-radius: 20px; padding: 4px 14px; font-size: 12px; font-weight: bold; color: #333; }

  /* Font controls */
  .controls { display: flex; gap: 4px; align-items: center; }
  .ctrl-btn {
    border: 1.5px solid #aaa; border-radius: 6px; background: #fff;
    cursor: pointer; color: #333; line-height: 1; padding: 4px 9px;
    font-family: Arial, sans-serif; font-size: 12px; transition: background .15s;
  }
  .ctrl-btn:hover { background: #f5f5f5; }
  .ctrl-btn.active { background: #FFE600; border-color: #bba000; font-weight: bold; }
  .ctrl-label { font-size: 11px; color: #888; margin-right: 2px; }
  .ctrl-select {
    border: 1.5px solid #aaa; border-radius: 6px; background: #fff;
    color: #333; font-family: Arial, sans-serif; font-size: 12px;
    padding: 4px 7px; cursor: pointer; outline: none;
  }
  .ctrl-select:hover { background: #f5f5f5; }

  /* Section header */
  .section-header {
    background: #222; color: #FFE600;
    font-weight: bold; font-size: 13px; letter-spacing: 0.5px;
    padding: 7px 14px; border-radius: 4px 4px 0 0;
    margin-top: 22px; margin-bottom: 0;
  }

  /* Grid — no gap between cards */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    border: 1px solid #ddd;
    border-top: none;
    border-radius: 0 0 4px 4px;
    overflow: hidden;
  }
  .card {
    background: #fff;
    border-right: 1px solid #ddd;
    border-bottom: 1px solid #ddd;
  }
  .card:nth-child(2n) { border-right: none; }
  .card:nth-last-child(-n+2) { border-bottom: none; }

  .card-title { background: #FFE600; color: #222; font-weight: bold; font-size: 13px; padding: 8px 16px; text-align: center; }
  .card-body { padding: 12px 14px 14px; height: 300px; position: relative; }
  .card-empty { display: flex; align-items: center; justify-content: center; color: #bbb; font-size: 13px; font-style: italic; }
</style>
</head>
<body>
<div class="page">

  <!-- TOP BAR -->
  <div class="top-bar">
    <div>
      <div class="header-title">FDVP | SMB &amp; LT</div>
      <div class="header-sub" id="lastUpdate">Carregando…</div>
    </div>
    <div class="header-right">
      <div class="controls">
        <span class="ctrl-label">De:</span>
        <select class="ctrl-select" id="startMonthSelect" onchange="setMonthRange()"></select>
        <span class="ctrl-label" style="margin-left:4px">Até:</span>
        <select class="ctrl-select" id="endMonthSelect" onchange="setMonthRange()"></select>
      </div>
      <div class="controls">
        <span class="ctrl-label">Rótulos:</span>
        <button class="ctrl-btn" onclick="changeSize(-1)" title="Diminuir fonte">A−</button>
        <button class="ctrl-btn" onclick="changeSize(1)"  title="Aumentar fonte">A+</button>
        <button class="ctrl-btn" id="btnBold" onclick="toggleBold()" title="Negrito">B</button>
      </div>
      <div class="tag">LC</div>
      <div class="tag">🌐 BRAZIL</div>
    </div>
  </div>

  <!-- FDVP SECTION -->
  <div class="section-header">FDV PRÓPRIA</div>
  <div class="grid" id="gridFDVP">
    <div class="card"><div class="card-title">Investimento</div><div class="card-body"><canvas id="p1"></canvas></div></div>
    <div class="card"><div class="card-title">TPV M1 &amp; TPV Médio</div><div class="card-body"><canvas id="p2"></canvas></div></div>
    <div class="card"><div class="card-title">Headcount vs % Atingimento</div><div class="card-body"><canvas id="p3"></canvas></div></div>
    <div class="card"><div class="card-title">New Sellers (k)</div><div class="card-body"><canvas id="p4"></canvas></div></div>
  </div>

  <!-- FDVT SECTION -->
  <div class="section-header">FDV TERCEIRA</div>
  <div class="grid" id="gridFDVT">
    <div class="card"><div class="card-title">Investimento</div><div class="card-body"><canvas id="t1"></canvas></div></div>
    <div class="card"><div class="card-title">TPV M1 &amp; TPV Médio</div><div class="card-body"><canvas id="t2"></canvas></div></div>
    <div class="card"><div class="card-title">Headcount vs % Atingimento</div><div class="card-body"><canvas id="t3"></canvas></div></div>
    <div class="card"><div class="card-title">New Sellers (k)</div><div class="card-body"><canvas id="t4"></canvas></div></div>
  </div>

</div><!-- .page -->

<script>
Chart.register(ChartDataLabels);

// ─── STATE ──────────────────────────────────────────────────────────────────
let LABEL_SIZE  = 9;
let LEGEND_SIZE = 10;
let LABEL_BOLD  = false;
let currentData = null;
let _lastRows = null;

// ─── CONSTANTS ──────────────────────────────────────────────────────────────
const YELLOW  = '#FFE600';
const DARK    = '#222222';

const MONTH_NAMES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const DEFAULT_START_MONTH = '202502';
const DEFAULT_END_MONTH = '202603';

function monthLabel(monthKey) {
  const year = String(monthKey).slice(0, 4);
  const month = parseInt(String(monthKey).slice(4, 6), 10);
  return `${MONTH_NAMES[month - 1]}/${year.slice(2)}`;
}

function buildMonthKeys(start, end) {
  const startYear = parseInt(start.slice(0, 4), 10);
  const startMonth = parseInt(start.slice(4, 6), 10);
  const endYear = parseInt(end.slice(0, 4), 10);
  const endMonth = parseInt(end.slice(4, 6), 10);
  const keys = [];
  for (let year = startYear; year <= endYear; year++) {
    const from = year === startYear ? startMonth : 1;
    const to = year === endYear ? endMonth : 12;
    for (let month = from; month <= to; month++) {
      keys.push(`${year}${String(month).padStart(2, '0')}`);
    }
  }
  return keys;
}

function monthKeysFromRows(rows) {
  const discovered = new Set(ALL_MONTHS);
  rows.forEach(row => {
    Object.keys(row).forEach(key => {
      if (/^20\d{4}$/.test(key)) discovered.add(key);
    });
  });
  return [...discovered].sort();
}

let ALL_MONTHS = buildMonthKeys('202501', '202612');
let MONTH_LABELS = Object.fromEntries(ALL_MONTHS.map(m => [m, monthLabel(m)]));
let MONTHS = ALL_MONTHS.slice(ALL_MONTHS.indexOf(DEFAULT_START_MONTH), ALL_MONTHS.indexOf(DEFAULT_END_MONTH) + 1); // default: Fev/25-Mar/26

function setMonthRange() {
  const startSel = document.getElementById('startMonthSelect');
  const endSel   = document.getElementById('endMonthSelect');
  const si = ALL_MONTHS.indexOf(startSel.value);
  const ei = ALL_MONTHS.indexOf(endSel.value);
  if (si < 0 || ei < 0 || si > ei) return;
  MONTHS = ALL_MONTHS.slice(si, ei + 1);
  if (_lastRows) { currentData = compute(_lastRows); renderCharts(currentData); }
}

function buildMonthSelect(previousStart = DEFAULT_START_MONTH, previousEnd = DEFAULT_END_MONTH) {
  const startSel = document.getElementById('startMonthSelect');
  const endSel   = document.getElementById('endMonthSelect');
  startSel.innerHTML = '';
  endSel.innerHTML = '';
  const selectedStart = ALL_MONTHS.includes(previousStart) ? previousStart : ALL_MONTHS[0];
  const selectedEnd = ALL_MONTHS.includes(previousEnd) ? previousEnd : ALL_MONTHS[ALL_MONTHS.length - 1];
  ALL_MONTHS.forEach(m => {
    const label = MONTH_LABELS[m];
    const o1 = new Option(label, m, m === selectedStart, m === selectedStart);
    const o2 = new Option(label, m, m === selectedEnd, m === selectedEnd);
    startSel.appendChild(o1);
    endSel.appendChild(o2);
  });
}

function syncMonthControls(rows) {
  const currentStart = document.getElementById('startMonthSelect').value || DEFAULT_START_MONTH;
  const currentEnd = document.getElementById('endMonthSelect').value || DEFAULT_END_MONTH;
  ALL_MONTHS = monthKeysFromRows(rows);
  MONTH_LABELS = Object.fromEntries(ALL_MONTHS.map(m => [m, monthLabel(m)]));
  buildMonthSelect(currentStart, currentEnd);
  setMonthRange();
}

// ─── CONTROLS ───────────────────────────────────────────────────────────────
function changeSize(d) {
  LABEL_SIZE  = Math.max(7, Math.min(16, LABEL_SIZE  + d));
  LEGEND_SIZE = Math.max(8, Math.min(17, LEGEND_SIZE + d));
  if (currentData) renderCharts(currentData);
}
function toggleBold() {
  LABEL_BOLD = !LABEL_BOLD;
  document.getElementById('btnBold').classList.toggle('active', LABEL_BOLD);
  if (currentData) renderCharts(currentData);
}

// ─── HELPERS ────────────────────────────────────────────────────────────────
function num(v) {
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return isNaN(v) ? 0 : v;
  // String path: handle European format "1.234.567,89" → remove thousand dots, swap comma
  const s = String(v).trim();
  const n = parseFloat(s.replace(/\./g,'').replace(',','.'));
  return isNaN(n) ? 0 : n;
}
function findRow(rows, metric, scenario, canal) {
  return rows.find(r => r.metric === metric &&
    (scenario === null || r.scenario === scenario) &&
    (canal === null || r.canal === canal)) || {};
}
function lf() { return { size: LABEL_SIZE,  weight: LABEL_BOLD ? 'bold' : 'normal' }; }
function lgf(){ return { size: LEGEND_SIZE, weight: LABEL_BOLD ? 'bold' : 'normal' }; }

// ─── COMPUTE ────────────────────────────────────────────────────────────────
function compute(rows) {
  const r = (m, s, c) => findRow(rows, m, s, c);
  const v = (row, m) => num(row[m]);

  // FDVP: INV = |PP + Ventas|
  const invPP = r('INV_PP','R','FDVP'), invV = r('INV_V','R','FDVP');
  const invTP = r('INV_TP','R','FDVT');

  const p_inv  = MONTHS.map(m => Math.abs(v(invPP,m) + v(invV,m)) / 1e6);
  const t_inv  = MONTHS.map(m => -v(invTP,m) / 1e6);

  const tpvP  = r('TPV','R','FDVP'), tpvT = r('TPV','R','FDVT');
  const tmedP = r('TMED','R','FDVP'), tmedT = r('TMED','R','FDVT');
  const nsP   = r('NS','R','FDVP'),   nsT  = r('NS','R','FDVT');
  const hcR   = r('HC','R','FDVP'),   hcPl  = r('HC','P','FDVP');
  const hcRT  = r('HC','R','FDVT'),   hcPlt = r('HC','P','FDVT');

  const p_tpv  = MONTHS.map(m => +(v(tpvP,m)/1e6).toFixed(1));
  const p_tmed = MONTHS.map(m => +(v(tmedP,m)/1000).toFixed(1));
  const t_tpv  = MONTHS.map(m => +(v(tpvT,m)/1e6).toFixed(1));
  const t_tmed = MONTHS.map(m => +(v(tmedT,m)/1000).toFixed(1));

  const hcReal   = MONTHS.map(m => Math.round(v(hcR,m)));
  const hcPlan   = MONTHS.map(m => Math.round(v(hcPl,m)));
  const pct      = hcReal.map((r,i) => hcPlan[i]>0 ? +(r/hcPlan[i]*100).toFixed(1) : 0);

  const t_hcReal = MONTHS.map(m => Math.round(v(hcRT,m)));
  const t_hcPlan = MONTHS.map(m => Math.round(v(hcPlt,m)));
  const t_pct    = t_hcReal.map((r,i) => t_hcPlan[i]>0 ? +(r/t_hcPlan[i]*100).toFixed(1) : 0);

  const p_ns = MONTHS.map(m => +((v(nsP,m))/1000).toFixed(1));
  const t_ns = MONTHS.map(m => +((v(nsT,m))/1000).toFixed(1));

  return { p_inv, t_inv, p_tpv, p_tmed, t_tpv, t_tmed, hcReal, pct, t_hcReal, t_pct, p_ns, t_ns };
}

// ─── CHART FACTORY ──────────────────────────────────────────────────────────
const instances = {};
function destroyAll() {
  Object.keys(instances).forEach(k => { instances[k].destroy(); delete instances[k]; });
}

// X axis: FIXED font — never changes with A+/A- buttons
const xAxis = () => ({
  grid: { display: false },
  ticks: { font: { size: 10 }, maxRotation: 0, autoSkip: false }
});
const yHide = { display: false, grid: { display: false } };

// Bar-only chart
function barChart(id, data, fmtFn) {
  if (!document.getElementById(id)) return;
  instances[id] = new Chart(document.getElementById(id), {
    type: 'bar',
    data: {
      labels: MONTHS.map(m => MONTH_LABELS[m]),
      datasets: [{
        data,
        backgroundColor: YELLOW,
        borderRadius: 3,
        datalabels: {
          display: true, anchor: 'end', align: 'end', offset: 2,
          formatter: fmtFn,
          font: lf(), color: DARK
        }
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: xAxis(),
        y: { ...yHide, suggestedMax: Math.max(...data) * 1.4 }
      },
      layout: { padding: { top: 30 } }
    }
  });
}

// Combo bar+line — escala dupla engenheirada:
//   y  (barras): max = barMax × 2.5  → barras ocupam até ~40% da altura visual
//   y1 (linha) : escala calculada para que a linha apareça na faixa 60–87%
//   Resultado: rótulos de barras (acima das barras, ~42%) e de linha (acima
//   dos pontos, 62–89%) ficam sempre separados por ~20% de altura (≈60 px).
function comboChart(id, barData, rawLine, barFmt, lineFmt, lineDash) {
  if (!document.getElementById(id)) return;

  const barMax = Math.max(...barData.filter(v => v > 0), 1);
  const lMin   = Math.min(...rawLine);
  const lMax   = Math.max(...rawLine.filter(v => v > 0), 1);

  // y-axis: barras no terço inferior do gráfico
  const yMax = barMax * 2.5;

  // y1-axis: linha na faixa 60–87% da altura
  // Fórmula derivada de P = (v - minY1)/(maxY1 - minY1):
  //   para lMin em 60% → minY1 = (lMin - 0.60·maxY1) / 0.40
  const maxY1 = lMax * (lMax !== lMin ? 1.20 : 1.50);
  const minY1 = (lMin - 0.60 * maxY1) / 0.40;

  const lineLabel = (id === 'p3' || id === 't3') ? '% Atingimento' : 'TPV Médio (K)';
  const barLabel  = id.startsWith('p') ? 'FDVP' : 'FDVT';

  instances[id] = new Chart(document.getElementById(id), {
    data: {
      labels: MONTHS.map(m => MONTH_LABELS[m]),
      datasets: [
        {
          type: 'bar',
          label: barLabel,
          data: barData,
          backgroundColor: YELLOW,
          borderRadius: 3,
          order: 2,
          yAxisID: 'y',
          datalabels: {
            display: true, anchor: 'end', align: 'end', offset: 3,
            formatter: barFmt, font: lf(), color: DARK
          }
        },
        {
          type: 'line',
          label: lineLabel,
          data: rawLine,          // valores reais — sem transformação
          borderColor: DARK, backgroundColor: DARK,
          pointBackgroundColor: DARK,
          pointBorderColor: '#fff', pointBorderWidth: 2,
          pointRadius: 5, pointHoverRadius: 6,
          borderWidth: 2.5, fill: false, tension: 0,
          borderDash: lineDash ? [5,4] : [],
          order: 1,
          yAxisID: 'y1',
          datalabels: {
            display: true, anchor: 'end', align: 'top', offset: 3,
            formatter: lineFmt, font: lf(), color: DARK
          }
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      clip: false,
      plugins: {
        legend: {
          display: true, position: 'bottom',
          labels: { boxWidth: 12, font: lgf(), padding: 8 }
        },
        tooltip: { mode: 'index', intersect: false }
      },
      scales: {
        x: xAxis(),
        y:  { ...yHide, min: 0, max: yMax },
        y1: { ...yHide, min: minY1, max: maxY1 }
      },
      layout: { padding: { top: 46 } }
    }
  });
}

// ─── RENDER ─────────────────────────────────────────────────────────────────
function renderCharts(d) {
  destroyAll();

  // ── FDVP ──
  // P1: Investimento FDVP
  barChart('p1', d.p_inv, v => v.toFixed(1)+'M');

  // P2: TPV FDVP + TPV Médio FDVP
  comboChart('p2', d.p_tpv, d.p_tmed,
    v => v.toFixed(0)+'M',
    v => v.toFixed(1)+'K',
    false
  );

  // P3: HC FDVP + % Atingimento
  comboChart('p3', d.hcReal, d.pct,
    v => v.toLocaleString('pt-BR'),
    v => v.toFixed(0)+'%',
    true
  );

  // P4: New Sellers FDVP
  barChart('p4', d.p_ns, v => v.toFixed(1));

  // ── FDVT ──
  // T1: Investimento FDVT
  barChart('t1', d.t_inv, v => v.toFixed(1)+'M');

  // T2: TPV FDVT + TPV Médio FDVT
  comboChart('t2', d.t_tpv, d.t_tmed,
    v => v.toFixed(0)+'M',
    v => v.toFixed(1)+'K',
    false
  );

  // T3: HC FDVT + % Atingimento
  comboChart('t3', d.t_hcReal, d.t_pct,
    v => v.toLocaleString('pt-BR'),
    v => v.toFixed(0)+'%',
    true
  );

  // T4: New Sellers FDVT
  barChart('t4', d.t_ns, v => v.toFixed(1));
}

// ─── RAW N8N PARSER ─────────────────────────────────────────────────────────
function parseRaw(rows) {
  try {
    const sampleRow = rows.find(r => r.row_number !== undefined);
    if (!sampleRow) return null;
    const keys = Object.keys(sampleRow).filter(k => k !== 'row_number');
    const col0 = keys[0], col1 = keys[1], col2 = keys[2];
    let monthColMap = {};
    rows.forEach(row => {
      const c2 = String(row[col2]||'').trim();
      if (['CANAL_AJUSTADO','CANAL','MNG_4'].includes(c2)) {
        keys.slice(3).forEach(k => {
          const v = String(row[k]||'').trim().replace(/[.\s]/g,'');
          if (/^2025\d{2}$|^2026\d{2}$/.test(v)) monthColMap[k] = v;
        });
      }
    });
    if (!Object.keys(monthColMap).length) return null;
    function em(row) {
      const out = {};
      Object.entries(monthColMap).forEach(([k,m]) => {
        const raw = row[k];
        // Values from Verdi are already JS numbers — use directly to avoid
        // decimal-point stripping (e.g. -14720227.29 → -1472022729 if stringified)
        const n = typeof raw === 'number' ? raw
                : parseFloat(String(raw||'0').trim().replace(/\s/g,'').replace(',','.'));
        out[m] = isNaN(n) ? 0 : n;
      });
      return out;
    }
    const clean = [];
    rows.forEach(row => {
      const c0 = String(row[col0]||'').trim();
      const c1 = String(row[col1]||'').trim();
      const c2 = String(row[col2]||'').trim();
      const months = em(row);
      if (c0==='New Sellers') {
        clean.push({ metric:'NS', scenario:'R', canal:/PROPRIA|PROPIA|FDVP/i.test(c2)?'FDVP':'FDVT', ...months });
      } else if (c0==='Investimento') {
        const sc = /realizado/i.test(c1)?'R':'P';
        if (/Propia Point/i.test(c2))  clean.push({ metric:'INV_PP', scenario:sc, canal:'FDVP', ...months });
        if (/^Fuerza de Ventas$/i.test(c2)) clean.push({ metric:'INV_V', scenario:sc, canal:'FDVP', ...months });
        if (/Terceros/i.test(c2))       clean.push({ metric:'INV_TP', scenario:sc, canal:'FDVT', ...months });
      } else if (c0==='HCs') {
        const sc = /realizado/i.test(c1)?'R':'P';
        if (/FDVP/i.test(c2)) clean.push({ metric:'HC', scenario:sc, canal:'FDVP', ...months });
      } else if (c0==='TPV M0') {
        const sc = /realizado/i.test(c1)?'R':'P';
        if (/PROPRIA|PROPIA|FDVP/i.test(c2)) clean.push({ metric:'TPV', scenario:sc, canal:'FDVP', ...months });
        if (/TERCEIRA|FDVT/i.test(c2))       clean.push({ metric:'TPV', scenario:sc, canal:'FDVT', ...months });
      } else if (/TPV.*M[EÉ]D/i.test(c0)) {
        const sc = /realizado/i.test(c1)?'R':'P';
        if (/PROPRIA|PROPIA|FDVP/i.test(c2)) clean.push({ metric:'TMED', scenario:sc, canal:'FDVP', ...months });
        if (/TERCEIRA|FDVT/i.test(c2))       clean.push({ metric:'TMED', scenario:sc, canal:'FDVT', ...months });
      }
    });
    return clean.length >= 4 ? clean : null;
  } catch(e) { return null; }
}

// ─── DEFAULT DATA ────────────────────────────────────────────────────────────
const DEFAULT_ROWS = [
  {"metric":"NS","scenario":"R","canal":"FDVP","202501":4495,"202502":9641,"202503":6032,"202504":6875,"202505":8000,"202506":9270,"202507":9831,"202508":10110,"202509":10974,"202510":12141,"202511":12264,"202512":10854,"202601":11294,"202602":11342,"202603":13002,"202604":4505},

// ─── INIT ────────────────────────────────────────────────────────────────────
async function init() {
  buildMonthSelect();
  _lastRows = DEFAULT_ROWS;
  currentData = compute(_lastRows);
  renderCharts(currentData);
  document.getElementById('lastUpdate').textContent = 'Dados embutidos';

  try {
    const resp = await fetch('fdvp_smb_lt_data.json?t=' + Date.now());
    if (!resp.ok) return;
    const raw = await resp.json();
    if (!Array.isArray(raw) || !raw.length) return;
    let rows = raw[0].metric !== undefined ? raw : parseRaw(raw);
    if (rows && rows.length >= 4) {
      // Inject static HC FDVT rows if the sheet doesn't have them
      const hasHcFdvt = rows.some(r => r.metric === 'HC' && r.canal === 'FDVT');
      if (!hasHcFdvt) {
        const hcFdvt = DEFAULT_ROWS.filter(r => r.metric === 'HC' && r.canal === 'FDVT');
        rows = [...rows, ...hcFdvt];
      }
      _lastRows = rows;
      syncMonthControls(_lastRows);
      const now = new Date().toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' });
      document.getElementById('lastUpdate').textContent = 'Atualizado: ' + now;
    }
  } catch(e) { console.warn('Fallback to default data:', e.message); }
}

init();
</script>
