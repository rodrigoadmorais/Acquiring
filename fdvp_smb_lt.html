<body>
<div class="page">

    </div>

    <div class="card"><div class="card-title">Headcount vs % Atingimento</div><div class="card-body"><canvas id="c3"></canvas></div></div>
    <div class="card"><div class="card-title">New Sellers (k)</div><div class="card-body"><canvas id="c4"></canvas></div></div>
  </div>

<script>
Chart.register(ChartDataLabels);

// ─── CONSTANTS ─────────────────────────────────────────────────────────────
const YELLOW = '#FFE600';
const DARK   = '#222222';
const YELLOW2 = '#FFC000';

const MONTH_LABELS = {
  '202501':'Jan/25','202502':'Fev/25','202503':'Mar/25','202504':'Abr/25',
  '202505':'Mai/25','202506':'Jun/25','202507':'Jul/25','202508':'Ago/25',
  '202509':'Set/25','202510':'Out/25','202511':'Nov/25','202512':'Dez/25',
  '202601':'Jan/26','202602':'Fev/26','202603':'Mar/26','202604':'Abr/26',
  '202605':'Mai/26','202606':'Jun/26','202607':'Jul/26','202608':'Ago/26'
};

// Display months: Fev/25 → Mar/26
const MONTHS = ['202502','202503','202504','202505','202506','202507',
                '202508','202509','202510','202511','202512','202601','202602','202603'];

// ─── HELPERS ────────────────────────────────────────────────────────────────
function num(v) {
  if (v === null || v === undefined || v === '') return 0;
  const n = parseFloat(String(v).replace(/\./g,'').replace(',','.'));
  return isNaN(n) ? 0 : n;
}

function findRow(rows, metric, scenario, canal) {
  return rows.find(r =>
    r.metric === metric &&
    (scenario === null || r.scenario === scenario) &&
    (canal === null || r.canal === canal)
  ) || {};
}

// ─── COMPUTE CHART DATA FROM ROWS ───────────────────────────────────────────
function compute(rows) {
  const invPP  = findRow(rows, 'INV_PP', 'R', 'FDVP');
  const invV   = findRow(rows, 'INV_V',  'R', 'FDVP');
  const invTP  = findRow(rows, 'INV_TP', 'R', 'FDVT');
  const tpvP   = findRow(rows, 'TPV',   'R', 'FDVP');
  const tpvT   = findRow(rows, 'TPV',   'R', 'FDVT');
  const tmedP  = findRow(rows, 'TMED',  'R', 'FDVP');
  const tmedT  = findRow(rows, 'TMED',  'R', 'FDVT');
  const nsP    = findRow(rows, 'NS',    'R', 'FDVP');
  const nsT    = findRow(rows, 'NS',    'R', 'FDVT');
  const hcR    = findRow(rows, 'HC',    'R', 'FDVP');
  const hcPl   = findRow(rows, 'HC',    'P', 'FDVP');

  const invFDVP  = MONTHS.map(m => Math.abs(num(invPP[m]) + num(invV[m])) / 1e6);
  const invFDVT  = MONTHS.map(m => Math.abs(num(invTP[m])) / 1e6);
  const invTotal = invFDVP.map((p, i) => +(p + invFDVT[i]).toFixed(2));

  const tpvM1 = MONTHS.map(m => +((num(tpvP[m]) + num(tpvT[m])) / 1e6).toFixed(1));
  const tpvMedio = MONTHS.map(m => {
    const totalTPV = num(tpvP[m]) + num(tpvT[m]);
    const totalNS  = num(nsP[m]) + num(nsT[m]);
    return totalNS > 0 ? +(totalTPV / totalNS / 1000).toFixed(1) : 0;
  });

  const hcReal  = MONTHS.map(m => num(hcR[m]));
  const hcPlan  = MONTHS.map(m => num(hcPl[m]));
  const pctAting = hcReal.map((r, i) => hcPlan[i] > 0 ? +(r / hcPlan[i] * 100).toFixed(1) : 0);

  const newSell = MONTHS.map(m => +((num(nsP[m]) + num(nsT[m])) / 1000).toFixed(1));

  return { invFDVP, invFDVT, invTotal, tpvM1, tpvMedio, hcReal, pctAting, newSell };
}

// ─── RAW N8N FORMAT PARSER (best-effort) ────────────────────────────────────
// Handles output from n8n Google Sheets node reading "FDVP e FDVT" tab.
// Searches rows for known keywords in first 4 columns.
function parseRaw(rows) {
  try {
    // n8n returns rows with {row_number, <header1>, col_2, col_3, ...}
    // Find the first named key (the sheet's row-1 header for col A)
    const sampleRow = rows.find(r => r.row_number);
    if (!sampleRow) return null;

    const keys = Object.keys(sampleRow).filter(k => k !== 'row_number');
    const col0 = keys[0]; // "Dado:" or equivalent
    const col1 = keys[1]; // "Cenario"
    const col2 = keys[2]; // "CANAL"

    // Build a month-column map by finding the header row
    // (row where col0 is empty and col2 looks like CANAL_AJUSTADO/MNG_4/CANAL,
    //  and the remaining columns contain 6-digit numbers like 202501)
    let monthColMap = {}; // colKey → "202501"
    rows.forEach(row => {
      const c2 = String(row[col2] || '').trim();
      if (c2 === 'CANAL_AJUSTADO' || c2 === 'CANAL' || c2 === 'MNG_4') {
        keys.slice(3).forEach(k => {
          const v = String(row[k] || '').trim().replace(/[.\s]/g,'');
          if (/^2025\d{2}$|^2026\d{2}$/.test(v)) monthColMap[k] = v;
        });
      }
    });

    if (Object.keys(monthColMap).length === 0) return null;

    // Helper: extract row data as { "202501": value, ... }
    function extractMonths(row) {
      const out = {};
      Object.entries(monthColMap).forEach(([k, m]) => {
        out[m] = parseFloat(String(row[k] || '0').replace(/[.\s]/g,'').replace(',','.')) || 0;
      });
      return out;
    }

    // Build clean rows
    const clean = [];

    rows.forEach(row => {
      const c0 = String(row[col0] || '').trim();
      const c1 = String(row[col1] || '').trim();
      const c2 = String(row[col2] || '').trim();
      const months = extractMonths(row);

      if (c0 === 'New Sellers') {
        const canal = /PROPRIA|PROPIA|FDVP/i.test(c2) ? 'FDVP' : 'FDVT';
        clean.push({ metric: 'NS', scenario: 'R', canal, ...months });
      } else if (c0 === 'Investimento') {
        const sc = /realizado/i.test(c1) ? 'R' : 'P';
        if (/Propia Point/i.test(c2))   clean.push({ metric: 'INV_PP', scenario: sc, canal: 'FDVP', ...months });
        if (/Ventas$/i.test(c2) && !/Terceros/i.test(c2) && !/Propia/i.test(c2))
          clean.push({ metric: 'INV_V', scenario: sc, canal: 'FDVP', ...months });
        if (/Terceros/i.test(c2))       clean.push({ metric: 'INV_TP', scenario: sc, canal: 'FDVT', ...months });
      } else if (c0 === 'HCs') {
        const sc = /realizado/i.test(c1) ? 'R' : 'P';
        if (/FDVP/i.test(c2))           clean.push({ metric: 'HC', scenario: sc, canal: 'FDVP', ...months });
      } else if (c0 === 'TPV M0') {
        const sc = /realizado/i.test(c1) ? 'R' : 'P';
        if (/PROPRIA|PROPIA|FDVP/i.test(c2)) clean.push({ metric: 'TPV', scenario: sc, canal: 'FDVP', ...months });
        if (/TERCEIRA|FDVT/i.test(c2))       clean.push({ metric: 'TPV', scenario: sc, canal: 'FDVT', ...months });
      } else if (/TPV.*MEDIO|TPV.*MED/i.test(c0)) {
        const sc = /realizado/i.test(c1) ? 'R' : 'P';
        if (/PROPRIA|PROPIA|FDVP/i.test(c2)) clean.push({ metric: 'TMED', scenario: sc, canal: 'FDVP', ...months });
        if (/TERCEIRA|FDVT/i.test(c2))       clean.push({ metric: 'TMED', scenario: sc, canal: 'FDVT', ...months });
      }
    });

    return clean.length >= 4 ? clean : null;
  } catch(e) {
    console.warn('parseRaw error:', e);
    return null;
  }
}

// ─── CHART INSTANCES ────────────────────────────────────────────────────────
const charts = {};

function destroyAll() {
  Object.keys(charts).forEach(k => { charts[k].destroy(); delete charts[k]; });
}

function renderCharts(d) {
  destroyAll();
  const labels = MONTHS.map(m => MONTH_LABELS[m]);
  const xAxis = { grid: { display: false }, ticks: { font: { size: 10 }, maxRotation: 0, autoSkip: false } };
  const yHide = { display: false, grid: { display: false } };

  // ── Chart 1: Investimento ────────────────────────────────────────────────
  charts.c1 = new Chart(document.getElementById('c1'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          label: 'FDVP',
          data: d.invFDVP,
          backgroundColor: YELLOW,
          borderRadius: 0,
          stack: 'inv',
          datalabels: { display: false }
        },
        {
          label: 'FDVT',
          data: d.invFDVT,
          backgroundColor: YELLOW2,
          borderRadius: 2,
          stack: 'inv',
          datalabels: {
            display: true,
            anchor: 'end', align: 'top',
            formatter: (_, ctx) => d.invTotal[ctx.dataIndex].toFixed(1) + 'M',
            font: { size: 9, weight: 'bold' }, color: DARK
          }
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: true, position: 'bottom', labels: { boxWidth: 12, font: { size: 10 }, padding: 8 } },
        tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: R$ ${ctx.parsed.y.toFixed(1)}M` } }
      },
      scales: { x: xAxis, y: { ...yHide, stacked: true, suggestedMax: Math.max(...d.invTotal) * 1.28 } },
      layout: { padding: { top: 22 } }
    }
  });

  // ── Chart 2: TPV M1 & TPV Médio ─────────────────────────────────────────
  charts.c2 = new Chart(document.getElementById('c2'), {
    data: {
      labels,
      datasets: [
        {
          type: 'bar', label: 'TPV M1 (M)', data: d.tpvM1,
          backgroundColor: YELLOW, borderRadius: 2, yAxisID: 'y',
          datalabels: { display: true, anchor: 'end', align: 'top',
            formatter: v => v.toFixed(0), font: { size: 9, weight: 'bold' }, color: DARK }
        },
        {
          type: 'line', label: 'TPV Médio (K)', data: d.tpvMedio,
          borderColor: DARK, backgroundColor: DARK, pointBackgroundColor: DARK,
          pointRadius: 4, borderWidth: 2, fill: false, tension: 0, yAxisID: 'y1',
          datalabels: { display: true, anchor: 'end', align: 'top', offset: 2,
            formatter: v => v.toFixed(1), font: { size: 9, weight: 'bold' }, color: DARK }
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: true, position: 'bottom', labels: { boxWidth: 12, font: { size: 10 }, padding: 8 } },
        tooltip: { mode: 'index', intersect: false }
      },
      scales: {
        x: xAxis,
        y:  { ...yHide, suggestedMax: Math.max(...d.tpvM1) * 1.3 },
        y1: { ...yHide, suggestedMax: Math.max(...d.tpvMedio) * 1.5, suggestedMin: 0 }
      },
      layout: { padding: { top: 22 } }
    }
  });

  // ── Chart 3: HC vs % Atingimento ─────────────────────────────────────────
  charts.c3 = new Chart(document.getElementById('c3'), {
    data: {
      labels,
      datasets: [
        {
          type: 'bar', label: 'HC Real', data: d.hcReal,
          backgroundColor: YELLOW, borderRadius: 2, yAxisID: 'y',
          datalabels: { display: true, anchor: 'end', align: 'top',
            formatter: v => v.toLocaleString('pt-BR'), font: { size: 9, weight: 'bold' }, color: DARK }
        },
        {
          type: 'line', label: '% Atingimento', data: d.pctAting,
          borderColor: DARK, backgroundColor: DARK, pointBackgroundColor: DARK,
          pointRadius: 4, borderWidth: 2, borderDash: [5, 4], fill: false, tension: 0, yAxisID: 'y1',
          datalabels: { display: true, anchor: 'end', align: 'top', offset: 2,
            formatter: v => v.toFixed(0) + '%', font: { size: 9, weight: 'bold' }, color: DARK }
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: true, position: 'bottom', labels: { boxWidth: 12, font: { size: 10 }, padding: 8 } },
        tooltip: { mode: 'index', intersect: false }
      },
      scales: {
        x: xAxis,
        y:  { ...yHide, suggestedMax: Math.max(...d.hcReal) * 1.28 },
        y1: { ...yHide, suggestedMax: 130, suggestedMin: 60 }
      },
      layout: { padding: { top: 22 } }
    }
  });

  // ── Chart 4: New Sellers ──────────────────────────────────────────────────
  charts.c4 = new Chart(document.getElementById('c4'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: d.newSell, backgroundColor: YELLOW, borderRadius: 2,
        datalabels: { display: true, anchor: 'end', align: 'top',
          formatter: v => v.toFixed(1), font: { size: 9, weight: 'bold' }, color: DARK }
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => `New Sellers: ${ctx.parsed.y.toFixed(1)}k` } }
      },
      scales: { x: xAxis, y: { ...yHide, suggestedMax: Math.max(...d.newSell) * 1.28 } },
      layout: { padding: { top: 22 } }
    }
  });
}

// ─── INIT ────────────────────────────────────────────────────────────────────
async function init() {
  // Render immediately with embedded data
  renderCharts(compute(DEFAULT_ROWS));
  document.getElementById('lastUpdate').textContent = 'Dados embutidos (offline)';

  // Try to load fresh JSON from GitHub
  try {
    const resp = await fetch('fdvp_smb_lt_data.json?t=' + Date.now());
    if (!resp.ok) return;
    const raw = await resp.json();
    if (!Array.isArray(raw) || raw.length === 0) return;

    let rows = null;
    if (raw[0].metric !== undefined) {
      rows = raw; // clean format
    } else if (raw[0].row_number !== undefined) {
      rows = parseRaw(raw); // raw n8n format
    }

    if (rows && rows.length >= 4) {
      renderCharts(compute(rows));
      const now = new Date().toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' });
      document.getElementById('lastUpdate').textContent = 'Atualizado: ' + now;
    }
  } catch(e) {
    console.warn('Usando dados embutidos:', e.message);
  }
}

init();
