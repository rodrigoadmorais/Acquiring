<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado Pago - Performance Canais TPV</title>
    
    <!-- Integración de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuración de identidad visual de Mercado Pago -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mpBlue: '#009EE3',
                        mpDark: '#2D3277',
                        mpBg: '#F5F5F5',
                        mpGreen: '#00a650',
                        mpRed: '#FF6060'
                    },
                    fontFamily: {
                        sans: ['"Proxima Nova"', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Integración de Chart.js y DataLabels -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>

    <style>
        body {
            background-color: #F5F5F5;
        }
        .card-shadow {
            box-shadow: 0 1px 2px 0 rgba(0,0,0,.15);
        }
        /* Estilos del Loader */
        #loader {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.8);
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .spinner {
            border: 4px solid rgba(0, 158, 227, 0.3);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #009EE3;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen flex flex-col">

    <!-- Pantalla de carga mientras se obtienen datos de GitHub -->
    <div id="loader">
        <div class="spinner mb-4"></div>
        <h2 class="text-xl font-bold text-gray-700">Cargando datos desde GitHub...</h2>
    </div>

    <!-- Encabezado (Header) -->
    <header class="bg-mpBlue text-white p-4 shadow-md flex justify-between items-center shrink-0">
        <div class="flex items-center space-x-3">
            <!-- Icono simplificado de Mercado Pago -->
            <svg class="w-8 h-8 fill-current text-white" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9c0-.28.22-.5.5-.5h1c.28 0 .5.22.5.5v9c0 .28-.22.5-.5.5h-1c-.28 0-.5-.22-.5-.5z" opacity="0.3"/>
                <path d="M14.5 9h-5c-.28 0-.5.22-.5.5v9c0 .28.22.5.5.5h1c.28 0 .5-.22.5-.5v-4h3.5c1.93 0 3.5-1.57 3.5-3.5S16.43 9 14.5 9zm0 5.5h-3.5v-4H14.5c1.1 0 2 .9 2 2s-.9 2-2 2z"/>
            </svg>
            <h1 class="text-xl font-bold tracking-wide">Performance Canais TPV</h1>
        </div>
        <div class="text-sm font-medium bg-blue-600 px-3 py-1 rounded">
            Plano vs Actual
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-grow p-6 overflow-auto hidden" id="mainContent">
        
        <!-- Controles de Filtros y Exportación -->
        <div class="bg-white p-5 rounded-lg card-shadow mb-6 flex flex-col xl:flex-row items-start xl:items-center justify-between gap-4">
            <div class="flex flex-wrap items-center gap-6">
                <!-- Filtro de Canales -->
                <div class="flex items-center space-x-2">
                    <label for="channelSelector" class="font-semibold text-gray-700 text-sm md:text-base">Canal:</label>
                    <select id="channelSelector" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm md:text-base rounded-lg focus:ring-mpBlue focus:border-mpBlue block p-2 outline-none transition-colors">
                        <option value="ALL">Visión General (Todos)</option>
                        <option value="CANAIS DIGITAIS">Canais Digitais</option>
                        <option value="FDV PROPRIA">FDV Própria</option>
                        <option value="FDV TERCEIRA">FDV Terceira</option>
                        <option value="MGM">MGM</option>
                        <option value="PARTNERS ONLINE">Partners Online</option>
                        <option value="RESELLERS">Resellers</option>
                        <option value="TELEVENDAS">Televendas</option>
                    </select>
                </div>
                
                <!-- Filtro de Ciclo de Vida -->
                <div class="flex items-center space-x-2">
                    <label for="cicloSelector" class="font-semibold text-gray-700 text-sm md:text-base">Ciclo Vida:</label>
                    <select id="cicloSelector" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm md:text-base rounded-lg focus:ring-mpBlue focus:border-mpBlue block p-2 outline-none transition-colors">
                        <option value="ALL">Todos (M0+M1+Triángulo)</option>
                        <option value="M0">Solo M0</option>
                        <option value="M1">Solo M1</option>
                        <option value="TRIANGLE">Solo Triángulo</option>
                    </select>
                </div>

                <!-- Selector de Magnitud -->
                <div class="flex items-center space-x-2">
                    <label for="magnitudeSelector" class="font-semibold text-gray-700 text-sm md:text-base">Unidad:</label>
                    <select id="magnitudeSelector" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm md:text-base rounded-lg focus:ring-mpBlue focus:border-mpBlue block p-2 outline-none transition-colors">
                        <option value="1">R$ Unidades</option>
                        <option value="1000">R$ Miles (K)</option>
                        <option value="1000000">R$ Millones (M)</option>
                        <option value="1000000000">R$ Billones (B)</option>
                    </select>
                </div>

                <!-- Toggles visuales -->
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-1">
                        <input type="checkbox" id="toggleJanuary" class="w-4 h-4 text-mpBlue bg-gray-100 border-gray-300 rounded focus:ring-mpBlue cursor-pointer">
                        <label for="toggleJanuary" class="font-semibold text-gray-700 cursor-pointer select-none text-sm md:text-base">Sin Enero</label>
                    </div>
                    <div class="flex items-center space-x-1">
                        <input type="checkbox" id="toggleFebruary" class="w-4 h-4 text-mpBlue bg-gray-100 border-gray-300 rounded focus:ring-mpBlue cursor-pointer">
                        <label for="toggleFebruary" class="font-semibold text-gray-700 cursor-pointer select-none text-sm md:text-base">Sin Febrero</label>
                    </div>
                    <div class="flex items-center space-x-1">
                        <input type="checkbox" id="toggleDataLabels" class="w-4 h-4 text-mpBlue bg-gray-100 border-gray-300 rounded focus:ring-mpBlue cursor-pointer">
                        <label for="toggleDataLabels" class="font-semibold text-gray-700 cursor-pointer select-none text-sm md:text-base">Mostrar Valores</label>
                    </div>
                </div>
            </div>
            
            <!-- Botón de Exportar -->
            <button id="btnExport" class="bg-mpGreen hover:bg-green-600 text-white font-semibold py-2 px-4 rounded-lg flex items-center space-x-2 transition-colors card-shadow shrink-0 mt-4 xl:mt-0">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                </svg>
                <span>Exportar CSV</span>
            </button>
        </div>

        <!-- Indicadores Clave (KPIs) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
            <!-- KPI 1 -->
            <div class="bg-white p-5 rounded-lg card-shadow border-l-4 border-gray-400">
                <h3 class="text-gray-500 font-semibold text-sm uppercase tracking-wider mb-1">TPV Total 2025 (Plano)</h3>
                <p id="kpiPlan2025" class="text-2xl font-bold text-gray-800">R$ 0</p>
            </div>
            <!-- KPI 2 -->
            <div class="bg-white p-5 rounded-lg card-shadow border-l-4 border-mpBlue">
                <h3 class="text-gray-500 font-semibold text-sm uppercase tracking-wider mb-1">TPV Total 2025 (Actual)</h3>
                <div class="flex items-end space-x-2">
                    <p id="kpiActual2025" class="text-2xl font-bold text-mpBlue">R$ 0</p>
                    <span id="kpiVar2025" class="text-sm font-semibold mb-1">0%</span>
                </div>
            </div>
            <!-- KPI 3 -->
            <div class="bg-white p-5 rounded-lg card-shadow border-l-4 border-gray-400">
                <h3 class="text-gray-500 font-semibold text-sm uppercase tracking-wider mb-1">TPV 2026 YTD (Plano Pareado)</h3>
                <p id="kpiPlan2026" class="text-2xl font-bold text-gray-800">R$ 0</p>
            </div>
            <!-- KPI 4 -->
            <div class="bg-white p-5 rounded-lg card-shadow border-l-4 border-mpBlue">
                <h3 class="text-gray-500 font-semibold text-sm uppercase tracking-wider mb-1">TPV 2026 YTD (Actual)</h3>
                <div class="flex items-end space-x-2">
                    <p id="kpiActual2026" class="text-2xl font-bold text-mpBlue">R$ 0</p>
                    <span id="kpiVar2026" class="text-sm font-semibold mb-1">0%</span>
                </div>
            </div>
        </div>

        <!-- Gráficos -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white p-5 rounded-lg card-shadow">
                <h2 class="text-lg font-bold text-gray-800 mb-4 text-center">Evolución Mensual TPV - 2025</h2>
                <div class="relative h-[350px]">
                    <canvas id="chart2025"></canvas>
                </div>
            </div>
            <div class="bg-white p-5 rounded-lg card-shadow">
                <h2 class="text-lg font-bold text-gray-800 mb-4 text-center">Evolución Mensal TPV - 2026</h2>
                <div class="relative h-[350px]">
                    <canvas id="chart2026"></canvas>
                </div>
            </div>
        </div>

    </main>

    <!-- Lógica JavaScript y Manejo de Datos -->
    <script>
        // Registrar el plugin de DataLabels globalmente
        Chart.register(ChartDataLabels);

        // Meses para los ejes X
        const months = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
        const channels = ["CANAIS DIGITAIS", "FDV PROPRIA", "FDV TERCEIRA", "MGM", "PARTNERS ONLINE", "RESELLERS", "TELEVENDAS"];

        // Base de datos global vacía, se llenará vía fetch
        let rawData = {};

        // Estados de la aplicación
        let currentChannel = 'ALL';
        let currentCiclo = 'ALL';
        let currentMagnitude = 1; // 1, 1000 (K), 1000000 (M), 1000000000 (B)
        let hideJanuary = false;
        let hideFebruary = false;
        let showDataLabels = false;

        // Instancias de los gráficos
        let chartInst2025 = null;
        let chartInst2026 = null;

        // Función para parsear y agrupar el JSON de GitHub
        async function fetchAndParseData() {
            try {
                // URL Raw del JSON en GitHub
                const response = await fetch('https://raw.githubusercontent.com/rodrigoadmorais/Acquiring/main/tpvcanais.json');
                const data = await response.json();

                // Inicializar la estructura
                channels.forEach(c => {
                    rawData[c] = {
                        "M0": { plano2025: Array(12).fill(null), actual2025: Array(12).fill(null), plano2026: Array(12).fill(null), actual2026: Array(12).fill(null) },
                        "M1": { plano2025: Array(12).fill(null), actual2025: Array(12).fill(null), plano2026: Array(12).fill(null), actual2026: Array(12).fill(null) },
                        "TRIANGLE": { plano2025: Array(12).fill(null), actual2025: Array(12).fill(null), plano2026: Array(12).fill(null), actual2026: Array(12).fill(null) }
                    };
                });

                let currentSection = null;

                data.forEach(row => {
                    const canal = row["Plano 2026"]; // Se usa esta columna como nombre del canal

                    // Detectar en qué sección de la tabla nos encontramos (Plano 26, Plano 25, Actual)
                    if (canal === "SUM de TPV") {
                        if (row["col_3"] === "ANOMES" && row["row_number"] < 35) {
                            currentSection = "plano2026";
                        } else if (row["col_3"] === "ANOMES" && row["row_number"] > 30) {
                            currentSection = "plano2025";
                        } else if (row["col_3"] === "TIM_MONTH") {
                            currentSection = "actual";
                        }
                        return;
                    }

                    // Filtrar solo los canales solicitados y ciclos válidos
                    if (!channels.includes(canal)) return;
                    let ciclo = row["col_2"];
                    if (!["M0", "M1", "TRIANGLE"].includes(ciclo)) return;

                    const parseVal = (val) => {
                        if (val === "" || val === undefined || val === null) return null;
                        const num = parseFloat(val);
                        return isNaN(num) ? null : num;
                    };

                    // Llenar los arreglos correspondientes según la sección
                    if (currentSection === "plano2026") {
                        for(let i = 0; i < 12; i++) rawData[canal][ciclo].plano2026[i] = parseVal(row[`col_${i+3}`]);
                    } 
                    else if (currentSection === "plano2025") {
                        for(let i = 0; i < 12; i++) rawData[canal][ciclo].plano2025[i] = parseVal(row[`col_${i+3}`]);
                    } 
                    else if (currentSection === "actual") {
                        // Meses de 2025
                        for(let i = 0; i < 12; i++) rawData[canal][ciclo].actual2025[i] = parseVal(row[`col_${i+3}`]);
                        // Meses de 2026 (enero, febrero, marzo -> columnas 15, 16, 17)
                        for(let i = 0; i < 3; i++) rawData[canal][ciclo].actual2026[i] = parseVal(row[`col_${i+15}`]);
                    }
                });

                // Ocultar Loader y mostrar contenido
                document.getElementById('loader').style.display = 'none';
                document.getElementById('mainContent').classList.remove('hidden');

                // Renderizar
                updateDashboard();

            } catch (error) {
                console.error("Error al cargar datos:", error);
                document.getElementById('loader').innerHTML = `<h2 class="text-xl font-bold text-red-600">Error al cargar datos JSON</h2><p class="mt-2 text-gray-700">${error.message}</p>`;
            }
        }

        // Función utilitaria para sumar arreglos manejando valores nulos
        const sumArrays = (arrays) => {
            const length = 12;
            const result = Array(length).fill(null);
            for(let i = 0; i < length; i++) {
                let hasValue = false;
                let sum = 0;
                arrays.forEach(arr => {
                    if (arr && arr[i] !== null && arr[i] !== undefined) {
                        hasValue = true;
                        sum += arr[i];
                    }
                });
                if (hasValue) result[i] = sum;
            }
            return result;
        };

        // Función para agrupar datos basada en filtros
        function getProcessedData(selectedChannel, selectedCiclo) {
            const result = {
                plano2025: Array(12).fill(null),
                actual2025: Array(12).fill(null),
                plano2026: Array(12).fill(null),
                actual2026: Array(12).fill(null)
            };

            const channelsToProcess = selectedChannel === 'ALL' ? Object.keys(rawData) : [selectedChannel];
            const ciclosToProcess = selectedCiclo === 'ALL' ? ['M0', 'M1', 'TRIANGLE'] : [selectedCiclo];

            const arraysToSum = { plano2025: [], actual2025: [], plano2026: [], actual2026: [] };

            channelsToProcess.forEach(channel => {
                ciclosToProcess.forEach(ciclo => {
                    const dataObj = rawData[channel][ciclo];
                    arraysToSum.plano2025.push(dataObj.plano2025);
                    arraysToSum.actual2025.push(dataObj.actual2025);
                    arraysToSum.plano2026.push(dataObj.plano2026);
                    arraysToSum.actual2026.push(dataObj.actual2026);
                });
            });

            result.plano2025 = sumArrays(arraysToSum.plano2025);
            result.actual2025 = sumArrays(arraysToSum.actual2025);
            result.plano2026 = sumArrays(arraysToSum.plano2026);
            result.actual2026 = sumArrays(arraysToSum.actual2026);

            return result;
        }

        // Utilidad para dar formato numérico respetando la magnitud elegida
        const formatCurrencyWithMagnitude = (value) => {
            if (value === null || value === undefined) return '';
            
            let suffix = '';
            let val = value / currentMagnitude;
            
            if (currentMagnitude == 1000) suffix = ' K';
            else if (currentMagnitude == 1000000) suffix = ' M';
            else if (currentMagnitude == 1000000000) suffix = ' B';

            return 'R$ ' + new Intl.NumberFormat('pt-BR', { 
                minimumFractionDigits: currentMagnitude > 1 ? 1 : 0,
                maximumFractionDigits: currentMagnitude > 1 ? 1 : 0
            }).format(val) + suffix;
        };

        // Formato para variación %
        const formatVar = (plan, actual, elementId) => {
            const el = document.getElementById(elementId);
            if (!plan || plan === 0) {
                el.innerText = "-";
                el.className = "text-sm font-semibold mb-1 text-gray-500";
                return;
            }
            const variance = ((actual / plan) - 1) * 100;
            const sign = variance >= 0 ? '+' : '';
            el.innerText = `${sign}${variance.toFixed(1)}%`;
            
            if (variance > 0) {
                el.className = "text-sm font-semibold mb-1 text-[#00a650]"; 
            } else {
                el.className = "text-sm font-semibold mb-1 text-[#FF6060]"; 
            }
        };

        // Función principal para actualizar KPIs y Gráficos
        function updateDashboard() {
            // 1. Cálculos de KPI (Respetando emparejamiento exacto)
            let plan25Total = 0;
            let actual25Total = 0;
            let plan26YTD = 0;
            let actual26YTD = 0;

            const channelsToProcess = currentChannel === 'ALL' ? Object.keys(rawData) : [currentChannel];
            const ciclosToProcess = currentCiclo === 'ALL' ? ['M0', 'M1', 'TRIANGLE'] : [currentCiclo];

            channelsToProcess.forEach(channel => {
                ciclosToProcess.forEach(ciclo => {
                    const dataObj = rawData[channel][ciclo];
                    for (let i = 0; i < 12; i++) {
                        // Filtros de mes
                        if (i === 0 && hideJanuary) continue;
                        if (i === 1 && hideFebruary) continue;

                        if (dataObj.actual2025[i] !== null && dataObj.actual2025[i] !== undefined) {
                            plan25Total += dataObj.plano2025[i] || 0;
                            actual25Total += dataObj.actual2025[i] || 0;
                        }

                        if (dataObj.actual2026[i] !== null && dataObj.actual2026[i] !== undefined) {
                            plan26YTD += dataObj.plano2026[i] || 0;
                            actual26YTD += dataObj.actual2026[i] || 0;
                        }
                    }
                });
            });

            document.getElementById('kpiPlan2025').innerText = formatCurrencyWithMagnitude(plan25Total * currentMagnitude);
            document.getElementById('kpiActual2025').innerText = formatCurrencyWithMagnitude(actual25Total * currentMagnitude);
            formatVar(plan25Total, actual25Total, 'kpiVar2025');

            document.getElementById('kpiPlan2026').innerText = formatCurrencyWithMagnitude(plan26YTD * currentMagnitude);
            document.getElementById('kpiActual2026').innerText = formatCurrencyWithMagnitude(actual26YTD * currentMagnitude);
            formatVar(plan26YTD, actual26YTD, 'kpiVar2026');

            // 2. Preparar Datos para el Gráfico
            const rawGraphData = getProcessedData(currentChannel, currentCiclo);

            const filterFn = (_, i) => {
                if (i === 0 && hideJanuary) return false;
                if (i === 1 && hideFebruary) return false;
                return true;
            };

            const chartLabels = months.filter(filterFn);
            
            // Función para procesar y ESCALAR los datos a la magnitud escogida
            const processAndScaleData = (arr) => {
                return arr.filter(filterFn).map(val => val === null ? null : val / currentMagnitude);
            };

            // Opciones Compartidas de los Gráficos
            const commonOptions = {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                let label = context.dataset.label || '';
                                if (label) label += ': ';
                                if (context.parsed.y !== null) {
                                    // Se re-multiplica porque el tooltip lo espera original para usar nuestra función
                                    label += formatCurrencyWithMagnitude(context.parsed.y * currentMagnitude);
                                }
                                return label;
                            }
                        }
                    },
                    legend: {
                        position: 'bottom',
                        labels: { usePointStyle: true, padding: 20, font: { family: 'sans-serif', size: 13 } }
                    },
                    datalabels: {
                        display: showDataLabels,
                        align: 'top',
                        color: '#4B5563',
                        font: { weight: 'bold', size: 10 },
                        formatter: function(value) {
                            if (value === null) return '';
                            // Formato abreviado para la etiqueta para evitar superposiciones
                            return new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 1 }).format(value);
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { display: false }, // Se eliminan las líneas de cuadrícula
                        ticks: {
                            callback: function(value) {
                                return new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 }).format(value);
                            }
                        }
                    },
                    x: {
                        grid: { display: false } // Se eliminan las líneas de cuadrícula
                    }
                }
            };

            // 3. Gráfico 2025
            const ctx2025 = document.getElementById('chart2025').getContext('2d');
            if (chartInst2025) chartInst2025.destroy();
            chartInst2025 = new Chart(ctx2025, {
                type: 'line',
                data: {
                    labels: chartLabels,
                    datasets: [
                        {
                            label: 'Actual 2025',
                            data: processAndScaleData(rawGraphData.actual2025),
                            borderColor: '#009EE3', 
                            backgroundColor: '#009EE3',
                            borderWidth: 3,
                            tension: 0.3,
                            pointRadius: 4,
                            pointHoverRadius: 6,
                            datalabels: { align: 'top' }
                        },
                        {
                            label: 'Plano 2025',
                            data: processAndScaleData(rawGraphData.plano2025),
                            borderColor: '#9CA3AF', 
                            backgroundColor: '#9CA3AF',
                            borderWidth: 2,
                            borderDash: [5, 5], 
                            tension: 0.3,
                            pointRadius: 3,
                            datalabels: { align: 'bottom' }
                        }
                    ]
                },
                options: commonOptions
            });

            // 4. Gráfico 2026
            const ctx2026 = document.getElementById('chart2026').getContext('2d');
            if (chartInst2026) chartInst2026.destroy();
            chartInst2026 = new Chart(ctx2026, {
                type: 'line',
                data: {
                    labels: chartLabels,
                    datasets: [
                        {
                            label: 'Actual 2026',
                            data: processAndScaleData(rawGraphData.actual2026),
                            borderColor: '#009EE3', 
                            backgroundColor: '#009EE3',
                            borderWidth: 3,
                            tension: 0.3,
                            spanGaps: false, 
                            pointRadius: 4,
                            pointHoverRadius: 6,
                            datalabels: { align: 'top' }
                        },
                        {
                            label: 'Plano 2026',
                            data: processAndScaleData(rawGraphData.plano2026),
                            borderColor: '#9CA3AF', 
                            backgroundColor: '#9CA3AF',
                            borderWidth: 2,
                            borderDash: [5, 5], 
                            tension: 0.3,
                            pointRadius: 3,
                            datalabels: { align: 'bottom' }
                        }
                    ]
                },
                options: commonOptions
            });
        }

        // Manejo de eventos de la UI
        document.getElementById('channelSelector').addEventListener('change', e => { currentChannel = e.target.value; updateDashboard(); });
        document.getElementById('cicloSelector').addEventListener('change', e => { currentCiclo = e.target.value; updateDashboard(); });
        document.getElementById('magnitudeSelector').addEventListener('change', e => { currentMagnitude = Number(e.target.value); updateDashboard(); });
        document.getElementById('toggleJanuary').addEventListener('change', e => { hideJanuary = e.target.checked; updateDashboard(); });
        document.getElementById('toggleFebruary').addEventListener('change', e => { hideFebruary = e.target.checked; updateDashboard(); });
        document.getElementById('toggleDataLabels').addEventListener('change', e => { showDataLabels = e.target.checked; updateDashboard(); });

        // Exportar a CSV (exporta los valores brutos sin escalar)
        document.getElementById('btnExport').addEventListener('click', () => {
            let csvContent = `Filtro de Canal:;${currentChannel}\n`;
            csvContent += `Filtro de Ciclo Vida:;${currentCiclo}\n\n`;
            csvContent += "Cenario;" + months.join(";") + "\n";
            
            const dataToExport = getProcessedData(currentChannel, currentCiclo);

            const p25 = dataToExport.plano2025.map(v => v === null ? "" : v).join(";");
            const a25 = dataToExport.actual2025.map(v => v === null ? "" : v).join(";");
            const p26 = dataToExport.plano2026.map(v => v === null ? "" : v).join(";");
            const a26 = dataToExport.actual2026.map(v => v === null ? "" : v).join(";");

            csvContent += `Plano 2025;${p25}\n`;
            csvContent += `Actual 2025;${a25}\n`;
            csvContent += `Plano 2026;${p26}\n`;
            csvContent += `Actual 2026;${a26}\n`;

            const bom = "\uFEFF";
            const blob = new Blob([bom + csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `performance_tpv_${currentChannel}_${currentCiclo}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // Inicialización: Hacer Fetch e invocar render
        window.onload = () => {
            fetchAndParseData();
        };

    </script>
</body>
</html>
