                let hasValue = false;
                let sum = 0;
                arrays.forEach(arr => {
                    if (arr && arr[i] !== null && arr[i] !== undefined) {
                        hasValue = true;
                        sum += arr[i];
                    }
                });
                if (hasValue) result[i] = sum;
            }
            return result;
        };

        // Função para obter dados processados baseados nos filtros para gráficos
        function getProcessedData(selectedChannel, selectedCiclo) {
            const result = {
                plano2025: Array(12).fill(null),
                actual2025: Array(12).fill(null),
                plano2026: Array(12).fill(null),
                actual2026: Array(12).fill(null)
            };

            const channelsToProcess = selectedChannel === 'ALL' ? Object.keys(rawData) : [selectedChannel];
            const ciclosToProcess = selectedCiclo === 'ALL' ? ['M0', 'M1', 'TRIANGLE'] : [selectedCiclo];

            const arraysToSum = {
                plano2025: [], actual2025: [], plano2026: [], actual2026: []
            };

            channelsToProcess.forEach(channel => {
                ciclosToProcess.forEach(ciclo => {
                    const dataObj = rawData[channel][ciclo];
                    arraysToSum.plano2025.push(dataObj.plano2025);
                    arraysToSum.actual2025.push(dataObj.actual2025);
                    arraysToSum.plano2026.push(dataObj.plano2026);
                    arraysToSum.actual2026.push(dataObj.actual2026);
                });
            });

            result.plano2025 = sumArrays(arraysToSum.plano2025);
            result.actual2025 = sumArrays(arraysToSum.actual2025);
            result.plano2026 = sumArrays(arraysToSum.plano2026);
            result.actual2026 = sumArrays(arraysToSum.actual2026);

            return result;
        }

        // Estados da aplicação
        let currentChannel = 'ALL';
        let currentCiclo = 'ALL';
        let hideJanuary = false;
        let hideFebruary = false;

        // Instâncias dos gráficos
        let chartInst2025 = null;
        let chartInst2026 = null;

        // Utilitário para formatar moeda
        const formatCurrency = (value) => {
            return new Intl.NumberFormat('pt-BR', { 
                style: 'currency', 
                currency: 'BRL',
                maximumFractionDigits: 0
            }).format(value);
        };

        // Utilitário para formatar variação percentual com cores
        const formatVar = (plan, actual, elementId) => {
            const el = document.getElementById(elementId);
            if (!plan || plan === 0) {
                el.innerText = "-";
                el.className = "text-sm font-semibold mb-1 text-gray-500";
                return;
            }
            const variance = ((actual / plan) - 1) * 100;
            const sign = variance >= 0 ? '+' : '';
            el.innerText = `${sign}${variance.toFixed(1)}%`;
            
            if (variance > 0) {
                el.className = "text-sm font-semibold mb-1 text-[#00a650]"; // Verde Mercado Pago
            } else {
                el.className = "text-sm font-semibold mb-1 text-[#FF6060]"; // Vermelho
            }
        };

        // Configuração partilhada para os gráficos
        const commonOptions = {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
                mode: 'index',
                intersect: false,
            },
            plugins: {
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            let label = context.dataset.label || '';
                            if (label) {
                                label += ': ';
                            }
                            if (context.parsed.y !== null) {
                                label += formatCurrency(context.parsed.y);
                            }
                            return label;
                        }
                    }
                },
                legend: {
                    position: 'bottom',
                    labels: {
                        usePointStyle: true,
                        padding: 20,
                        font: { family: 'sans-serif', size: 13 }
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        callback: function(value) {
                            if(value >= 1000000000) return 'R$ ' + (value / 1000000000).toFixed(1) + 'B';
                            if(value >= 1000000) return 'R$ ' + (value / 1000000).toFixed(0) + 'M';
                            return 'R$ ' + value;
                        }
                    },
                    grid: { color: '#E5E7EB' }
                },
                x: {
                    grid: { display: false }
                }
            }
        };

        // Função principal para atualizar o Dashboard
        function updateDashboard() {
            // Recálculo Bottom-Up de KPIs para garantir PAREAMENTO ABSOLUTO (maçã com maçã)
            // Ou seja, o Plano só é somado no KPI se o Actual respectivo existir (não for null) naquele exato mês/canal/ciclo.
            let plan25Total = 0;
            let actual25Total = 0;
            let plan26YTD = 0;
            let actual26YTD = 0;

            const channelsToProcess = currentChannel === 'ALL' ? Object.keys(rawData) : [currentChannel];
            const ciclosToProcess = currentCiclo === 'ALL' ? ['M0', 'M1', 'TRIANGLE'] : [currentCiclo];

            channelsToProcess.forEach(channel => {
                ciclosToProcess.forEach(ciclo => {
                    const dataObj = rawData[channel][ciclo];
                    for (let i = 0; i < 12; i++) {
                        // Respeitar as visualizações ocultadas para os KPIs também
                        if (i === 0 && hideJanuary) continue;
                        if (i === 1 && hideFebruary) continue;

                        // 2025 Totals
                        if (dataObj.actual2025[i] !== null && dataObj.actual2025[i] !== undefined) {
                            plan25Total += dataObj.plano2025[i] || 0;
                            actual25Total += dataObj.actual2025[i] || 0;
                        }

                        // 2026 YTD - Estritamente Pareado
                        if (dataObj.actual2026[i] !== null && dataObj.actual2026[i] !== undefined) {
                            plan26YTD += dataObj.plano2026[i] || 0;
                            actual26YTD += dataObj.actual2026[i] || 0;
                        }
                    }
                });
            });

            document.getElementById('kpiPlan2025').innerText = formatCurrency(plan25Total);
            document.getElementById('kpiActual2025').innerText = formatCurrency(actual25Total);
            formatVar(plan25Total, actual25Total, 'kpiVar2025');

            document.getElementById('kpiPlan2026').innerText = formatCurrency(plan26YTD);
            document.getElementById('kpiActual2026').innerText = formatCurrency(actual26YTD);
            formatVar(plan26YTD, actual26YTD, 'kpiVar2026');

            // Preparação dos dados para os Gráficos
            const dataGraph = getProcessedData(currentChannel, currentCiclo);

            const filterFn = (_, i) => {
                if (i === 0 && hideJanuary) return false;
                if (i === 1 && hideFebruary) return false;
                return true;
            };

            const chartLabels = months.filter(filterFn);
            const processData = (arr) => arr.filter(filterFn);

            // 3. Atualizar/Criar Gráfico 2025
            const ctx2025 = document.getElementById('chart2025').getContext('2d');
            if (chartInst2025) chartInst2025.destroy();
            chartInst2025 = new Chart(ctx2025, {
                type: 'line',
                data: {
                    labels: chartLabels,
                    datasets: [
                        {
                            label: 'Actual 2025',
                            data: processData(dataGraph.actual2025),
                            borderColor: '#009EE3', // Azul MP
                            backgroundColor: '#009EE3',
                            borderWidth: 3,
                            tension: 0.3,
                            pointRadius: 4,
                            pointHoverRadius: 6
                        },
                        {
                            label: 'Plano 2025',
                            data: processData(dataGraph.plano2025),
                            borderColor: '#9CA3AF', // Cinzento
                            backgroundColor: '#9CA3AF',
                            borderWidth: 2,
                            borderDash: [5, 5], // Linha tracejada
                            tension: 0.3,
                            pointRadius: 3
                        }
                    ]
                },
                options: commonOptions
            });

            // 4. Atualizar/Criar Gráfico 2026
            const ctx2026 = document.getElementById('chart2026').getContext('2d');
            if (chartInst2026) chartInst2026.destroy();
            chartInst2026 = new Chart(ctx2026, {
                type: 'line',
                data: {
                    labels: chartLabels,
                    datasets: [
                        {
                            label: 'Actual 2026',
                            data: processData(dataGraph.actual2026),
                            borderColor: '#009EE3', // Azul MP
                            backgroundColor: '#009EE3',
                            borderWidth: 3,
                            tension: 0.3,
                            spanGaps: false, // Não ligar pontos nulos
                            pointRadius: 4,
                            pointHoverRadius: 6
                        },
                        {
                            label: 'Plano 2026',
                            data: processData(dataGraph.plano2026),
                            borderColor: '#9CA3AF', // Cinzento
                            backgroundColor: '#9CA3AF',
                            borderWidth: 2,
                            borderDash: [5, 5], // Linha tracejada
                            tension: 0.3,
                            pointRadius: 3
                        }
                    ]
                },
                options: commonOptions
            });
        }

        // Listeners de Interação
        document.getElementById('channelSelector').addEventListener('change', function(e) {
            currentChannel = e.target.value;
            updateDashboard();
        });

        document.getElementById('cicloSelector').addEventListener('change', function(e) {
            currentCiclo = e.target.value;
            updateDashboard();
        });

        document.getElementById('toggleJanuary').addEventListener('change', function(e) {
            hideJanuary = e.target.checked;
            updateDashboard();
        });

        document.getElementById('toggleFebruary').addEventListener('change', function(e) {
            hideFebruary = e.target.checked;
            updateDashboard();
        });

        // Função para Exportar CSV baseado na visão atual ativa (Filtro aplicado)
        function exportToCSV() {
            let csvContent = `Filtro de Canal:;${currentChannel}\n`;
            csvContent += `Filtro de Ciclo Vida:;${currentCiclo}\n\n`;
            csvContent += "Cenario;" + months.join(";") + "\n";
            
            const dataToExport = getProcessedData(currentChannel, currentCiclo);

            const p25 = dataToExport.plano2025.map(v => v === null ? "" : v).join(";");
            const a25 = dataToExport.actual2025.map(v => v === null ? "" : v).join(";");
            const p26 = dataToExport.plano2026.map(v => v === null ? "" : v).join(";");
            const a26 = dataToExport.actual2026.map(v => v === null ? "" : v).join(";");

            csvContent += `Plano 2025;${p25}\n`;
            csvContent += `Actual 2025;${a25}\n`;
            csvContent += `Plano 2026;${p26}\n`;
            csvContent += `Actual 2026;${a26}\n`;

            const bom = "\uFEFF";
            const blob = new Blob([bom + csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `performance_tpv_${currentChannel}_${currentCiclo}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        document.getElementById('btnExport').addEventListener('click', exportToCSV);

        // Inicialização
        window.onload = () => {
            updateDashboard();
        };

    </script>
</body>
</html>
