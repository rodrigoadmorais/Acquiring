<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado Pago - Hosting Evolution (Acquiring & Segments)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Proxima+Nova:wght@300;400;700&display=swap');
        body { font-family: 'Proxima Nova', -apple-system, sans-serif; background-color: #FFFFFF; }
        .ml-yellow { background-color: #FFE600; }
        .ml-blue { background-color: #3483FA; }
        .chart-container { position: relative; height: 400px; width: 100%; }
        .delta-up { color: #F04449; } 
        .delta-down { color: #00A650; }
        .btn-toggle { transition: all 0.3s ease; }
        .active-tab { background-color: #3483FA !important; color: white; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); transform: scale(1.05); }
    </style>
</head>
<body class="text-[#333333] pb-20">

    <!-- Header Mercado Livre -->
    <header class="ml-yellow py-6 px-4 md:px-8 border-b border-black/5 shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col gap-6">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
                <div>
                    <div class="flex items-center gap-3">
                        <div class="bg-white p-2.5 rounded-full shadow-sm">
                            <svg class="text-[#3483FA] w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                        </div>
                        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Hosting Evolution</h1>
                    </div>
                    <p class="text-slate-800/70 text-sm mt-1 ml-14 font-semibold uppercase tracking-wide">Acquiring: Point, OP & QR</p>
                </div>
                
                <!-- Seletores de Visão Principal -->
                <div class="flex flex-wrap items-center gap-4">
                    <!-- Absolute vs TPN -->
                    <div class="flex bg-white/50 p-1 rounded-full backdrop-blur-md border border-black/10 shadow-inner">
                        <button id="btn-absolute" onclick="updateMode('absolute')" class="btn-toggle px-6 py-2 rounded-full text-xs font-bold active-tab">Absoluto</button>
                        <button id="btn-per-tpn" onclick="updateMode('per_tpn')" class="btn-toggle px-6 py-2 rounded-full text-xs font-bold text-slate-700">Por TPN</button>
                    </div>
                    <!-- BU vs Segmento -->
                    <div class="flex bg-white/50 p-1 rounded-full backdrop-blur-md border border-black/10 shadow-inner">
                        <button id="btn-view-bu" onclick="updateGranularity('bu')" class="btn-toggle px-6 py-2 rounded-full text-xs font-bold active-tab">Por BU</button>
                        <button id="btn-view-segment" onclick="updateGranularity('segment')" class="btn-toggle px-6 py-2 rounded-full text-xs font-bold text-slate-700">Por Segmento</button>
                    </div>
                </div>
            </div>

            <!-- Filtro de Segmento (Só aparece se Segmento estiver ativo) -->
            <div id="segment-filter-container" class="hidden flex items-center gap-4 bg-white/30 p-2 rounded-lg border border-black/5">
                <span class="text-xs font-bold text-slate-700 ml-2">Filtrar Segmento por:</span>
                <select id="bu-selector" onchange="updateCharts()" class="bg-white border-none rounded-md px-4 py-1.5 text-xs font-bold text-slate-700 shadow-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="TOTAL">Total Acquiring</option>
                    <option value="POINT">Point</option>
                    <option value="ONLINE PAYMENTS">OP</option>
                    <option value="QR">QR</option>
                </select>
                <span class="text-[10px] text-slate-600 italic bg-white/50 px-2 py-1 rounded">* O segmento <strong>Longtail</strong> inclui vendedores Null e NA.</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 md:px-8 mt-8 flex flex-col gap-10">
        
        <!-- Sumário -->
        <div id="summary-cards" class="grid grid-cols-1 md:grid-cols-4 gap-4 text-center">
            <!-- Os cards são gerados dinamicamente -->
        </div>

        <!-- Área de Gráficos -->
        <div id="charts-wrapper" class="flex flex-col gap-10">
            <!-- Gráficos gerados dinamicamente -->
        </div>

    </main>

    <footer class="max-w-7xl mx-auto mt-20 text-center text-slate-400 text-[10px] font-black uppercase tracking-[0.3em] px-4">
        Mercado Pago | Performance, Costs & Business Analytics
    </footer>

        function buildDataFromRaw() {
            const rows = RAW_DB_STRING.split(/(?=202[456]-\d{2})/);
            
            rows.forEach(row => {
                if (!row.trim()) return;
                const dateStr = row.substring(0, 7);
                const monthLabel = formatDbDate(dateStr);
                const monthIndex = MONTHS.indexOf(monthLabel);
                
                if (monthIndex === -1) return;

                let rest = row.substring(7);
                let bu = "";
                ["ONLINE PAYMENTS", "POINT", "QR", "SOFTWARE"].forEach(b => { if(rest.startsWith(b)) bu = b; });
                
                if (!bu || bu === "SOFTWARE") return;
                
                rest = rest.substring(bu.length);

                let segment = "";
                ["BIG SELLERS", "LONGTAIL", "SMB", "null", "NA"].forEach(s => { if(rest.startsWith(s)) segment = s; });
                rest = rest.substring(segment.length);

                if (segment === "null" || segment === "NA") segment = "LONGTAIL";

                const match = rest.match(/^([\d\.]+)(-[\d\.,]+|0)(-[\d\.,]+|0)$/);
                if (match) {
                    const tpn = parseBrNumber(match[1]);
                    const fixed = parseBrNumber(match[2]);
                    const varCost = parseBrNumber(match[3]);

                    dataMaster[bu][segment][monthIndex].tpn += tpn;
                    dataMaster[bu][segment][monthIndex].fixed += fixed;
                    dataMaster[bu][segment][monthIndex].var += varCost;
                }
            });
        }

        let currentMode = 'absolute'; 
        let currentGranularity = 'bu'; 

        function formatVal(val) {
            if (currentMode === 'absolute') {
                return 'LC ' + new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 }).format(val);
            }
            return 'LC ' + new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 4, maximumFractionDigits: 4 }).format(val);
        }

        function updateMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.btn-toggle').forEach(b => b.classList.remove('active-tab'));
            document.getElementById(mode === 'absolute' ? 'btn-absolute' : 'btn-per-tpn').classList.add('active-tab');
            if (currentGranularity === 'bu') document.getElementById('btn-view-bu').classList.add('active-tab');
            else document.getElementById('btn-view-segment').classList.add('active-tab');
            updateCharts();
        }

        function updateGranularity(gran) {
            currentGranularity = gran;
            document.getElementById('segment-filter-container').classList.toggle('hidden', gran === 'bu');
            document.querySelectorAll('.btn-toggle').forEach(b => b.classList.remove('active-tab'));
            document.getElementById(gran === 'bu' ? 'btn-view-bu' : 'btn-view-segment').classList.add('active-tab');
            document.getElementById(currentMode === 'absolute' ? 'btn-absolute' : 'btn-per-tpn').classList.add('active-tab');
            updateCharts();
        }

        function getChartData() {
            const results = {
                ACQUIRING: { labels: MONTHS, datasets: [] },
                POINT: { labels: MONTHS, datasets: [] },
                OP: { labels: MONTHS, datasets: [] },
                QR: { labels: MONTHS, datasets: [] }
            };

            const bus = ["POINT", "ONLINE PAYMENTS", "QR"];
            
            if (currentGranularity === 'bu') {
                const mapping = { "POINT": "POINT", "ONLINE PAYMENTS": "OP", "QR": "QR" };
                
                bus.forEach(buKey => {
                    const label = mapping[buKey];
                    const fixedData = Array(26).fill(0);
                    const varData = Array(26).fill(0);
                    const tpnData = Array(26).fill(0);

                    for(let i=0; i<26; i++) {
                        const totalFixed = dataMaster[buKey]["BIG SELLERS"][i].fixed + dataMaster[buKey]["SMB"][i].fixed + dataMaster[buKey]["LONGTAIL"][i].fixed;
                        const totalVar = dataMaster[buKey]["BIG SELLERS"][i].var + dataMaster[buKey]["SMB"][i].var + dataMaster[buKey]["LONGTAIL"][i].var;
                        const totalTpn = dataMaster[buKey]["BIG SELLERS"][i].tpn + dataMaster[buKey]["SMB"][i].tpn + dataMaster[buKey]["LONGTAIL"][i].tpn;

                        fixedData[i] = currentMode === 'absolute' ? totalFixed : (totalTpn === 0 ? 0 : totalFixed / totalTpn);
                        varData[i] = currentMode === 'absolute' ? totalVar : (totalTpn === 0 ? 0 : totalVar / totalTpn);
                        tpnData[i] = totalTpn;
                    }

                    results[label].datasets = [
                        { label: 'Hosting Fixed', data: fixedData, borderColor: '#333', backgroundColor: '#333', borderWidth: 2, tpn: tpnData },
                        { label: 'Hosting Variable', data: varData, borderColor: '#999', backgroundColor: '#999', borderWidth: 2, tpn: tpnData }
                    ];
                });

                // Acquiring = Soma
                const acqFixed = Array(26).fill(0);
                const acqVar = Array(26).fill(0);
                const acqTpn = Array(26).fill(0);
                for(let i=0; i<26; i++) {
                    const sumFixed = results.POINT.datasets[0].data[i] + results.OP.datasets[0].data[i] + results.QR.datasets[0].data[i];
                    const sumVar = results.POINT.datasets[1].data[i] + results.OP.datasets[1].data[i] + results.QR.datasets[1].data[i];
                    const sumTpn = results.POINT.datasets[0].tpn[i] + results.OP.datasets[0].tpn[i] + results.QR.datasets[0].tpn[i];
                    
                    if (currentMode === 'absolute') {
                        acqFixed[i] = sumFixed; acqVar[i] = sumVar;
                    } else {
                        const totalAbsFixed = (results.POINT.datasets[0].data[i] * results.POINT.datasets[0].tpn[i]) + (results.OP.datasets[0].data[i] * results.OP.datasets[0].tpn[i]) + (results.QR.datasets[0].data[i] * results.QR.datasets[0].tpn[i]);
                        const totalAbsVar = (results.POINT.datasets[1].data[i] * results.POINT.datasets[1].tpn[i]) + (results.OP.datasets[1].data[i] * results.OP.datasets[1].tpn[i]) + (results.QR.datasets[1].data[i] * results.QR.datasets[1].tpn[i]);
                        acqFixed[i] = sumTpn === 0 ? 0 : totalAbsFixed / sumTpn;
                        acqVar[i] = sumTpn === 0 ? 0 : totalAbsVar / sumTpn;
                    }
                    acqTpn[i] = sumTpn;
                }
                results.ACQUIRING.datasets = [
                    { label: 'Total Fixed', data: acqFixed, borderColor: '#3483FA', borderWidth: 3, tpn: acqTpn },
                    { label: 'Total Variable', data: acqVar, borderColor: '#00A650', borderWidth: 3, tpn: acqTpn }
                ];
            } else {
                const filterBU = document.getElementById('bu-selector').value;
                const segments = ["BIG SELLERS", "SMB", "LONGTAIL"];
                const colors = { "BIG SELLERS": "#3483FA", "SMB": "#00A650", "LONGTAIL": "#FF8800" };
                
                const segmentDatasets = segments.map(seg => {
                    const data = Array(26).fill(0);
                    const tpn = Array(26).fill(0);
                    for(let i=0; i<26; i++) {
                        let totalCost = 0; let totalTpn = 0;
                        if (filterBU === "TOTAL") {
                            bus.forEach(bu => {
                                totalCost += dataMaster[bu][seg][i].fixed + dataMaster[bu][seg][i].var;
                                totalTpn += dataMaster[bu][seg][i].tpn;
                            });
                        } else {
                            totalCost = dataMaster[filterBU][seg][i].fixed + dataMaster[filterBU][seg][i].var;
                            totalTpn = dataMaster[filterBU][seg][i].tpn;
                        }
                        data[i] = currentMode === 'absolute' ? totalCost : (totalTpn === 0 ? 0 : totalCost / totalTpn);
                        tpn[i] = totalTpn;
                    }
                    return { label: seg === "LONGTAIL" ? "Longtail (incl. Null/NA)" : seg, data, borderColor: colors[seg], borderWidth: 3, tpn };
                });

                results.ACQUIRING.datasets = segmentDatasets;
            }
            return results;
        }

        function createChartsStructure() {
            const wrapper = document.getElementById('charts-wrapper');
            const summary = document.getElementById('summary-cards');
            wrapper.innerHTML = '';
            summary.innerHTML = '';

            const sections = currentGranularity === 'bu' 
                ? ["ACQUIRING", "POINT", "OP", "QR"] 
                : ["ACQUIRING"];

            sections.forEach(id => {
                const card = document.createElement('div');
                card.className = `bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-t-8 ${id === 'ACQUIRING' ? 'border-t-blue-500' : 'border-t-slate-700'}`;
                card.innerHTML = `
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${id}</p>
                    <p class="text-[9px] font-bold text-slate-400 mb-1">MÉDIA MENSAL</p>
                    <p id="sum-val-${id}" class="text-lg font-black text-slate-800 mt-0 italic">LC 0</p>
                    <div class="flex flex-col gap-0.5 mt-2">
                        <div id="delta-26-25-${id}" class="text-[10px] font-bold flex items-center justify-center"></div>
                        <div id="delta-25-24-${id}" class="text-[10px] font-bold flex items-center justify-center"></div>
                    </div>
                `;
                summary.appendChild(card);

                const sec = document.createElement('section');
                sec.className = "bg-white rounded-lg shadow-sm overflow-hidden border border-slate-200";
                sec.innerHTML = `
                    <div class="bg-slate-50 border-b border-slate-200 px-6 py-4 flex justify-between items-center">
                        <h3 class="text-lg font-bold text-slate-800">${id === 'ACQUIRING' && currentGranularity === 'segment' ? 'Evolução por Segmento' : id}</h3>
                        <span class="text-[9px] font-bold text-slate-400 uppercase tracking-tighter">Histórico 24/25/26</span>
                    </div>
                    <div class="p-6 chart-container">
                        <canvas id="canvas-${id}"></canvas>
                    </div>
                `;
                wrapper.appendChild(sec);
            });
        }

        const verticalLinePlugin = {
            id: 'verticalLine',
            afterDraw: (chart) => {
                if (chart.options.plugins.verticalLine) {
                    const ctx = chart.ctx;
                    const top = chart.chartArea.top;
                    const bottom = chart.chartArea.bottom;

                    const drawLine = (idx, text) => {
                        const x = chart.scales.x.getPixelForValue(idx);
                        ctx.save();
                        ctx.beginPath();
                        ctx.moveTo(x, top);
                        ctx.lineTo(x, bottom);
                        ctx.lineWidth = 2;
                        ctx.strokeStyle = '#FFE600';
                        ctx.stroke();
                        ctx.fillStyle = '#666';
                        ctx.font = 'bold 9px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText(text, x, bottom + 15); 
                        ctx.restore();
                    }
                    drawLine(11, 'FIM 2024');
                    drawLine(23, 'FIM 2025');
                }
            }
        };
        Chart.register(verticalLinePlugin);

        let activeCharts = [];

        function updateCharts() {
            activeCharts.forEach(c => c.destroy());
            activeCharts = [];

            createChartsStructure();
            const allData = getChartData();
            
            Object.keys(allData).forEach(id => {
                const canvas = document.getElementById(`canvas-${id}`);
                if (!canvas) return;

                const ctx = canvas.getContext('2d');
                
                const datasets = allData[id].datasets;
                if (datasets.length > 0) {
                    const totalData = datasets[0].data.map((v, i) => v + (datasets[1]?.data[i] || 0) + (datasets[2]?.data[i] || 0));
                    
                    // Cálculo de médias
                    const avg24 = totalData.slice(0, 12).reduce((a,b)=>a+b,0) / 12;
                    const avg25 = totalData.slice(12, 24).reduce((a,b)=>a+b,0) / 12;
                    const avg26 = totalData.slice(24, 26).reduce((a,b)=>a+b,0) / 2;
                    const avgTotal = totalData.reduce((a,b)=>a+b,0) / totalData.length;
                    
                    document.getElementById(`sum-val-${id}`).innerText = formatVal(avgTotal);
                    
                    // Cálculo de Delta - Como são valores negativos: CostWorsened (-120 vs -100) = Delta Positivo (+20% Aumento de Custo)
                    const delta25vs24 = avg24 === 0 ? 0 : ((avg25 / avg24) - 1) * 100;
                    const delta26vs25 = avg25 === 0 ? 0 : ((avg26 / avg25) - 1) * 100;
                    
                    const formatDelta = (val, text) => {
                        if (val === 0) return `<span class="text-slate-400">0%</span> <span class="text-slate-400 ml-1 font-normal italic">${text}</span>`;
                        return `<span class="${val > 0 ? 'delta-up' : 'delta-down'}">${val > 0 ? '▲' : '▼'} ${Math.abs(val).toFixed(1)}%</span> <span class="text-slate-400 ml-1 font-normal italic">${text}</span>`;
                    };

                    const d26 = document.getElementById(`delta-26-25-${id}`);
                    const d25 = document.getElementById(`delta-25-24-${id}`);
                    if (d26 && avg25 !== 0) d26.innerHTML = formatDelta(delta26vs25, 'vs 2025 (YTD)');
                    if (d25 && avg24 !== 0) d25.innerHTML = formatDelta(delta25vs24, '2025 vs 2024');
                }

                const newChart = new Chart(ctx, {
                    type: 'line',
                    data: allData[id],
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { usePointStyle: true, font: { size: 11, weight: 'bold' } } },
                            verticalLine: true,
                            tooltip: {
                                callbacks: {
                                    label: (ctx) => `${ctx.dataset.label}: ${formatVal(ctx.parsed.y)}`,
                                    afterBody: (items) => `Volume: ${allData[id].datasets[0].tpn[items[0].dataIndex].toLocaleString('pt-BR')} TPN`
                                }
                            }
                        },
                        scales: {
                            x: { 
                                position: 'bottom',
                                grid: { display: false }, 
                                ticks: { font: { size: 9 } } 
                            },
                            y: { 
                                reverse: true,
                                grid: { color: '#F8F8F8' },
                                ticks: { 
                                    font: { size: 10 }, 
                                    callback: (v) => {
                                        if (currentMode === 'absolute') {
                                            return 'LC ' + new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 1 }).format(v/1e6) + 'M';
                                        }
                                        return 'LC ' + new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 4, maximumFractionDigits: 4 }).format(v);
                                    }
                                }
                            }
                        }
                    }
                });
                activeCharts.push(newChart);
            });
        }

        window.onload = () => {
            buildDataFromRaw();
            updateCharts();
        };
    </script>
</body>
</html>
