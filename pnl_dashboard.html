<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&L Brasil</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
:root {
  --yellow:#FFE600; --bg:#F0F2F5; --card:#fff; --border:#E0E0E0;
  --text:#222; --muted:#777; --blue:#1565C0; --blue-lt:#E3F0FF;
  --red:#C62828; --red-lt:#FFEBEE; --green:#2E7D32; --green-lt:#E8F5E9;
  --l1bg:#FFF9E0; --l2bg:#F7F7F7; --l3bg:#fff;
  --sticky:#fff; --hdr-text:#333;
  --total-col:#1A237E; --var-col:#1B5E20;
}
[data-theme=dark] {
  --bg:#161b22; --card:#1f2937; --border:#374151; --text:#e5e7eb;
  --muted:#9ca3af; --blue:#60a5fa; --blue-lt:#1e3a5f;
  --red:#fca5a5; --red-lt:#3b1212; --green:#86efac; --green-lt:#14291a;
  --l1bg:#2a2416; --l2bg:#242a34; --l3bg:#1f2937;
  --sticky:#1f2937; --hdr-text:#f9fafb;
  --total-col:#1e3a8a; --var-col:#14532d;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
     background:var(--bg);color:var(--text);font-size:13px;
     height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* ── Header ── */
.hdr{background:var(--yellow);height:50px;padding:0 20px;
     display:flex;align-items:center;justify-content:space-between;
     position:sticky;top:0;z-index:400;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.hdr h1{font-size:16px;font-weight:800;color:#1a1a1a;letter-spacing:-.3px}
.hdr-r{display:flex;gap:8px;align-items:center}
.upd{font-size:11px;color:#555;font-weight:500}
.btn-hdr{padding:4px 12px;border-radius:6px;border:1.5px solid rgba(0,0,0,.22);
         background:rgba(255,255,255,.6);cursor:pointer;font-size:11px;
         font-weight:700;color:#333;transition:.15s}
.btn-hdr:hover{background:rgba(255,255,255,.95)}
.btn-hdr.on{background:#333;color:var(--yellow);border-color:#333}

/* ── Filters ── */
.filters{background:var(--card);border-bottom:2px solid var(--border);
         padding:10px 20px;display:flex;gap:12px;flex-wrap:wrap;
         align-items:flex-end;position:sticky;top:50px;z-index:300}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:10px;font-weight:700;color:var(--muted);
          text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.ml-a{margin-left:auto}
.sep{width:1px;background:var(--border);margin:2px 2px;align-self:stretch}

/* ── Pills ── */
.pills{display:flex;gap:5px;flex-wrap:wrap;max-width:700px}
.pill{padding:3px 11px;border-radius:20px;border:1.5px solid var(--border);
      background:var(--card);color:var(--muted);cursor:pointer;
      font-size:11px;font-weight:600;transition:.15s;white-space:nowrap;
      user-select:none}
.pill:hover{border-color:var(--blue);color:var(--blue)}
.pill.on{border-color:var(--blue);background:var(--blue);color:#fff}

/* ── Btn group ── */
.bg{display:flex;border:1.5px solid var(--border);border-radius:7px;overflow:hidden}
.bg button{padding:4px 11px;border:none;border-right:1px solid var(--border);
           background:var(--card);color:var(--muted);cursor:pointer;
           font-size:11px;font-weight:600;transition:.15s;white-space:nowrap}
.bg button:last-child{border-right:none}
.bg button.on{background:var(--blue);color:#fff}
.bg button:hover:not(.on){background:var(--bg);color:var(--text)}

/* ── Multi-select dropdown ── */
.ms-wrap{position:relative}
.ms-trig{padding:4px 10px;border:1.5px solid var(--border);border-radius:7px;
         background:var(--card);color:var(--text);cursor:pointer;font-size:12px;
         min-width:120px;display:flex;justify-content:space-between;
         align-items:center;gap:6px;white-space:nowrap;transition:.15s}
.ms-trig:hover{border-color:var(--blue)}
.ms-trig .caret{font-size:8px;color:var(--muted)}
.ms-panel{position:absolute;top:calc(100% + 5px);left:0;background:var(--card);
          border:1.5px solid var(--border);border-radius:8px;
          box-shadow:0 8px 24px rgba(0,0,0,.15);min-width:190px;
          max-height:260px;overflow-y:auto;z-index:600;display:none;padding:5px 0}
.ms-panel.open{display:block}
.ms-item{display:flex;align-items:center;gap:8px;padding:5px 12px;
         cursor:pointer;font-size:12px;transition:.1s}
.ms-item:hover{background:var(--bg)}
.ms-item input{accent-color:var(--blue);cursor:pointer;flex-shrink:0}
.ms-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-actions{display:flex;gap:8px;padding:6px 12px 4px;
            border-top:1px solid var(--border);margin-top:3px}
.ms-actions button{font-size:10px;font-weight:700;color:var(--blue);
                   background:none;border:none;cursor:pointer;padding:0}

/* ── Table wrapper ── */
/* tbl-wrap = scroll container for the table (both axes)
   This ensures position:sticky on <th> is relative to tbl-wrap
   (not to tbl-outer which was the bug: overflow-x:auto on tbl-outer
    made it the sticky container, causing headers to float incorrectly) */
.tbl-wrap{flex:1 1 0;min-height:0;overflow-x:auto;overflow-y:auto;padding:0 20px 16px}
.tbl-wrap::-webkit-scrollbar{height:6px;width:6px}
.tbl-wrap::-webkit-scrollbar-track{background:var(--bg)}
.tbl-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.tbl-outer{border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.08)}

/* ── P&L Table ── */
#pnlTable{border-collapse:collapse;width:100%;font-size:12px;
          border-radius:10px;overflow:hidden}
#pnlTable th{background:#111d36;color:#c8d4e8;padding:9px 12px;
             text-align:right;white-space:nowrap;font-size:11px;font-weight:600;
             position:sticky;top:0;z-index:100;
             border-bottom:2px solid #0a1220;letter-spacing:.3px}
#pnlTable th.sticky-col{text-align:left;position:sticky;left:0;z-index:200;
                        background:#111d36;min-width:260px;max-width:340px;
                        font-size:12px;letter-spacing:.4px}
#pnlTable th.grp-hdr{background:#0e1a30;border-left:2px solid #0a1220}
#pnlTable th.col-total-hdr{background:#162444;border-left:2px solid #0a1220}
#pnlTable th.col-var-hdr{background:#0f2218;border-left:1px solid #0a1220}

#pnlTable td{padding:5px 12px;border-bottom:1px solid var(--border);
             white-space:nowrap;text-align:right}
#pnlTable td.sticky-col{text-align:left;position:sticky;left:0;
                        background:var(--sticky);z-index:50;
                        min-width:260px;max-width:340px}
#pnlTable tr:hover td{filter:brightness(.97)}

/* ── Row levels  (Tableau-inspired) ── */

/* L1 = section header: dark navy, white text, uppercase */
.row-l1 td{
  background:#1e2d4e;color:#e8ecf5;
  font-weight:700;font-size:11px;letter-spacing:.6px;text-transform:uppercase;
  border-top:3px solid #111d36;border-bottom:1px solid #111d36;
  padding-top:7px;padding-bottom:7px}
.row-l1 td.sticky-col{background:#1e2d4e;color:#e8ecf5}
[data-theme=dark] .row-l1 td{background:#0d1a30;color:#c5cfe0;border-color:#0a1220}
[data-theme=dark] .row-l1 td.sticky-col{background:#0d1a30}

/* L1 arrow: lighter so it's visible on dark bg */
.row-l1 .xarr{color:#7a9cc0}

/* L2 = sub-total: white bg, bold, with left accent bar */
.row-l2 td{
  background:#f0f4fb;font-weight:700;font-size:12px;color:#1a2a4a;
  border-bottom:1px solid #d8e2f0}
.row-l2 td.sticky-col{background:#f0f4fb;border-left:3px solid #4a7fc1}
[data-theme=dark] .row-l2 td{background:#1a2540;color:#b8c9e0;border-color:#243050}
[data-theme=dark] .row-l2 td.sticky-col{background:#1a2540;border-left-color:#3a6ba0}

/* L3 = line item: clean white */
.row-l3 td{
  background:#fff;font-weight:400;font-size:12px;color:#333;
  border-bottom:1px solid #eaeef5}
.row-l3 td.sticky-col{background:#fff}
[data-theme=dark] .row-l3 td{background:#1f2937;color:#d1d9e0;border-color:#2a3545}
[data-theme=dark] .row-l3 td.sticky-col{background:#1f2937}

/* L4 = MNG4 detail: white, slightly gray, italic */
.row-l4 td{
  background:#fff;font-weight:400;font-size:11px;color:#555;font-style:italic;
  border-bottom:1px solid #f0f3f8}
.row-l4 td.sticky-col{background:#fafafa}
[data-theme=dark] .row-l4 td{background:#1a2030;color:#a8b8c8;border-color:#222d3a;font-style:italic}
[data-theme=dark] .row-l4 td.sticky-col{background:#1a2030}

/* Hover — subtle highlight */
.row-l2 tr:hover td,.row-l3:hover td,.row-l4:hover td{filter:brightness(.97)}

/* Expand toggle */
.xbtn{cursor:pointer;display:inline-flex;align-items:center;gap:6px;
      user-select:none;width:100%}
.xarr{font-size:9px;transition:transform .2s ease;display:inline-block;
      color:var(--muted);flex-shrink:0;line-height:1}
.xarr.open{transform:rotate(90deg)}
.i2{padding-left:22px!important}
.i3{padding-left:42px!important}
.i4{padding-left:58px!important}

/* Value classes */
.neg{color:var(--red)}
.vpos{color:var(--green);font-weight:600}
.vneg{color:var(--red);font-weight:600}
.bold{font-weight:700}
td.col-total-cell{background:rgba(26,46,94,.06);font-weight:700;
                  border-left:2px solid rgba(26,46,94,.15)}
td.col-var-cell{background:rgba(46,125,50,.05)}
td.col-var-cell.vpos{background:rgba(46,125,50,.08)}
td.col-var-cell.vneg{background:rgba(198,40,40,.06)}
[data-theme=dark] td.col-total-cell{background:rgba(26,46,94,.35)}
[data-theme=dark] td.col-var-cell{background:rgba(26,54,32,.25)}

.invisible{visibility:hidden}

/* ── Row highlight (click to select) ── */
tr.row-selected td{
  background:#fff8c5 !important;
  outline:2px solid #f0c000;
  outline-offset:-1px;
}
tr.row-selected td.sticky-col{
  background:#fff8c5 !important;
  border-left:4px solid #f0c000 !important;
}
[data-theme=dark] tr.row-selected td{
  background:#3a3000 !important;
  outline-color:#f0c000;
}
[data-theme=dark] tr.row-selected td.sticky-col{
  background:#3a3000 !important;
  border-left-color:#f0c000 !important;
}

/* ── Subtotal row (MNG_1 at bottom of each P&L section) ── */
.row-subtotal td{
  background:#dce7f5;color:#0f1e3a;
  font-weight:700;font-size:12.5px;
  border-top:2px solid #4a7fc1;border-bottom:3px solid #1e2d4e;
  padding-top:6px;padding-bottom:6px}
.row-subtotal td.sticky-col{
  background:#dce7f5;border-left:4px solid #1e2d4e}
[data-theme=dark] .row-subtotal td{background:#142340;color:#c0d4f0;border-color:#2a4a80}
[data-theme=dark] .row-subtotal td.sticky-col{background:#142340;border-left-color:#4a7fc1}

/* Section gap before each MNG_1 block */
tr.pnl-gap td{height:8px;background:var(--bg);border:none;padding:0}

/* Empty / error */
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;
       line-height:1.8}

/* Tooltip badge */
.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;
       font-weight:700;background:var(--blue-lt);color:var(--blue);margin-left:4px}

/* ── Chart Modal ── */
#chartModal{
  display:none;position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,.65);align-items:center;justify-content:center}
#chartModal.open{display:flex}
#chartBox{
  background:var(--card);border-radius:14px;padding:24px;
  max-width:860px;width:90vw;box-shadow:0 16px 48px rgba(0,0,0,.35);
  position:relative;max-height:90vh;overflow-y:auto}
#chartTitle{font-size:15px;font-weight:700;color:var(--text);margin-bottom:16px}
#chartClose{position:absolute;top:12px;right:14px;font-size:20px;cursor:pointer;
            color:var(--muted);background:none;border:none;line-height:1;padding:4px 8px}
#chartClose:hover{color:var(--text)}
#chartCanvas{max-height:400px}

/* ── Tab Navigation ── */
.tab-nav{background:var(--card);border-bottom:2px solid var(--border);
         padding:0 20px;display:flex;gap:0;align-items:stretch;
         position:sticky;top:50px;z-index:360;min-height:38px}
.tab-btn{padding:0 22px;border:none;border-bottom:3px solid transparent;
         background:none;color:var(--muted);cursor:pointer;font-size:13px;
         font-weight:600;transition:.15s;white-space:nowrap;
         display:flex;align-items:center;margin-bottom:-2px}
.tab-btn:hover{color:var(--text);background:var(--bg)}
.tab-btn.on{color:var(--blue);border-bottom-color:var(--blue)}

/* ── CPA / MPOS panel ── */
.cpa-panel{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.cpa-filter-bar{background:var(--card);border-bottom:1px solid var(--border);
                padding:10px 20px;display:flex;gap:14px;flex-wrap:wrap;
                align-items:flex-end;flex-shrink:0}
.cpa-filter-bar label{font-size:10px;font-weight:700;color:var(--muted);
                      text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;
                      display:block;margin-bottom:3px}
.cpa-tbl-wrap{flex:1 1 0;min-height:0;overflow-x:auto;overflow-y:auto;padding:0 20px 16px}
.cpa-tbl-wrap::-webkit-scrollbar{height:6px;width:6px}
.cpa-tbl-wrap::-webkit-scrollbar-track{background:var(--bg)}
.cpa-tbl-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.cpa-tbl-wrap .tbl-outer{border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-top:16px}

/* ── CPA/MPOS Table ── */
.cpa-table{border-collapse:collapse;width:100%;font-size:12px}
.cpa-tbl-wrap .tbl-outer{border-radius:6px;box-shadow:0 1px 8px rgba(0,0,0,.09);
                         border:1px solid #E8E8E8;margin-top:16px}
/* Shrink container when table is in density mode so no white gap shows on right */
.cpa-tbl-wrap:has(.cpa-table[data-density]) .tbl-outer{width:fit-content;min-width:0}
/* MPOS Light footnote */
.mpos-light-footnote{font-size:10.5px;color:var(--muted);padding:8px 4px 4px;line-height:1.6}
.mpos-light-footnote b{color:var(--text)}
/* ── Key-numbers tab ── */
.kn-panel{flex:1 1 0;min-height:0;overflow-y:auto;padding:0 20px 20px;display:flex;flex-direction:column}
.kn-filter-bar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 0 10px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:0;position:sticky;top:0;z-index:50}
.kn-filter-bar label{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.kn-filter-bar select{padding:4px 8px;border:1.5px solid var(--border);border-radius:7px;background:var(--card);color:var(--text);font-size:12px;cursor:pointer}
.kn-tbl-outer{border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.1);overflow:hidden;margin-top:16px;display:inline-block}
.kn-table{border-collapse:collapse;font-size:13px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;width:auto}
/* ── Headers ── */
.kn-table th{background:#FFE600;color:#1a1a1a;padding:9px 16px;text-align:center;white-space:nowrap;font-size:12px;font-weight:700;border:none}
.kn-table th.kn-bu-hdr{text-align:left;background:#fff;color:#1a1a1a;min-width:165px;border-right:1px solid #ddd}
.kn-table th.kn-grp-hdr{background:#FFE600;color:#1a1a1a;border-left:3px solid #fff}
.kn-table th.kn-grp-adj{background:#FFB800;color:#1a1a1a;border-left:3px solid #fff}
.kn-table th.kn-grp-ytd{background:#FFE600;color:#1a1a1a;border-left:4px solid #bbb}
.kn-table th.kn-grp-ytdadj{background:#FFB800;color:#1a1a1a;border-left:3px solid #fff}
.kn-table th.kn-sub-hdr{background:#FFE600;color:#1a1a1a;font-size:11px;border-top:1px solid rgba(0,0,0,.08);border-right:1px solid rgba(0,0,0,.08)}
.kn-table th.kn-sub-adj{background:#FFB800;color:#1a1a1a;font-size:11px;border-top:1px solid rgba(0,0,0,.08);border-right:1px solid rgba(0,0,0,.08)}
.kn-table th.kn-sub-ytd{background:#FFE600;color:#1a1a1a;font-size:11px;border-top:1px solid rgba(0,0,0,.08);border-right:1px solid rgba(0,0,0,.08);border-left:3px solid #bbb}
.kn-table th.kn-sub-ytdadj{background:#FFB800;color:#1a1a1a;font-size:11px;border-top:1px solid rgba(0,0,0,.08);border-right:1px solid rgba(0,0,0,.08)}
/* ── Data cells (default) ── */
.kn-table td{padding:8px 16px;text-align:right;white-space:nowrap;border:none;font-size:13px}
.kn-table td.kn-bu-cell{text-align:left;padding-left:16px;padding-right:16px;border-right:1px solid rgba(255,255,255,.12)}
/* ── L0: Fintech ── */
.kn-row-l0 td{background:#5a5a5a;color:#fff;font-weight:700;border-bottom:2px solid #444}
.kn-row-l0 td.kn-adj-cell{background:#484848}
.kn-row-l0 td.kn-ytd-sep{border-left:3px solid #888}
/* ── L1: Acquiring / Fintech Services ── */
.kn-row-l1 td{background:#333333;color:#fff;font-weight:700;border-bottom:1px solid #222}
.kn-row-l1 td.kn-adj-cell{background:#252525}
.kn-row-l1 td.kn-ytd-sep{border-left:3px solid #555}
/* ── L2: sub-BUs ── */
.kn-row-l2 td{background:#fff;color:#222;font-weight:500;border-bottom:1px solid #EBEBEB}
.kn-row-l2 td.kn-bu-cell{background:#fff;padding:6px 16px}
.kn-row-l2 td.kn-adj-cell{background:#FFF8E8}
.kn-row-l2 td.kn-ytd-sep{border-left:3px solid #ddd}
/* pill inside L2 BU cell */
.kn-pill{display:inline-block;background:#E2E2E2;color:#333;border-radius:20px;padding:4px 14px;font-weight:500;font-size:12px;line-height:1.3}
/* ── One-offs section ── */
.kn-oneoff-section{margin-top:16px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 16px}
.kn-oneoff-title{font-size:12px;font-weight:700;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.kn-oneoff-inputs{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.kn-oneoff-inputs label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:3px}
.kn-oneoff-inputs select,.kn-oneoff-inputs input{padding:4px 8px;border:1.5px solid var(--border);border-radius:7px;background:var(--card);color:var(--text);font-size:12px}
.kn-oneoff-inputs input[type=number]{width:120px}
.kn-oneoff-inputs input[type=text]{width:140px}
.kn-add-btn{padding:5px 14px;background:#FFB800;color:#1a1a1a;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer}
.kn-add-btn:hover{background:#e0a000}
.kn-oneoff-list{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.kn-oneoff-item{display:flex;align-items:center;gap:10px;font-size:11px;background:var(--bg);border-radius:5px;padding:4px 10px}
.kn-oneoff-item .kn-del{cursor:pointer;color:var(--red);font-weight:700;font-size:13px;line-height:1;background:none;border:none;padding:0 4px}
.kn-delta-pos{color:#1a1a1a;font-weight:700}
.kn-delta-neg{color:#CC0000;font-weight:700}
.cpa-table th{padding:9px 12px;text-align:right;white-space:nowrap;
              font-size:11px;font-weight:700;position:sticky;top:0;z-index:100;
              border-bottom:1px solid rgba(0,0,0,.15);letter-spacing:.3px}
.cpa-table th.cpa-name-hdr{text-align:left;position:sticky;left:0;z-index:200;
                            background:#1a2740;color:#fff;
                            min-width:240px;max-width:360px;font-size:12px}
/* Monthly columns */
.cpa-hdr-monthly{background:#C8860A;color:#fff;font-weight:700}
.cpa-hdr-real{background:#E8A020;color:#fff;font-weight:700}
/* YTD columns */
.cpa-hdr-ytd{background:#1565C0;color:#fff;font-weight:700}
/* Gap column */
.cpa-hdr-sep{background:#F2F2F2;width:8px;padding:0;border:none}
/* Delta columns */
.cpa-hdr-delta{background:#546E7A;color:#fff;font-weight:700;border-left:1px solid #607D8B;font-size:10px}
/* Group sub-header row */
.cpa-table tr.cpa-grp-hdr th{background:#1a2740;color:#8aa0c0;font-size:10px;
                               padding:4px 12px;border-bottom:1px solid #0d1a30}
.cpa-table tr.cpa-grp-hdr th.cpa-name-hdr{background:#1a2740;color:#8aa0c0}
/* Dark theme overrides for column headers */
[data-theme=dark] .cpa-hdr-real{background:#b87418;color:#fff9e6}
[data-theme=dark] .cpa-hdr-monthly{background:#9e6a0c;color:#fff9e6}
[data-theme=dark] .cpa-hdr-ytd{background:#0d47a1;color:#c8deff}
[data-theme=dark] .cpa-hdr-sep{background:#1e2533}
[data-theme=dark] .cpa-hdr-delta{background:#37474F;color:#cfd8dc}

/* ── CPA/MPOS Table rows ── */
.cpa-table td{padding:5px 12px;border-bottom:1px solid #F0F0F0;
              white-space:nowrap;text-align:right;color:#333}
.cpa-table td.cpa-name-cell{text-align:left;position:sticky;left:0;
                             background:#fff;z-index:50;
                             min-width:240px;max-width:360px}
/* Block header row — dark navy divider */
.cpa-row-block td{background:#1a2740;color:#fff;font-weight:700;font-size:11px;
                  letter-spacing:.5px;text-transform:uppercase;
                  border-top:6px solid var(--bg);border-bottom:none;
                  padding-top:8px;padding-bottom:8px}
.cpa-row-block td.cpa-name-cell{background:#1a2740;color:#fff}
[data-theme=dark] .cpa-row-block td{background:#0d1a30;color:#c5cfe0}
[data-theme=dark] .cpa-row-block td.cpa-name-cell{background:#0d1a30}
/* Total row — amber accent */
.cpa-row-total td{background:#FFFBF0;font-weight:700;font-size:12.5px;color:#1a1a1a;
                  border-top:2px solid #E8A020;border-bottom:2px solid #E8A020;
                  padding-top:6px;padding-bottom:6px}
.cpa-row-total td.cpa-name-cell{background:#FFFBF0;border-left:4px solid #E8A020;color:#1a1a1a}
[data-theme=dark] .cpa-row-total td{background:#1e1800;color:#f5d98a;border-color:#a06800}
[data-theme=dark] .cpa-row-total td.cpa-name-cell{background:#1e1800;border-left-color:#c8860a}
/* Item row */
.cpa-row-item td{background:#fff;font-weight:400;color:#333;border-bottom:1px solid #F0F0F0}
.cpa-row-item td.cpa-name-cell{background:#fff;padding-left:28px!important}
[data-theme=dark] .cpa-row-item td{background:#1f2937;color:#d1d9e0;border-color:#2a3545}
[data-theme=dark] .cpa-row-item td.cpa-name-cell{background:#1f2937}
/* Gap between blocks */
tr.cpa-gap td{height:6px;background:var(--bg);border:none;padding:0}
/* Delta cell colors */
td.cpa-delta-cell.vpos{color:var(--green);font-weight:600}
td.cpa-delta-cell.vneg{color:var(--red);font-weight:600}
[data-theme=dark] td.cpa-delta-cell.vpos{color:#86efac}
[data-theme=dark] td.cpa-delta-cell.vneg{color:#fca5a5}
/* Realizado cell */
td.cpa-real-cell{font-weight:700}
/* YTD cell */
td.cpa-ytd-cell{color:#1a3a6a;font-weight:500}
[data-theme=dark] td.cpa-ytd-cell{color:#93c5fd}
/* Hover */
.cpa-row-item:hover td{background:#FAFAFA!important}
.cpa-row-item:hover td.cpa-name-cell{background:#FAFAFA!important}
.cpa-row-total:hover td{filter:brightness(.97)}
.cpa-row-block:hover td{filter:brightness(1.06)}

/* ── Density levels (data-density="1|2|3") ── */
/* Level 1 — Compact */
.cpa-table[data-density="1"]{width:auto!important}
.cpa-table[data-density="1"] th{padding:6px 7px;font-size:10.5px}
.cpa-table[data-density="1"] td{padding:4px 7px;font-size:11.5px}
.cpa-table[data-density="1"] th.cpa-name-hdr,
.cpa-table[data-density="1"] td.cpa-name-cell{min-width:185px!important;max-width:240px}
.cpa-table[data-density="1"] th[style*="min-width"]{min-width:72px!important}
.cpa-table[data-density="1"] .cpa-row-item td.cpa-name-cell{padding-left:22px!important}
.cpa-table[data-density="1"] .cpa-hdr-sep{width:5px!important}
.cpa-table[data-density="1"] .cpa-td-sep{width:5px!important}
/* Level 2 — Dense */
.cpa-table[data-density="2"]{width:auto!important}
.cpa-table[data-density="2"] th{padding:5px 5px;font-size:10px}
.cpa-table[data-density="2"] td{padding:3px 5px;font-size:10.5px}
.cpa-table[data-density="2"] th.cpa-name-hdr,
.cpa-table[data-density="2"] td.cpa-name-cell{min-width:150px!important;max-width:200px}
.cpa-table[data-density="2"] th[style*="min-width"]{min-width:58px!important}
.cpa-table[data-density="2"] .cpa-row-item td.cpa-name-cell{padding-left:18px!important}
.cpa-table[data-density="2"] .cpa-hdr-sep{width:3px!important}
.cpa-table[data-density="2"] .cpa-td-sep{width:3px!important}
/* Level 3 — Ultra (print-ready) */
.cpa-table[data-density="3"]{width:auto!important}
.cpa-table[data-density="3"] th{padding:3px 4px;font-size:9px;letter-spacing:0}
.cpa-table[data-density="3"] td{padding:2px 4px;font-size:10px}
.cpa-table[data-density="3"] th.cpa-name-hdr,
.cpa-table[data-density="3"] td.cpa-name-cell{min-width:120px!important;max-width:160px}
.cpa-table[data-density="3"] th[style*="min-width"]{min-width:46px!important}
.cpa-table[data-density="3"] .cpa-row-item td.cpa-name-cell{padding-left:14px!important}
.cpa-table[data-density="3"] .cpa-hdr-sep{width:2px!important;padding:0!important}
.cpa-table[data-density="3"] .cpa-td-sep{width:2px!important;padding:0!important}

/* ── Config / compact buttons in filter bar ── */
.cpa-cfg-btn{padding:4px 12px;border:1.5px solid var(--border);border-radius:7px;
             background:var(--card);color:var(--muted);cursor:pointer;font-size:11px;
             font-weight:700;transition:.15s;white-space:nowrap;display:flex;
             align-items:center;gap:5px;line-height:1.4}
.cpa-cfg-btn:hover{border-color:var(--blue);color:var(--blue)}
.cpa-cfg-btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}

/* ── Line Config Modal ── */
#lineConfigModal{display:none;position:fixed;inset:0;z-index:1500;
                 background:rgba(0,0,0,.62);align-items:center;justify-content:center}
#lineConfigModal.open{display:flex}
#lineConfigBox{background:var(--card);border-radius:14px;padding:24px;max-width:460px;
               width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.4);position:relative;
               height:min(600px,80vh);display:flex;flex-direction:column}
.lcm-header{display:flex;justify-content:space-between;align-items:center;
            margin-bottom:12px;flex-shrink:0}
.lcm-title{font-size:14px;font-weight:700;color:var(--text)}
.lcm-close{background:none;border:none;cursor:pointer;color:var(--muted);
           font-size:20px;padding:4px 8px;line-height:1}
.lcm-close:hover{color:var(--text)}
.lcm-top-acts{display:flex;gap:10px;margin-bottom:10px;flex-shrink:0}
.lcm-top-btn{font-size:11px;font-weight:700;color:var(--blue);
             background:none;border:none;cursor:pointer;padding:0}
.lcm-top-btn:hover{text-decoration:underline}
.lcm-scroll{flex:1 1 0;overflow-y:auto;min-height:0;padding-right:2px}
.lcm-block-hdr{font-size:10px;font-weight:700;text-transform:uppercase;
               letter-spacing:.7px;color:var(--muted);padding:12px 4px 5px;
               border-bottom:1px solid var(--border);margin-bottom:4px}
.lcm-item{display:flex;align-items:center;gap:9px;padding:7px 9px;
          border-radius:8px;user-select:none;border:1.5px solid transparent;
          margin-bottom:3px;background:var(--bg);transition:.1s;cursor:default}
.lcm-item:hover{background:var(--blue-lt)}
.lcm-item.lcm-dragging{opacity:.3;border-color:var(--border)}
.lcm-item.lcm-over{border-color:var(--blue);background:var(--blue-lt)}
.lcm-handle{cursor:grab;color:var(--muted);font-size:16px;flex-shrink:0;line-height:1}
.lcm-handle:active{cursor:grabbing}
.lcm-check{width:15px;height:15px;accent-color:var(--blue);cursor:pointer;flex-shrink:0}
.lcm-label{flex:1;font-size:12px;color:var(--text);
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcm-footer{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;
            flex-shrink:0;border-top:1px solid var(--border);padding-top:14px}
.lcm-btn{padding:7px 18px;border-radius:8px;border:1.5px solid var(--border);
         background:var(--card);color:var(--text);cursor:pointer;
         font-size:12px;font-weight:600;transition:.15s}
.lcm-btn:hover{background:var(--bg)}
.lcm-btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.lcm-btn.primary:hover{background:#1256a8}
</style>
</head>
<body>

<!-- ── Header ── -->
<header class="hdr">
  <h1>P&amp;L Brasil</h1>
  <div class="hdr-r">
    <span class="upd" id="lastUpd"></span>
    <button class="btn-hdr" id="btnTheme" onclick="toggleTheme()">Dark</button>
  </div>
</header>

<!-- ── Tab Navigation ── -->
<nav class="tab-nav" id="tabNav">
  <button class="tab-btn" data-tab="keynums" onclick="switchTab(this)">Key-numbers</button>
  <button class="tab-btn on" data-tab="pnl" onclick="switchTab(this)">P&amp;L</button>
  <button class="tab-btn" data-tab="cpa" onclick="switchTab(this)">CPA</button>
  <button class="tab-btn" data-tab="mpos" onclick="switchTab(this)">Point &amp; MPOS</button>
  <button class="tab-btn" data-tab="mposlight" onclick="switchTab(this)">MPOS Light</button>
</nav>

<!-- ── Filters ── -->
<div class="filters" id="filterBar" style="top:88px">

  <!-- Cenários -->
  <div class="fg">
    <label>Cenário</label>
    <div id="cenarioPills" class="pills"></div>
  </div>

  <div class="sep"></div>

  <!-- Visualização -->
  <div class="fg">
    <label>Visualização</label>
    <div class="bg" id="viewGrp">
      <button class="on" data-v="evolutivo" onclick="setView(this)">Evolutivo</button>
      <button data-v="total" onclick="setView(this)">Período Total</button>
      <button data-v="comparacao" onclick="setView(this)">Comparação</button>
    </div>
  </div>

  <!-- Granularidade (só no evolutivo) -->
  <div class="fg" id="granWrap">
    <label>Granularidade</label>
    <div class="bg" id="granGrp">
      <button data-g="mensal" onclick="setGran(this)">Mensal</button>
      <button data-g="trimestral" onclick="setGran(this)">Trimestral</button>
      <button class="on" data-g="anual" onclick="setGran(this)">Anual</button>
      <button data-g="ytdfy" onclick="setGran(this)">YTD/FY</button>
    </div>
  </div>

  <!-- Corte YTD (visível apenas em modo YTD/FY) -->
  <div class="fg" id="cutoffGroup" style="display:none">
    <label>Corte YTD</label>
    <select id="cutoffSel" onchange="setCutoff(this.value)"
      style="padding:4px 8px;border:1.5px solid var(--border);border-radius:7px;
             background:var(--card);color:var(--text);font-size:12px;min-width:90px;cursor:pointer"></select>
  </div>

  <!-- Mês Ref (visível apenas em modo comparação) -->
  <div class="fg" id="mesRefGroup" style="display:none">
    <label>Mês Ref</label>
    <select id="mesRefSel" onchange="render()"
      style="padding:4px 8px;border:1.5px solid var(--border);border-radius:7px;
             background:var(--card);color:var(--text);font-size:12px;min-width:90px;cursor:pointer"></select>
  </div>

  <!-- Cenário Ref (visível apenas em modo comparação) -->
  <div class="fg" id="cenRefGroup" style="display:none">
    <label>Cenário Ref</label>
    <select id="cenRefSel" onchange="setCenRef(this.value)"
      style="padding:4px 8px;border:1.5px solid var(--border);border-radius:7px;
             background:var(--card);color:var(--text);font-size:12px;min-width:130px;cursor:pointer"></select>
  </div>

  <div class="sep"></div>

  <!-- Ano -->
  <div class="fg">
    <label>Ano</label>
    <div class="ms-wrap">
      <div class="ms-trig" onclick="toggleMs(event,'ano')">
        <span id="anoLabel">Todos</span><span class="caret">▼</span>
      </div>
      <div class="ms-panel" id="anoPanel"></div>
    </div>
  </div>

  <!-- Mês de / até -->
  <div class="fg" id="mesGroup">
    <label>Mês (de → até)</label>
    <div style="display:flex;gap:5px;align-items:center">
      <select id="mesFrom" onchange="render()"
        style="padding:4px 8px;border:1.5px solid var(--border);border-radius:7px;
               background:var(--card);color:var(--text);font-size:12px;min-width:82px;cursor:pointer"></select>
      <span style="color:var(--muted);font-size:12px">→</span>
      <select id="mesTo" onchange="render()"
        style="padding:4px 8px;border:1.5px solid var(--border);border-radius:7px;
               background:var(--card);color:var(--text);font-size:12px;min-width:82px;cursor:pointer"></select>
    </div>
  </div>

  <div class="sep"></div>

  <!-- Seção P&L (MNG_1) -->
  <div class="fg">
    <label>Seção P&L</label>
    <div class="ms-wrap">
      <div class="ms-trig" onclick="toggleMs(event,'secao')">
        <span id="secaoLabel">Todas</span><span class="caret">▼</span>
      </div>
      <div class="ms-panel" id="secaoPanel"></div>
    </div>
  </div>

  <!-- Macro BU -->
  <div class="fg">
    <label>Macro BU</label>
    <div class="ms-wrap">
      <div class="ms-trig" onclick="toggleMs(event,'macro')">
        <span id="macroLabel">Todos</span><span class="caret">▼</span>
      </div>
      <div class="ms-panel" id="macroPanel"></div>
    </div>
  </div>

  <!-- Produto -->
  <div class="fg">
    <label>Produto</label>
    <div class="ms-wrap">
      <div class="ms-trig" onclick="toggleMs(event,'prod')">
        <span id="prodLabel">Todos</span><span class="caret">▼</span>
      </div>
      <div class="ms-panel" id="prodPanel"></div>
    </div>
  </div>

  <div class="sep"></div>

  <!-- Unidade -->
  <div class="fg">
    <label>Unidade</label>
    <div class="bg" id="unitGrp">
      <button data-u="1" onclick="setUnit(this)">R$</button>
      <button data-u="1000" onclick="setUnit(this)">R$ mil</button>
      <button class="on" data-u="1000000" onclick="setUnit(this)">R$ M</button>
    </div>
  </div>

  <!-- % TPV toggle -->
  <div class="fg ml-a">
    <label>Display</label>
    <div class="bg" id="displayGrp">
      <button class="on" data-dm="abs" onclick="setDisplayMode(this)">Abs</button>
      <button data-dm="pct_tpv" onclick="setDisplayMode(this)">% TPV</button>
    </div>
  </div>

</div>

<!-- ── Table ── -->
<div class="tbl-wrap">
  <div class="tbl-outer">
    <table id="pnlTable">
      <thead id="pnlHead"></thead>
      <tbody id="pnlBody">
        <tr><td colspan="50" class="empty">⏳ Carregando dados...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ── CPA Panel ── -->
<div id="cpaPanel" class="cpa-panel" style="display:none">
  <div class="cpa-filter-bar">
    <div>
      <label>Mês</label>
      <select id="cpaMesSel" onchange="renderCpaTab()"
        style="padding:4px 8px;border:1.5px solid var(--border);border-radius:7px;
               background:var(--card);color:var(--text);font-size:12px;min-width:90px;cursor:pointer"></select>
    </div>
    <div>
      <label>Unidade</label>
      <div class="bg" id="cpaUnitGrp">
        <button data-u="1" onclick="setCpaUnit(this)">R$</button>
        <button data-u="1000" onclick="setCpaUnit(this)">R$ mil</button>
        <button class="on" data-u="1000000" onclick="setCpaUnit(this)">R$ M</button>
      </div>
    </div>
    <div>
      <label>Macro BU</label>
      <select id="cpaMacroBUSel" onchange="cpaMacroBU=this.value;renderCpaTab()"
        style="padding:4px 8px;border:1.5px solid var(--border);border-radius:7px;
               background:var(--card);color:var(--text);font-size:12px;min-width:110px;cursor:pointer"></select>
    </div>
    <div style="margin-left:auto;display:flex;align-items:flex-end;gap:8px">
      <div>
        <label style="display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">Largura</label>
        <div style="display:flex;align-items:center;gap:0;border:1.5px solid var(--border);border-radius:7px;overflow:hidden">
          <button class="cpa-cfg-btn" id="cpaWidenBtn" onclick="stepDensity('cpa',-1)"
            style="border:none;border-radius:0;padding:4px 9px;font-size:13px;line-height:1" title="Aumentar largura">+</button>
          <span id="cpaDensityLbl" style="font-size:10px;font-weight:700;color:var(--muted);padding:0 6px;white-space:nowrap;min-width:52px;text-align:center">Normal</span>
          <button class="cpa-cfg-btn" id="cpaNarrowBtn" onclick="stepDensity('cpa',1)"
            style="border:none;border-radius:0;padding:4px 9px;font-size:13px;line-height:1" title="Diminuir largura">−</button>
        </div>
      </div>
      <div>
        <label style="display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">P&amp;L</label>
        <button class="cpa-cfg-btn" onclick="openLcm('cpa')">⚙ Editar P&amp;L</button>
      </div>
    </div>
  </div>
  <div class="cpa-tbl-wrap">
    <div class="tbl-outer">
      <table class="cpa-table" id="cpaTable">
        <thead id="cpaHead"></thead>
        <tbody id="cpaBody"><tr><td colspan="12" class="empty">⏳ Carregando...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ── Point & MPOS Panel ── -->
<div id="mposPanel" class="cpa-panel" style="display:none">
  <div class="cpa-filter-bar">
    <div>
      <label>Mês</label>
      <select id="mposMesSel" onchange="renderMposTab()"
        style="padding:4px 8px;border:1.5px solid var(--border);border-radius:7px;
               background:var(--card);color:var(--text);font-size:12px;min-width:90px;cursor:pointer"></select>
    </div>
    <div>
      <label>Unidade</label>
      <div class="bg" id="mposUnitGrp">
        <button data-u="1" onclick="setMposUnit(this)">R$</button>
        <button data-u="1000" onclick="setMposUnit(this)">R$ mil</button>
        <button class="on" data-u="1000000" onclick="setMposUnit(this)">R$ M</button>
      </div>
    </div>
    <div>
      <label>Macro BU</label>
      <select id="mposMacroBUSel" onchange="mposMacroBU=this.value;renderMposTab()"
        style="padding:4px 8px;border:1.5px solid var(--border);border-radius:7px;
               background:var(--card);color:var(--text);font-size:12px;min-width:110px;cursor:pointer"></select>
    </div>
    <div style="margin-left:auto;display:flex;align-items:flex-end;gap:8px">
      <div>
        <label style="display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">Largura</label>
        <div style="display:flex;align-items:center;gap:0;border:1.5px solid var(--border);border-radius:7px;overflow:hidden">
          <button class="cpa-cfg-btn" id="mposWidenBtn" onclick="stepDensity('mpos',-1)"
            style="border:none;border-radius:0;padding:4px 9px;font-size:13px;line-height:1" title="Aumentar largura">+</button>
          <span id="mposDensityLbl" style="font-size:10px;font-weight:700;color:var(--muted);padding:0 6px;white-space:nowrap;min-width:52px;text-align:center">Normal</span>
          <button class="cpa-cfg-btn" id="mposNarrowBtn" onclick="stepDensity('mpos',1)"
            style="border:none;border-radius:0;padding:4px 9px;font-size:13px;line-height:1" title="Diminuir largura">−</button>
        </div>
      </div>
      <div>
        <label style="display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">P&amp;L</label>
        <button class="cpa-cfg-btn" onclick="openLcm('mpos')">⚙ Editar P&amp;L</button>
      </div>
    </div>
  </div>
  <div class="cpa-tbl-wrap">
    <div class="tbl-outer">
      <table class="cpa-table" id="mposTable">
        <thead id="mposHead"></thead>
        <tbody id="mposBody"><tr><td colspan="12" class="empty">⏳ Carregando...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ── MPOS Light Panel ── -->
<div id="mposLightPanel" class="cpa-panel" style="display:none">
  <div class="cpa-filter-bar">
    <div>
      <label>Mês</label>
      <select id="mposLightMesSel" onchange="renderMposLightTab()"
        style="padding:4px 8px;border:1.5px solid var(--border);border-radius:7px;
               background:var(--card);color:var(--text);font-size:12px;min-width:90px;cursor:pointer"></select>
    </div>
    <div>
      <label>Unidade</label>
      <div class="bg" id="mposLightUnitGrp">
        <button data-u="1" onclick="setMposLightUnit(this)">R$</button>
        <button data-u="1000" onclick="setMposLightUnit(this)">R$ mil</button>
        <button class="on" data-u="1000000" onclick="setMposLightUnit(this)">R$ M</button>
      </div>
    </div>
    <div>
      <label>Macro BU</label>
      <select id="mposLightMacroBUSel" onchange="mposLightMacroBU=this.value;renderMposLightTab()"
        style="padding:4px 8px;border:1.5px solid var(--border);border-radius:7px;

<script>
// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
let allData = [];
let selCen   = [];   // selected cenarios
let selAnos  = [];   // selected anos (strings)
let selMacro = [];
let selProd  = [];
let selSecao = [];   // selected MNG_1 sections

let viewMode    = 'evolutivo';   // 'evolutivo' | 'total' | 'comparacao'
let granMode    = 'anual';       // 'mensal' | 'trimestral' | 'anual' | 'ytdfy'
let unitDiv     = 1_000_000;
let cutoffMes   = null;          // YTD cutoff month (YYYYMM int)
let displayMode = 'abs';         // 'abs' | 'pct_tpv'
let compCenario = null;          // reference scenario for comparação mode
let compHasFcst = false;         // whether Forecast data exists for the ref month

// expand state (Set of keys)
let expL1 = new Set();
let expL2 = new Set();
let expL3 = new Set();

// option lists
let optCen = [], optAnos = [], optMeses = [], optMacro = [], optProd = [], optSecao = [];

// global chart data store: key -> byCen map
let chartData = new Map();
// current chart.js instance
let chartInstance = null;
// selected (highlighted) row keys
let selectedRows = new Set();

const MN = {
  '01':'Jan','02':'Fev','03':'Mar','04':'Abr','05':'Mai','06':'Jun',
  '07':'Jul','08':'Ago','09':'Set','10':'Out','11':'Nov','12':'Dez'
};

// short labels for scenarios
const CEN_LABEL = {
  'Actual Sin Distribuir':                         'Act SD',
  'Realizado':                                     'Real',
  'Plan':                                          'Plan',
  'Forecast':                                      'Fcst',
  'Real Distribuido Liminar 2023 sin Indirect to S4':'RD Lim',
};
function shortCen(c){ return CEN_LABEL[c] || c.slice(0,8); }

// ═══════════════════════════════════════════════════════════
//  LOAD DATA
// ═══════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════
//  UNPIVOT — Google Sheets pivot format → normalized rows
//
//  Handles two sub-formats automatically:
//
//  A) CLEAN (headerRow:2 works in Verdi):
//     Each row: { Macro_BU, BU, Cenario, MNG_1..4, "202301": val, ... }
//
//  B) DUAL-HEADER (Verdi reads row-1 as keys, row-2 as first data row):
//     rows[0]: { "SUM de Value":"Macro_BU", "col_2":"BU", ..., "MES":202301, "col_9":202302 }
//     rows[1+]: actual data with those weird keys
// ═══════════════════════════════════════════════════════════
function unpivot(rows) {
  if(!rows || !rows.length) return [];
  const first = rows[0];

  // ── Detect dual-header format ──────────────────────────
  // Signature: first row's VALUES contain known dimension names as strings
  const vals0 = Object.values(first).map(v => String(v||'').trim());
  const isDual = ['Macro_BU','Cenario','MNG_1'].every(d => vals0.includes(d));

  let colMap   = null;  // weird_key  → dim name  (e.g. "SUM de Value" → "Macro_BU")
  let monthMap = null;  // weird_key  → YYYYMM int (e.g. "MES" → 202301, "col_9" → 202302)
  let dataRows = rows;

  if(isDual) {
    colMap   = {};
    monthMap = {};
    for(const [k, v] of Object.entries(first)) {
      const s = String(v).trim();
      if(/^\d{6}$/.test(s)) monthMap[k] = parseInt(s);
      else colMap[k] = s;
    }
    dataRows = rows.slice(1);
  }

  // ── Dimension getter ───────────────────────────────────
  const getDim = (row, name) => {
    if(!colMap) return String(row[name]||'').trim();
    const key = Object.keys(colMap).find(k => colMap[k] === name);
    return key ? String(row[key]||'').trim() : '';
  };

  // ── Month columns ──────────────────────────────────────
  // dual: monthMap entries sorted by value; clean: keys matching /^\d{6}$/
  const months = monthMap
    ? Object.entries(monthMap).sort((a,b) => a[1]-b[1])
    : Object.keys(dataRows[0]||{}).filter(k => /^\d{6}$/.test(k)).sort().map(k => [k, parseInt(k)]);

  const result = [];
  for(const row of dataRows) {
    if(!row) continue;
    const cenario = getDim(row, 'Cenario');
    const mng1    = getDim(row, 'MNG_1');
    if(!cenario && !mng1) continue;

    for(const [key, month] of months) {
      const raw = row[key];
      if(raw === null || raw === undefined || raw === '') continue;
      const v = parseFloat(String(raw).replace(',','.'));
      if(isNaN(v) || v === 0) continue;
      const ano = Math.floor(month / 100);
      const mm  = month % 100;
      result.push({
        Macro_BU : getDim(row, 'Macro_BU'),
        Product  : getDim(row, 'BU'),
        Cenario  : cenario,
        MNG_1    : mng1,
        MNG_2    : getDim(row, 'MNG_2'),
        MNG_3    : getDim(row, 'MNG_3'),
        MNG_4    : getDim(row, 'MNG_4'),
        MES      : month,
        ANO      : ano,
        QUARTER  : mm <= 3 ? 'Q1' : mm <= 6 ? 'Q2' : mm <= 9 ? 'Q3' : 'Q4',
        Value    : v
      });
    }
  }
  return result;
}

fetch('data_pnl.json?t=' + Date.now())
  .then(r => { if(!r.ok) throw new Error('data_pnl.json não encontrado'); return r.json(); })
  .then(raw => {
    let data, lastUpdated, rowCount;
    if(Array.isArray(raw)) {
      // Pivot format from Google Sheets via Verdi Flows
      data        = unpivot(raw);
      lastUpdated = 'Google Sheets (Verdi)';
      rowCount    = data.length;
    } else {
      // Normalized format from BigQuery / Python script
      data        = raw.data || [];
      lastUpdated = raw.last_updated || '—';
      rowCount    = raw.row_count || data.length;
    }
    allData = data;
    document.getElementById('lastUpd').textContent =
      'Atualizado: ' + lastUpdated + ' · ' + rowCount.toLocaleString('pt-BR') + ' linhas';
    initFilters();
    render();
  })
  .catch(err => {
    document.getElementById('pnlBody').innerHTML =
      `<tr><td colspan="50" class="empty">
        ⚠️ ${err.message}<br>
        <small>Importe o flow <code>flow_pnl_sheets_github.json</code> no Verdi e execute-o para gerar <code>data_pnl.json</code></small>
       </td></tr>`;
  });

// ═══════════════════════════════════════════════════════════
//  INIT FILTERS
// ═══════════════════════════════════════════════════════════
function initFilters() {
  optCen   = uniq(allData.map(d => d.Cenario)).sort();
  optAnos  = uniq(allData.map(d => String(d.ANO))).sort();
  optMeses = uniq(allData.map(d => d.MES)).sort((a,b) => a-b);
  optMacro = uniq(allData.map(d => d.Macro_BU)).sort();
  optProd  = uniq(allData.map(d => d.Product)).sort();
  // Seção P&L: use MNG1_ORDER so options appear in P&L order
  optSecao = MNG1_ORDER.filter(s => allData.some(d => d.MNG_1 === s));

  selCen   = [...optCen];
  selAnos  = [...optAnos];
  selMacro = [...optMacro];
  selProd  = [...optProd];
  selSecao = [...optSecao];

  // Cenário pills
  const pillsDiv = document.getElementById('cenarioPills');
  optCen.forEach(c => {
    const el = document.createElement('span');
    el.className = 'pill on';
    el.textContent = c;
    el.dataset.c = c;
    el.onclick = () => {
      const on = el.classList.toggle('on');
      selCen = on ? [...selCen, c] : selCen.filter(x => x !== c);
      render();
    };
    pillsDiv.appendChild(el);
  });

  buildMsPanel('ano',   optAnos,  selAnos,  v => { selAnos  = v; cascadeMonths(); });
  buildMsPanel('secao', optSecao, selSecao, v => { selSecao = v; });
  buildMsPanel('macro', optMacro, selMacro, v => { selMacro = v; cascadeBU(); });
  buildMsPanel('prod',  optProd,  selProd,  v => { selProd  = v; });
  buildMesSelects();
  buildMesRefSel();
  buildCenRefSel();
  buildCutoffSel();
  buildCpaMonthSelectors();
  // Apply initial granularity state (default=anual: hide mesGroup)
  updateGranVisibility();
}

function uniq(arr){ return [...new Set(arr.filter(v => v != null && v !== ''))]; }

// ── Feature 1: Year → Month cascade ─────────────────────────
function cascadeMonths() {
  // Rebuild optMeses based on selected years
  const yearsSet = new Set(selAnos.map(Number));
  const prevFrom = parseInt(document.getElementById('mesFrom').value || 0);
  const prevTo   = parseInt(document.getElementById('mesTo').value   || 999999);

  optMeses = uniq(
    allData
      .filter(d => !selAnos.length || yearsSet.has(d.ANO))
      .map(d => d.MES)
  ).sort((a,b) => a-b);

  buildMesSelects(prevFrom, prevTo);
  buildMesRefSel();
  buildCutoffSel();
  // caller (buildMsPanel setter) will call render()
}

// ── Cascade Macro BU → BU ──────────────────────────────────
function cascadeBU() {
  const avail = uniq(
    allData
      .filter(d => !selMacro.length || selMacro.includes(d.Macro_BU))
      .map(d => d.Product)
  ).sort();
  // Keep only BUs that are valid for selected Macro BUs
  selProd = selProd.filter(p => avail.includes(p));
  if(!selProd.length) selProd = [...avail];
  buildMsPanel('prod', avail, selProd, v => { selProd = v; });
  // Don't call render() here — caller will do it
}

// ── Mes from/to ────────────────────────────────────────────
function buildMesSelects(prevFrom, prevTo) {
  ['mesFrom','mesTo'].forEach((id, i) => {
    const sel = document.getElementById(id);
    sel.innerHTML = '';
    optMeses.forEach(m => {
      const mm = String(m).slice(4,6);
      const yy = String(m).slice(2,4);
      const opt = document.createElement('option');
      opt.value = m;
      opt.textContent = (MN[mm]||mm) + '/' + yy;
      sel.appendChild(opt);
    });
  });
  if(optMeses.length){
    // Restore previous values if they still exist, else use first/last
    const newFrom = (prevFrom && optMeses.includes(prevFrom)) ? prevFrom : optMeses[0];
    const newTo   = (prevTo   && optMeses.includes(prevTo))   ? prevTo   : optMeses[optMeses.length-1];
    document.getElementById('mesFrom').value = newFrom;
    document.getElementById('mesTo').value   = newTo;
  }
}

function getMesRange(){
  const f = parseInt(document.getElementById('mesFrom').value||0);
  const t = parseInt(document.getElementById('mesTo').value||999999);
  return [Math.min(f,t), Math.max(f,t)];
}

// ── Mês Ref (for comparação mode) ─────────────────────────
function buildMesRefSel() {
  const sel = document.getElementById('mesRefSel');
  if(!sel) return;
  const prev = parseInt(sel.value||0);
  sel.innerHTML = '';
  optMeses.forEach(m => {
    const mm = String(m).slice(4,6);
    const yy = String(m).slice(2,4);
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = (MN[mm]||mm) + '/' + yy;
    sel.appendChild(opt);
  });
  if(prev && optMeses.includes(prev)) sel.value = prev;
  else if(optMeses.length) sel.value = optMeses[optMeses.length-1];
}

function getMesRef() {
  return parseInt(document.getElementById('mesRefSel').value||0);
}

// ── Cenário Ref (for comparação mode) ─────────────────────
function buildCenRefSel() {
  const sel = document.getElementById('cenRefSel');
  if(!sel) return;
  sel.innerHTML = '';
  optCen.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = c;
    sel.appendChild(opt);
  });
  if(compCenario && optCen.includes(compCenario)) sel.value = compCenario;
  else { sel.value = optCen[0]||''; compCenario = sel.value; }
}

function setCenRef(val) {
  compCenario = val;
  render();
}

function getCenRef() {
  return compCenario || document.getElementById('cenRefSel')?.value || (optCen[0]||'');
}

// Compute LY (same month previous year) and LM (previous month) from ref
function getCompPeriods(ref) {
  if(!ref) return { ref, ly: null, lm: null };
  const refY = Math.floor(ref / 100);
  const refM = ref % 100;
  const ly = (refY - 1) * 100 + refM;
  // previous month
  let lmY = refY, lmM = refM - 1;
  if(lmM < 1) { lmM = 12; lmY--; }
  const lm = lmY * 100 + lmM;
  return { ref, ly, lm };
}

// ── Multi-select panel ─────────────────────────────────────
function buildMsPanel(id, options, selected, setter) {
  const panel = document.getElementById(id+'Panel');
  panel.innerHTML = '';

  const acts = document.createElement('div');
  acts.className = 'ms-actions';
  acts.innerHTML =
    `<button onclick="msAll('${id}',true)">Todos</button>
     <button onclick="msAll('${id}',false)">Nenhum</button>`;
  panel.appendChild(acts);

  options.forEach(opt => {
    const lbl = document.createElement('label');
    lbl.className = 'ms-item';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = selected.includes(opt);
    cb.dataset.opt = opt;
    cb.onchange = () => {
      const vals = [...panel.querySelectorAll('input')]
                     .filter(c => c.checked).map(c => c.dataset.opt);
      setter(vals);
      updateMsLabel(id, vals, options);
      render();
    };
    const sp = document.createElement('span');
    sp.textContent = opt;
    lbl.appendChild(cb); lbl.appendChild(sp);
    panel.appendChild(lbl);
  });

  updateMsLabel(id, selected, options);
}

function updateMsLabel(id, sel, opts) {
  const el = document.getElementById(id+'Label');
  if(!el) return;
  if(!sel.length)           el.textContent = 'Nenhum';
  else if(sel.length===opts.length) el.textContent = 'Todos';
  else if(sel.length===1)   el.textContent = sel[0];
  else                      el.textContent = sel.length + ' selecionados';
}

function msAll(id, all) {
  const panel = document.getElementById(id+'Panel');
  const cbs = [...panel.querySelectorAll('input')];
  cbs.forEach(c => c.checked = all);
  const vals = all ? cbs.map(c => c.dataset.opt) : [];
  if(id==='ano')   { selAnos  = vals; updateMsLabel('ano',  vals, optAnos);  cascadeMonths(); }
  if(id==='secao') { selSecao = vals; updateMsLabel('secao',vals, optSecao); }
  if(id==='macro') { selMacro = vals; updateMsLabel('macro',vals, optMacro); cascadeBU(); }
  if(id==='prod')  { selProd  = vals; updateMsLabel('prod', vals, optProd); }
  render();
}

function toggleMs(e, id) {
  e.stopPropagation();
  ['ano','secao','macro','prod'].forEach(x => {
    if(x!==id) document.getElementById(x+'Panel').classList.remove('open');
  });
  document.getElementById(id+'Panel').classList.toggle('open');
}
document.addEventListener('click', () => {
  document.querySelectorAll('.ms-panel').forEach(p => p.classList.remove('open'));
});

// ═══════════════════════════════════════════════════════════
//  MODE TOGGLES
// ═══════════════════════════════════════════════════════════
function updateGranVisibility() {
  const ev   = viewMode === 'evolutivo';
  const comp = viewMode === 'comparacao';
  document.getElementById('granWrap').style.display    = ev ? '' : 'none';
  document.getElementById('mesGroup').style.display    = (ev && granMode==='mensal') ? '' : 'none';
  document.getElementById('cutoffGroup').style.display = (ev && granMode==='ytdfy') ? '' : 'none';
  document.getElementById('mesRefGroup').style.display = comp ? '' : 'none';
  document.getElementById('cenRefGroup').style.display = comp ? '' : 'none';
}

function setView(btn) {
  viewMode = btn.dataset.v;
  document.querySelectorAll('#viewGrp button').forEach(b => b.classList.toggle('on', b===btn));
  updateGranVisibility();
  render();
}

function setGran(btn) {
  granMode = btn.dataset.g;
  document.querySelectorAll('#granGrp button').forEach(b => b.classList.toggle('on', b===btn));
  updateGranVisibility();
  render();
}

function setCutoff(val) {
  cutoffMes = val ? parseInt(val) : null;
  render();
}

function buildCutoffSel() {
  const sel = document.getElementById('cutoffSel');
  if(!sel) return;
  sel.innerHTML = '';
  optMeses.forEach(m => {
    const mm = String(m).slice(4,6);
    const yy = String(m).slice(2,4);
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = (MN[mm]||mm) + '/' + yy;
    sel.appendChild(opt);
  });
  // Default: auto-detected cutoff
  const auto = getAutoCutoff();
  if(auto && optMeses.includes(auto)) sel.value = auto;
  else if(optMeses.length) sel.value = optMeses[optMeses.length-1];
  cutoffMes = parseInt(sel.value) || null;
}

function setUnit(btn) {
  unitDiv = parseFloat(btn.dataset.u);
  document.querySelectorAll('#unitGrp button').forEach(b => b.classList.toggle('on', b===btn));
  render();
}

// Feature 5: % TPV toggle
function setDisplayMode(btn) {
  displayMode = btn.dataset.dm;
  document.querySelectorAll('#displayGrp button').forEach(b => b.classList.toggle('on', b===btn));
  render();
}

function toggleTheme() {
  const dark = document.documentElement.dataset.theme === 'dark';
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  document.getElementById('btnTheme').textContent = dark ? 'Dark' : 'Light';
}

// ═══════════════════════════════════════════════════════════
//  FILTERING
// ═══════════════════════════════════════════════════════════
function getFiltered() {
  if(viewMode === 'comparacao') {
    const ref    = getMesRef();
    const cenRef = getCenRef();
    const { ly, lm } = getCompPeriods(ref);
    return allData.filter(d =>
      (selSecao.length===0 || selSecao.includes(d.MNG_1)) &&
      (selMacro.length===0 || selMacro.includes(d.Macro_BU)) &&
      (selProd.length===0  || selProd.includes(d.Product)) &&
      (
        (d.MES === ref && d.Cenario === cenRef)        ||
        (d.MES === ref && d.Cenario === 'Plan')         ||
        (d.MES === ref && d.Cenario === 'Forecast')     ||
        (lm && d.MES === lm && d.Cenario === 'Realizado') ||
        (ly && d.MES === ly && d.Cenario === 'Realizado')
      )
    );
  }
  const [mf, mt] = getMesRange();
  return allData.filter(d =>
    selCen.includes(d.Cenario) &&
    (selAnos.length===0  || selAnos.includes(String(d.ANO))) &&
    (selSecao.length===0 || selSecao.includes(d.MNG_1)) &&
    (selMacro.length===0 || selMacro.includes(d.Macro_BU)) &&
    (selProd.length===0  || selProd.includes(d.Product)) &&
    d.MES >= mf && d.MES <= mt
  );
}

// ═══════════════════════════════════════════════════════════
//  COLUMN KEY
// ═══════════════════════════════════════════════════════════
// Auto-detect YTD cutoff: last month with Realizado/Actual data
function getAutoCutoff() {
  const actual = allData.filter(d =>
    d.Cenario==='Realizado' || d.Cenario==='Actual Sin Distribuir'
  ).map(d => d.MES);
  return actual.length ? Math.max(...actual) : null;
}

function colKey(row) {
  if(viewMode==='total') return '__total__';
  if(viewMode==='comparacao') {
    const ref    = getMesRef();
    const cenRef = getCenRef();
    const { ly, lm } = getCompPeriods(ref);
    // Order matters: ref scenario check first so it takes priority
    if(row.MES === ref && row.Cenario === cenRef)        return 'comp_ref';
    if(row.MES === ref && row.Cenario === 'Plan')         return 'comp_plan';
    if(row.MES === ref && row.Cenario === 'Forecast')     return 'comp_fcst';
    if(lm && row.MES === lm && row.Cenario === 'Realizado') return 'comp_lm';
    if(ly && row.MES === ly && row.Cenario === 'Realizado') return 'comp_ly';
    return null;
  }
  if(granMode==='mensal')     return String(row.MES);
  if(granMode==='trimestral') return (row.QUARTER||'Q?') + '/' + String(row.ANO).slice(2);
  if(granMode==='anual')      return String(row.ANO);
  if(granMode==='ytdfy') {
    const cut = cutoffMes || getAutoCutoff();
    if(!cut) return String(row.ANO);
    const cutY = Math.floor(cut/100);
    const cutM = cut % 100;
    if(row.ANO !== cutY) return 'fy_' + row.ANO;   // other years → FY
    return (row.MES % 100) <= cutM ? 'ytd' : 'ytg'; // current year → YTD or YTG
  }
  return '__total__';
}

function colLabel(k, refPeriods) {
  if(k==='comp_ref')  return 'Ref';
  if(k==='comp_plan') return 'Δ Plan';
  if(k==='comp_fcst') return 'Δ Fcst';
  if(k==='comp_lm')   return 'Δ Real LM';
  if(k==='comp_ly')   return 'Δ Real LY';
  if(k==='__total__') return granMode==='ytdfy' ? 'FY' : 'Total';
  if(k==='ytd') return 'YTD';
  if(k==='ytg') return 'YTG';
  if(/^fy_\d{4}$/.test(k)) return 'FY ' + k.slice(3);
  if(/^\d{6}$/.test(k)) return (MN[k.slice(4,6)]||k.slice(4,6)) + '/' + k.slice(2,4);
  return k;
}

function mesLabel(mes) {
  const mm = String(mes).slice(4,6);
  const yy = String(mes).slice(2,4);
  return (MN[mm]||mm) + '/' + yy;
}

function sortColKeys(arr) {
  function rank(k) {
    if(k==='comp_ref')        return 1;
    if(k==='comp_plan')       return 2;
    if(k==='comp_fcst')       return 3;
    if(k==='comp_lm')         return 4;
    if(k==='comp_ly')         return 5;
    if(k==='ytd')             return 1;
    if(k==='ytg')             return 2;
    if(k==='__total__')       return 99999998;
    if(/^fy_\d{4}$/.test(k)) return 99990000 + parseInt(k.slice(3));
    if(/^\d{6}$/.test(k))    return parseInt(k);
    if(/^Q\d\/\d{2}$/.test(k)){
      const [q,y] = k.split('/');
      return parseInt(y)*10 + parseInt(q[1]);
    }
    if(/^\d{4}$/.test(k))    return parseInt(k)*100;
    return 0;
  }
  return [...arr].sort((a,b) => rank(a)-rank(b));
}

// ═══════════════════════════════════════════════════════════
//  AGGREGATION
// ═══════════════════════════════════════════════════════════
function aggregate(data) {
  // result: Map<"l1|||l2|||l3|||l4", Map<cenario, Map<colKey, number>>>
  const rows = new Map();
  const colSet = new Set();

  for(const d of data) {
    const k1 = d.MNG_1 || '(s/ MNG_1)';
    const k2 = d.MNG_2 || '(s/ MNG_2)';
    const k3 = d.MNG_3 || '(s/ MNG_3)';
    const k4 = d.MNG_4 || '';
    const ck  = colKey(d);
    if(!ck) continue;
    const cen = d.Cenario;
    colSet.add(ck);
    const rowKey = k1+'|||'+k2+'|||'+k3+'|||'+k4;
    if(!rows.has(rowKey)) rows.set(rowKey, {k1,k2,k3,k4, byCen:new Map()});
    const byCen = rows.get(rowKey).byCen;
    if(!byCen.has(cen)) byCen.set(cen, new Map());
    const byCol = byCen.get(cen);
    byCol.set(ck, (byCol.get(ck)||0) + (d.Value||0));
  }

  // Build hierarchy: l1 -> l2 -> l3 -> l4
  const l1 = new Map();

  for(const [, row] of rows) {
    const {k1,k2,k3,k4,byCen} = row;
    if(!l1.has(k1)) l1.set(k1, {byCen:new Map(), children:new Map()});
    const n1 = l1.get(k1);
    addByCen(n1.byCen, byCen);

    if(!n1.children.has(k2)) n1.children.set(k2, {byCen:new Map(), children:new Map()});
    const n2 = n1.children.get(k2);
    addByCen(n2.byCen, byCen);

    if(!n2.children.has(k3)) n2.children.set(k3, {byCen:new Map(), children:new Map()});
    const n3 = n2.children.get(k3);
    addByCen(n3.byCen, byCen);

    // MNG_4 level
    if(k4) {
      if(!n3.children.has(k4)) n3.children.set(k4, {byCen:new Map()});
      const n4 = n3.children.get(k4);
      addByCen(n4.byCen, byCen);
    }
  }

  return { l1, cols: sortColKeys([...colSet]) };
}

function addByCen(target, src) {
  for(const [cen, colMap] of src) {
    if(!target.has(cen)) target.set(cen, new Map());
    const tgt = target.get(cen);
    for(const [col, val] of colMap) {
      tgt.set(col, (tgt.get(col)||0) + val);
    }
  }
}

function render() {
  const data = getFiltered();
  const {l1, cols} = aggregate(data);
  const cens = selCen.filter(c => optCen.includes(c));

  // Compute whether Forecast data exists for the ref month (for comparação mode)
  if(viewMode === 'comparacao') {
    const ref = getMesRef();
    compHasFcst = allData.some(d =>
      d.MES === ref && d.Cenario === 'Forecast' &&
      (selMacro.length===0 || selMacro.includes(d.Macro_BU)) &&
      (selProd.length===0  || selProd.includes(d.Product))
    );
  }

  // Reset chart data store
  chartData = new Map();

  renderHead(cols, cens);
  renderBody(l1,   cols, cens);
  requestAnimationFrame(updateStickyTop);
}

// ── Feature 4: Sticky header row stacking ────────────────────
// Since tbl-wrap is now the scroll container, top:0 = top of tbl-wrap.
// For multi-row headers (evolutivo multi-cenario), row 2 must be offset
// by row 1's height so they stack correctly without overlap.
function updateStickyTop() {
  const rows = document.querySelectorAll('#pnlTable thead tr');
  let offset = 0;
  rows.forEach(row => {
    row.querySelectorAll('th').forEach(th => { th.style.top = offset + 'px'; });
    offset += row.getBoundingClientRect().height || 34;
  });
}
window.addEventListener('resize', () => requestAnimationFrame(updateStickyTop));

// ── Head ───────────────────────────────────────────────────
function renderHead(cols, cens) {
  const head = document.getElementById('pnlHead');
  const isTotal = viewMode === 'total';
  const isComp  = viewMode === 'comparacao';
  const multi   = cens.length >= 2;

  if(isComp) {
    // Comparação: reference value (highlighted) + delta columns
    const ref    = getMesRef();
    const cenRef = getCenRef();
    const { ly, lm } = getCompPeriods(ref);
    const refLbl = mesLabel(ref);
    const lmLbl  = lm ? mesLabel(lm) : 'LM';
    const lyLbl  = ly ? mesLabel(ly) : 'LY';
    const refInfo = `${refLbl} · ${shortCen(cenRef)}`;
    let h = `<tr>`;
    h += `<th class="sticky-col">Conta</th>`;
    // ── Reference value column (highlighted) ──
    h += `<th class="col-total-hdr" style="border-left:3px solid #4a7fc1;min-width:100px">${shortCen(cenRef)}<br><span style="font-size:10px;font-weight:400">${refLbl}</span></th>`;
    // ── Separator ──
    h += `<th style="background:#0a1220;width:6px;padding:0;border:none"></th>`;
    // Δ vs Plan
    h += `<th class="col-var-hdr">Δ vs Plan<br><span style="font-size:10px;font-weight:400">${refLbl}</span></th>`;
    h += `<th class="col-var-hdr" style="font-size:10px">%</th>`;
    // Δ vs Forecast (only when data exists)
    if(compHasFcst) {
      h += `<th class="col-var-hdr">Δ vs Fcst<br><span style="font-size:10px;font-weight:400">${refLbl}</span></th>`;
      h += `<th class="col-var-hdr" style="font-size:10px">%</th>`;
    }
    // Δ vs Real LM
    h += `<th class="col-var-hdr">Δ vs Real LM<br><span style="font-size:10px;font-weight:400">${lmLbl}</span></th>`;
    h += `<th class="col-var-hdr" style="font-size:10px">%</th>`;
    // Δ vs Real LY
    h += `<th class="col-var-hdr">Δ vs Real LY<br><span style="font-size:10px;font-weight:400">${lyLbl}</span></th>`;
    h += `<th class="col-var-hdr" style="font-size:10px">%</th>`;
    h += `</tr>`;
    head.innerHTML = h;
    return;
  }

  if(isTotal) {
    // Columns = one per cenario + var (if 2 scenarios)
    let h = '<tr>';
    h += '<th class="sticky-col">Conta</th>';
    cens.forEach(c => h += `<th>${shortCen(c)}</th>`);
    if(cens.length===2){
      h += '<th class="col-var-hdr">Var</th>';
      h += '<th class="col-var-hdr">Var %</th>';
    }
    h += '</tr>';
    head.innerHTML = h;
  } else if(!multi) {
    // Simple evolutivo: one col per period
    let h = '<tr>';
    h += '<th class="sticky-col">Conta</th>';
    cols.forEach(k => {
      const total = k==='__total__';
      h += `<th${total?' class="col-total-hdr"':''}>${colLabel(k)}</th>`;
    });
    const grandLbl = granMode==='ytdfy' ? 'FY' : 'Total';
    if(!cols.includes('__total__') && granMode !== 'anual')
      h += `<th class="col-total-hdr">${grandLbl}</th>`;
    h += '</tr>';
    head.innerHTML = h;
  } else {
    // Multi-cenario evolutivo: grouped per period
    const hasTotal = cols.includes('__total__');
    const grandLbl = granMode==='ytdfy' ? 'FY' : 'Total';
    let h1 = '<tr><th class="sticky-col" rowspan="2">Conta</th>';
    let h2 = '<tr>';
    cols.forEach(k => {
      const total = k==='__total__';
      h1 += `<th colspan="${cens.length}"${total?' class="col-total-hdr grp-hdr"':' class="grp-hdr"'}>${colLabel(k)}</th>`;
      cens.forEach(c => h2 += `<th style="font-size:10px;background:#252540">${shortCen(c)}</th>`);
    });
    if(!hasTotal && granMode !== 'anual'){
      const extra = cens.length + (cens.length===2 ? 2 : 0);
      h1 += `<th colspan="${extra}" class="col-total-hdr grp-hdr">${grandLbl}</th>`;
      cens.forEach(c => h2 += `<th class="col-total-hdr" style="font-size:10px">${shortCen(c)}</th>`);
      if(cens.length===2){
        h2 += '<th class="col-var-hdr" style="font-size:10px">Var</th>';
        h2 += '<th class="col-var-hdr" style="font-size:10px">Var%</th>';
      }
    }
    head.innerHTML = h1+'</tr>'+h2+'</tr>';
  }
}

// Sort map entries by a predefined order array
function sortedBy(map, orderArr) {
  const entries = [...map.entries()];
  if(!orderArr) return entries;
  return entries.sort((a, b) => {
    const ia = orderArr.indexOf(a[0]);
    const ib = orderArr.indexOf(b[0]);
    return (ia < 0 ? 9999 : ia) - (ib < 0 ? 9999 : ib);
  });
}

// ── Body ───────────────────────────────────────────────────
function renderBody(l1map, cols, cens) {
  const body = document.getElementById('pnlBody');
  const isTotal = viewMode === 'total';
  const isComp  = viewMode === 'comparacao';
  const multi   = cens.length >= 2;
  // No grand-total in annual view (year IS the total); always add in ytdfy (shows FY)
  const addGrand = !cols.includes('__total__') && !isTotal && !isComp
                   && granMode !== 'anual';

  // Feature 5: Extract TPV byCen for % TPV display
  let tpvByCen = null;
  if(displayMode === 'pct_tpv') {
    tpvByCen = l1map.get('Metrics')?.children?.get('TPV')?.byCen || null;
  }

  let html = '';

  function val(byCen, cen, col) {
    return (byCen.get(cen)?.get(col)) || 0;
  }
  function totalVal(byCen, cen) {
    const m = byCen.get(cen);
    if(!m) return 0;
    return cols.reduce((s,k) => s + (m.get(k)||0), 0);
  }

  // Feature 5: Format value as % TPV if applicable
  function fmtCell(v, cen, col, isMetrics) {
    if(displayMode === 'pct_tpv' && !isMetrics && tpvByCen) {
      const tpvVal = col === '__grand__'
        ? totalVal(tpvByCen, cen)
        : (tpvByCen.get(cen)?.get(col) || 0);
      if(tpvVal === 0) return '—';
      return (v / Math.abs(tpvVal) * 100).toFixed(2) + '%';
    }
    return fmt(v);
  }

  function cells(byCen, isMetrics) {
    let c = '';
    if(isComp) {
      // Comparação: delta-only cells (Ref minus each comparison baseline)
      // Values are keyed by colKey → each scenario's byCen holds the right column
      const cenRef  = getCenRef();
      // Helper: sum a colKey across all entries in byCen that have it
      const sumCol = (ck) => {
        let s = 0;
        for(const [, colMap] of byCen) s += (colMap.get(ck)||0);
        return s;
      };
      const refVal  = (byCen.get(cenRef)?.get('comp_ref'))      || sumCol('comp_ref');
      const planVal = (byCen.get('Plan')?.get('comp_plan'))      || sumCol('comp_plan');
      const fcstVal = (byCen.get('Forecast')?.get('comp_fcst'))  || sumCol('comp_fcst');
      const lmVal   = (byCen.get('Realizado')?.get('comp_lm'))   || sumCol('comp_lm');
      const lyVal   = (byCen.get('Realizado')?.get('comp_ly'))   || sumCol('comp_ly');

      // ── Reference value (highlighted) ──
      c += `<td class="col-total-cell bold ${refVal<0?'neg':''}" style="border-left:3px solid #4a7fc1">${fmt(refVal)}</td>`;
      // ── Separator ──
      c += `<td style="background:var(--border);padding:0;width:6px"></td>`;

      function deltaCell(d, base) {
        const cls = d >= 0 ? 'vpos' : 'vneg';
        const pct = base !== 0 ? (d / Math.abs(base) * 100) : null;
        c += `<td class="col-var-cell ${cls}">${fmt(d)}</td>`;
        c += `<td class="col-var-cell ${cls}">${pct != null ? pct.toFixed(1)+'%' : '—'}</td>`;
      }

      // Δ vs Plan
      deltaCell(refVal - planVal, planVal);
      // Δ vs Forecast (only when Forecast data exists globally)
      if(compHasFcst) deltaCell(refVal - fcstVal, fcstVal);
      // Δ vs Real LM
      deltaCell(refVal - lmVal, lmVal);
      // Δ vs Real LY
      deltaCell(refVal - lyVal, lyVal);
      return c;
    }
    if(isTotal) {
      const totals = cens.map(cen => totalVal(byCen, cen));
      totals.forEach((v, i) => c += `<td class="${v<0?'neg':''}">${fmtCell(v, cens[i], '__grand__', isMetrics)}</td>`);
      if(cens.length===2){
        const vv = totals[1]-totals[0];
        const vp = totals[0] ? (vv/Math.abs(totals[0])*100) : null;
        c += `<td class="col-var-cell ${vv>=0?'vpos':'vneg'}">${fmt(vv)}</td>`;
        c += `<td class="col-var-cell ${vv>=0?'vpos':'vneg'}">${vp!=null?vp.toFixed(1)+'%':'—'}</td>`;
      }
    } else if(!multi) {
      const cen = cens[0];
      cols.forEach(k => {
        const v = val(byCen, cen, k);
        c += `<td class="${k==='__total__'?'col-total-cell ':''} ${v<0?'neg':''}">${fmtCell(v, cen, k, isMetrics)}</td>`;
      });
      if(addGrand){
        const t = totalVal(byCen, cen);
        c += `<td class="col-total-cell bold ${t<0?'neg':''}">${fmtCell(t, cen, '__grand__', isMetrics)}</td>`;
      }
    } else {
      cols.forEach(k => {
        cens.forEach(cen => {
          const v = val(byCen, cen, k);
          c += `<td class="${k==='__total__'?'col-total-cell ':''} ${v<0?'neg':''}">${fmtCell(v, cen, k, isMetrics)}</td>`;
        });
      });
      if(addGrand){
        const tots = cens.map(cen => totalVal(byCen, cen));
        tots.forEach((v, i) => c += `<td class="col-total-cell bold ${v<0?'neg':''}">${fmtCell(v, cens[i], '__grand__', isMetrics)}</td>`);
        if(cens.length===2){
          const vv = tots[1]-tots[0];
          const vp = tots[0] ? (vv/Math.abs(tots[0])*100) : null;
          c += `<td class="col-var-cell ${vv>=0?'vpos':'vneg'}">${fmt(vv)}</td>`;
          c += `<td class="col-var-cell ${vv>=0?'vpos':'vneg'}">${vp!=null?vp.toFixed(1)+'%':'—'}</td>`;
        }
      }
    }
    return c;
  }

  // ── Row click: single = highlight toggle, double = chart ──
  function chartClickAttr(chartKey) {
    const k = escAttr(chartKey);
    return `onclick="handleRowClick(event,'${k}')" ondblclick="handleRowDblClick(event,'${k}')"`;
  }
  // Apply pre-existing highlight state to freshly rendered rows
  function applySelectionClass() {
    document.querySelectorAll('#pnlBody tr[data-rk]').forEach(tr => {
      tr.classList.toggle('row-selected', selectedRows.has(tr.dataset.rk));
    });
  }

  // ── P&L Waterfall rendering ────────────────────────────
  // MNG_1 = subtotal row (shown at BOTTOM of each P&L section)
  // MNG_2 = expandable component row
  // MNG_3 = detail row (shown when MNG_2 is expanded) - now expandable for L4
  // Exception: "Metrics" section uses MNG_1 as dark header (top)

  // Feature 7: cumulative P&L totals
  const cumByCen = new Map();

  for(const [k1, n1] of sortedBy(l1map, MNG1_ORDER)) {
    // Skip sections not selected in Seção P&L filter
    if(selSecao.length > 0 && !selSecao.includes(k1)) continue;
    const isMetrics = k1 === 'Metrics';

    // Gap row between sections
    html += `<tr class="pnl-gap"><td colspan="99"></td></tr>`;

    // Store in chartData
    const chartKey1 = k1;
    chartData.set(chartKey1, n1.byCen);

    if(isMetrics) {
      // Metrics: dark header at top, MNG_2 as flat rows below
      const open1 = expL1.has(k1);
      html += `<tr class="row-l1" data-k1="${escAttr(k1)}" data-rk="${escAttr(chartKey1)}" ${chartClickAttr(chartKey1)}>
        <td class="sticky-col">
          <span class="xbtn" onclick="toggleL1(event,this)">
            <span class="xarr${open1?' open':''}">▶</span>METRICS
          </span>
        </td>${cells(n1.byCen, true)}</tr>`;
      if(open1) {
        for(const [k2, n2] of sortedBy(n1.children, MNG2_ORDER[k1])) {
          const chartKey2 = k1+'|||'+k2;
          chartData.set(chartKey2, n2.byCen);
          html += `<tr class="row-l3" data-rk="${escAttr(chartKey2)}" ${chartClickAttr(chartKey2)}>
            <td class="sticky-col i2">${k2}</td>${cells(n2.byCen, true)}</tr>`;
        }
      }
    } else {
      // P&L section: MNG_2 rows first, MNG_1 cumulative subtotal at bottom
      for(const [k2, n2] of sortedBy(n1.children, MNG2_ORDER[k1])) {
        const l2k = k1+'|||'+k2;
        const open2 = expL2.has(l2k);
        const hasCh = n2.children.size > 0;
        const chartKey2 = l2k;
        chartData.set(chartKey2, n2.byCen);
        html += `<tr class="row-l2" data-l2k="${escAttr(l2k)}" data-rk="${escAttr(chartKey2)}" ${chartClickAttr(chartKey2)}>
          <td class="sticky-col i2">
            <span class="xbtn" onclick="toggleL2(event,this)">
              <span class="xarr${open2?' open':''}${hasCh?'':' invisible'}">▶</span>${k2}
            </span>
          </td>${cells(n2.byCen, false)}</tr>`;
        if(open2 && hasCh) {
          for(const [k3, n3] of n2.children) {
            const l3k = l2k+'|||'+k3;
            const open3 = expL3.has(l3k);
            const hasCh3 = n3.children && n3.children.size > 0;
            const chartKey3 = l3k;
            chartData.set(chartKey3, n3.byCen);
            html += `<tr class="row-l3" data-l3k="${escAttr(l3k)}" data-rk="${escAttr(chartKey3)}" ${chartClickAttr(chartKey3)}>
              <td class="sticky-col i3">
                <span class="xbtn" onclick="toggleL3(event,this)">
                  <span class="xarr${open3?' open':''}${hasCh3?'':' invisible'}">▶</span>${k3}
                </span>
              </td>${cells(n3.byCen, false)}</tr>`;
            // Feature 3: L4 rows (MNG_4)
            if(open3 && hasCh3) {
              for(const [k4, n4] of n3.children) {
                const chartKey4 = l3k+'|||'+k4;
                chartData.set(chartKey4, n4.byCen);
                html += `<tr class="row-l4" data-rk="${escAttr(chartKey4)}" ${chartClickAttr(chartKey4)}>
                  <td class="sticky-col i4">${k4}</td>${cells(n4.byCen, false)}</tr>`;
              }
            }
          }
        }
      }
      // Feature 7: Cumulative subtotal
      addByCen(cumByCen, n1.byCen);
      const chartKeyCum = '__cum__'+k1;
      const cumSnapshot = new Map();
      addByCen(cumSnapshot, cumByCen);
      chartData.set(chartKeyCum, cumSnapshot);
      html += `<tr class="row-subtotal" data-rk="${escAttr(chartKey1)}" ${chartClickAttr(chartKey1)}>
        <td class="sticky-col">${k1}</td>${cells(cumByCen, false)}</tr>`;
    }
  }

  if(!html.includes('<td') || !l1map.size)
    html = '<tr><td colspan="99" class="empty">Nenhum dado para os filtros selecionados.</td></tr>';
  body.innerHTML = html;
  applySelectionClass();
}

// ═══════════════════════════════════════════════════════════
//  HTML ATTRIBUTE ESCAPING  (fixes drill-down onclick bug)
// ═══════════════════════════════════════════════════════════
function escAttr(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function toggleL1(e, el) {
  e.stopPropagation();

function toggleL2(e, el) {

}
// Feature 3: L3 toggle for MNG_4
function toggleL3(e, el) {
