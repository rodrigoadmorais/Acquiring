//  COLUMN KEY
// ═══════════════════════════════════════════════════════════
// Auto-detect YTD cutoff: last month with Realizado/Actual data
function getAutoCutoff() {
  const actual = allData.filter(d =>
    d.Cenario==='Realizado' || d.Cenario==='Actual Sin Distribuir'
  ).map(d => d.MES);
  return actual.length ? Math.max(...actual) : null;
}

function colKey(row) {
  if(viewMode==='1x1') {
    const mesA = get1x1MesSet(comp1x1PeriodA, comp1x1Type);
    const mesB = get1x1MesSet(comp1x1PeriodB, comp1x1Type);
    if(mesA.has(row.MES) && row.Cenario === comp1x1CenA) return '1x1_a';
    if(mesB.has(row.MES) && row.Cenario === comp1x1CenB) return '1x1_b';
    return null;
  }
  if(viewMode==='total') return '__total__';
  if(viewMode==='comparacao') {
    const cenRef = getCenRef();
    const { curMeses, lyMeses, lmMeses } = getCompMesRange();
    const curSet = new Set(curMeses), lySet = new Set(lyMeses), lmSet = new Set(lmMeses);
    if(curSet.has(row.MES) && row.Cenario === cenRef)     return 'comp_ref';
    if(curSet.has(row.MES) && row.Cenario === 'Plan')     return 'comp_plan';
    if(curSet.has(row.MES) && row.Cenario === 'Forecast') return 'comp_fcst';
    if(lmSet.has(row.MES)  && row.Cenario === 'Realizado') return 'comp_lm';
    if(lySet.has(row.MES)  && row.Cenario === 'Realizado') return 'comp_ly';
    return null;
  }
  if(granMode==='mensal')     return String(row.MES);
  if(granMode==='trimestral') return (row.QUARTER||'Q?') + '/' + String(row.ANO).slice(2);
  if(granMode==='anual')      return String(row.ANO);
  if(granMode==='ytdfy') {
    const cut = cutoffMes || getAutoCutoff();
    if(!cut) return String(row.ANO);
    const cutY = Math.floor(cut/100);
    const cutM = cut % 100;
    if(row.ANO !== cutY) return 'fy_' + row.ANO;   // other years → FY
    return (row.MES % 100) <= cutM ? 'ytd' : 'ytg'; // current year → YTD or YTG
  }
  return '__total__';
}

function colLabel(k, refPeriods) {
  if(k==='comp_ref')  return getCompLabel ? getCompLabel() : 'Ref';
  if(k==='comp_plan') return 'Δ Plan';
  if(k==='comp_fcst') return 'Δ Fcst';
  if(k==='comp_lm')   return 'Δ LM';
  if(k==='comp_ly')   return 'Δ LY';
  if(k==='__total__') return granMode==='ytdfy' ? 'FY' : 'Total';
  if(k==='ytd') return 'YTD';
  if(k==='ytg') return 'YTG';
  if(/^fy_\d{4}$/.test(k)) return 'FY ' + k.slice(3);
  if(/^\d{6}$/.test(k)) return (MN[k.slice(4,6)]||k.slice(4,6)) + '/' + k.slice(2,4);
  return k;
}

function mesLabel(mes) {
  const mm = String(mes).slice(4,6);
  const yy = String(mes).slice(2,4);
  return (MN[mm]||mm) + '/' + yy;
}

function sortColKeys(arr) {
  function rank(k) {
    if(k==='1x1_a')           return 1;
    if(k==='1x1_b')           return 2;
    if(k==='comp_ref')        return 1;
    if(k==='comp_plan')       return 2;
    if(k==='comp_fcst')       return 3;
    if(k==='comp_lm')         return 4;
    if(k==='comp_ly')         return 5;
    if(k==='ytd')             return 1;
    if(k==='ytg')             return 2;
    if(k==='__total__')       return 99999998;
    if(/^fy_\d{4}$/.test(k)) return 99990000 + parseInt(k.slice(3));
    if(/^\d{6}$/.test(k))    return parseInt(k);
    if(/^Q\d\/\d{2}$/.test(k)){
      const [q,y] = k.split('/');
      return parseInt(y)*10 + parseInt(q[1]);
    }
    if(/^\d{4}$/.test(k))    return parseInt(k)*100;
    return 0;
  }
  return [...arr].sort((a,b) => rank(a)-rank(b));
}

// ═══════════════════════════════════════════════════════════
//  AGGREGATION
// ═══════════════════════════════════════════════════════════
function aggregate(data) {
  // result: Map<"l1|||l2|||l3|||l4", Map<cenario, Map<colKey, number>>>
  const rows = new Map();
  const colSet = new Set();

  for(const d of data) {
    const k1 = d.MNG_1 || '(s/ MNG_1)';
    const k2 = d.MNG_2 || '(s/ MNG_2)';
    const k3 = d.MNG_3 || '(s/ MNG_3)';
    const k4 = d.MNG_4 || '';
    const ck  = colKey(d);
    if(!ck) continue;
    const cen = d.Cenario;
    colSet.add(ck);
    const rowKey = k1+'|||'+k2+'|||'+k3+'|||'+k4;
    if(!rows.has(rowKey)) rows.set(rowKey, {k1,k2,k3,k4, byCen:new Map()});
    const byCen = rows.get(rowKey).byCen;
    if(!byCen.has(cen)) byCen.set(cen, new Map());
    const byCol = byCen.get(cen);
    byCol.set(ck, (byCol.get(ck)||0) + (d.Value||0));
  }

  // Build hierarchy: l1 -> l2 -> l3 -> l4
  const l1 = new Map();

  for(const [, row] of rows) {
    const {k1,k2,k3,k4,byCen} = row;
    if(!l1.has(k1)) l1.set(k1, {byCen:new Map(), children:new Map()});
    const n1 = l1.get(k1);
    addByCen(n1.byCen, byCen);

    if(!n1.children.has(k2)) n1.children.set(k2, {byCen:new Map(), children:new Map()});
    const n2 = n1.children.get(k2);
    addByCen(n2.byCen, byCen);

    if(!n2.children.has(k3)) n2.children.set(k3, {byCen:new Map(), children:new Map()});
    const n3 = n2.children.get(k3);
    addByCen(n3.byCen, byCen);

    // MNG_4 level
    if(k4) {
      if(!n3.children.has(k4)) n3.children.set(k4, {byCen:new Map()});
      const n4 = n3.children.get(k4);
      addByCen(n4.byCen, byCen);
    }
  }

  return { l1, cols: sortColKeys([...colSet]) };
}

function addByCen(target, src) {
  for(const [cen, colMap] of src) {
    if(!target.has(cen)) target.set(cen, new Map());
    const tgt = target.get(cen);
    for(const [col, val] of colMap) {
      tgt.set(col, (tgt.get(col)||0) + val);
    }
  }
}

function render() {
  const data = getFiltered();
  const {l1, cols} = aggregate(data);
  const cens = selCen.filter(c => optCen.includes(c));

  // Compute whether Forecast data exists for the ref month (for comparação mode)
  if(viewMode === 'comparacao') {
    const ref = getMesRef();
    compHasFcst = allData.some(d =>
      d.MES === ref && d.Cenario === 'Forecast' &&
      (selMacro.length===0 || selMacro.includes(d.Macro_BU)) &&
      (selProd.length===0  || selProd.includes(d.Product))
    );
  }

  // Reset chart data store
  chartData = new Map();

  renderHead(cols, cens);
  renderBody(l1,   cols, cens);
  requestAnimationFrame(updateStickyTop);
}

// ── Feature 4: Sticky header row stacking ────────────────────
// Since tbl-wrap is now the scroll container, top:0 = top of tbl-wrap.
// For multi-row headers (evolutivo multi-cenario), row 2 must be offset
// by row 1's height so they stack correctly without overlap.
function updateStickyTop() {
  const rows = document.querySelectorAll('#pnlTable thead tr');
  let offset = 0;
  rows.forEach(row => {
    row.querySelectorAll('th').forEach(th => { th.style.top = offset + 'px'; });
    offset += row.getBoundingClientRect().height || 34;
  });
}
window.addEventListener('resize', () => requestAnimationFrame(updateStickyTop));

// ── Head ───────────────────────────────────────────────────
function renderHead(cols, cens) {
  const head = document.getElementById('pnlHead');
  const isTotal = viewMode === 'total';
  const isComp  = viewMode === 'comparacao';
  const is1x1   = viewMode === '1x1';
  const multi   = cens.length >= 2;

  if(is1x1) {
    const lA = format1x1PeriodLabel(comp1x1PeriodA, comp1x1Type);
    const lB = format1x1PeriodLabel(comp1x1PeriodB, comp1x1Type);
    const cA = shortCen(comp1x1CenA || '');
    const cB = shortCen(comp1x1CenB || '');
    let h = `<tr>`;
    h += `<th class="sticky-col">Conta</th>`;
    h += `<th class="col-total-hdr" style="border-left:3px solid #1a1a1a;min-width:110px">${lA}<br><span style="font-size:10px;font-weight:400">${cA}</span></th>`;
    h += `<th class="col-total-hdr" style="border-left:3px solid #4a7fc1;min-width:110px">${lB}<br><span style="font-size:10px;font-weight:400">${cB}</span></th>`;
    h += `<th class="col-var-hdr">Δ (B−A)</th>`;
    h += `<th class="col-var-hdr">Δ%</th>`;
    h += `</tr>`;
    head.innerHTML = h;
    return;
  }

  if(isComp) {
    // Comparação: reference value (highlighted) + delta columns
    const ref    = getMesRef();
    const cenRef = getCenRef();
    const { ly, lm } = getCompPeriods(ref);
    const refLbl = mesLabel(ref);
    const lmLbl  = lm ? mesLabel(lm) : 'LM';
    const lyLbl  = ly ? mesLabel(ly) : 'LY';
    const refInfo = `${refLbl} · ${shortCen(cenRef)}`;
    let h = `<tr>`;
    h += `<th class="sticky-col">Conta</th>`;
    // ── Reference value column (highlighted) ──
    h += `<th class="col-total-hdr" style="border-left:3px solid #1a1a1a;min-width:100px">${shortCen(cenRef)}<br><span style="font-size:10px;font-weight:400">${refLbl}</span></th>`;
    // ── Separator ──
    h += `<th style="background:var(--bg);width:6px;padding:0;border:none"></th>`;
    // Δ vs Plan
    h += `<th class="col-var-hdr">Δ vs Plan<br><span style="font-size:10px;font-weight:400">${refLbl}</span></th>`;
    h += `<th class="col-var-hdr" style="font-size:10px">%</th>`;
    // Δ vs Forecast (only when data exists)
    if(compHasFcst) {
      h += `<th class="col-var-hdr">Δ vs Fcst<br><span style="font-size:10px;font-weight:400">${refLbl}</span></th>`;
      h += `<th class="col-var-hdr" style="font-size:10px">%</th>`;
    }
    // Δ vs Real LM
    h += `<th class="col-var-hdr">Δ vs Real LM<br><span style="font-size:10px;font-weight:400">${lmLbl}</span></th>`;
    h += `<th class="col-var-hdr" style="font-size:10px">%</th>`;
    // Δ vs Real LY
    h += `<th class="col-var-hdr">Δ vs Real LY<br><span style="font-size:10px;font-weight:400">${lyLbl}</span></th>`;
    h += `<th class="col-var-hdr" style="font-size:10px">%</th>`;
    h += `</tr>`;
    head.innerHTML = h;
    return;
  }

  if(isTotal) {
    // Columns = one per cenario + var (if 2 scenarios)
    let h = '<tr>';
    h += '<th class="sticky-col">Conta</th>';
    cens.forEach(c => h += `<th>${shortCen(c)}</th>`);
    if(cens.length===2){
      h += '<th class="col-var-hdr">Var</th>';
      h += '<th class="col-var-hdr">Var %</th>';
    }
    h += '</tr>';
    head.innerHTML = h;
  } else if(!multi) {
    // Simple evolutivo: one col per period
    let h = '<tr>';
    h += '<th class="sticky-col">Conta</th>';
    cols.forEach(k => {
      const total = k==='__total__';
      h += `<th${total?' class="col-total-hdr"':''}>${colLabel(k)}</th>`;
    });
    const grandLbl = granMode==='ytdfy' ? 'FY' : 'Total';
    if(!cols.includes('__total__') && granMode !== 'anual')
      h += `<th class="col-total-hdr">${grandLbl}</th>`;
    h += '</tr>';
    head.innerHTML = h;
  } else {
    // Multi-cenario evolutivo: grouped per period
    const hasTotal = cols.includes('__total__');
    const grandLbl = granMode==='ytdfy' ? 'FY' : 'Total';
    let h1 = '<tr><th class="sticky-col" rowspan="2">Conta</th>';
    let h2 = '<tr>';
    cols.forEach(k => {
      const total = k==='__total__';
      h1 += `<th colspan="${cens.length}"${total?' class="col-total-hdr grp-hdr"':' class="grp-hdr"'}>${colLabel(k)}</th>`;
      cens.forEach(c => h2 += `<th style="font-size:10px;background:#E8D000;color:#1a1a1a">${shortCen(c)}</th>`);
    });
    if(!hasTotal && granMode !== 'anual'){
      const extra = cens.length + (cens.length===2 ? 2 : 0);
      h1 += `<th colspan="${extra}" class="col-total-hdr grp-hdr">${grandLbl}</th>`;
      cens.forEach(c => h2 += `<th class="col-total-hdr" style="font-size:10px">${shortCen(c)}</th>`);
      if(cens.length===2){
        h2 += '<th class="col-var-hdr" style="font-size:10px">Var</th>';
        h2 += '<th class="col-var-hdr" style="font-size:10px">Var%</th>';
      }
    }
    head.innerHTML = h1+'</tr>'+h2+'</tr>';
  }
}

// Sort map entries by a predefined order array
function sortedBy(map, orderArr) {
  const entries = [...map.entries()];
  if(!orderArr) return entries;
  return entries.sort((a, b) => {
    const ia = orderArr.indexOf(a[0]);
    const ib = orderArr.indexOf(b[0]);
    return (ia < 0 ? 9999 : ia) - (ib < 0 ? 9999 : ib);
  });
}

// ── Body ───────────────────────────────────────────────────
function renderBody(l1map, cols, cens) {
  const body = document.getElementById('pnlBody');
  const isTotal = viewMode === 'total';
  const isComp  = viewMode === 'comparacao';
  const is1x1   = viewMode === '1x1';
  const multi   = cens.length >= 2;
  // No grand-total in annual view (year IS the total); always add in ytdfy (shows FY)
  const addGrand = !cols.includes('__total__') && !isTotal && !isComp && !is1x1
                   && granMode !== 'anual';

  // Feature 5: Extract TPV / NMV byCen for % display
  let tpvByCen = null;
  let nmvByCen = null;
  if(displayMode === 'pct_tpv') tpvByCen = l1map.get('Metrics')?.children?.get('TPV')?.byCen || null;
  if(displayMode === 'pct_nmv') nmvByCen = l1map.get('Metrics')?.children?.get('NMV')?.byCen || null;

  let html = '';

  function val(byCen, cen, col) {
    return (byCen.get(cen)?.get(col)) || 0;
  }
  function totalVal(byCen, cen) {
    const m = byCen.get(cen);
    if(!m) return 0;
    return cols.reduce((s,k) => s + (m.get(k)||0), 0);
  }

  // Feature 5: Format value as % TPV or % NMV if applicable
  function fmtCell(v, cen, col, isMetrics) {
    if(!isMetrics) {
      const refByCen = displayMode === 'pct_tpv' ? tpvByCen
                     : displayMode === 'pct_nmv'  ? nmvByCen : null;
      if(refByCen) {
        const refVal = col === '__grand__' ? totalVal(refByCen, cen)
                                           : (refByCen.get(cen)?.get(col) || 0);
        if(refVal === 0) return '—';
        return (v / Math.abs(refVal) * 100).toFixed(2) + '%';
      }
    }
    return fmt(v);
  }

  function cells(byCen, isMetrics) {
    let c = '';
    if(is1x1) {
      // 1×1: Period A value | Period B value | Δ (B−A) | Δ%
      // byCen keyed by cenario; each cenario map has colKey '1x1_a' or '1x1_b'
      const aVal  = (byCen.get(comp1x1CenA)?.get('1x1_a')) || 0;
      const bVal  = (byCen.get(comp1x1CenB)?.get('1x1_b')) || 0;
      const delta = bVal - aVal;
      const pct   = aVal !== 0 ? (delta / Math.abs(aVal) * 100) : null;
      c += `<td class="col-total-cell ${aVal<0?'neg':''}" style="border-left:3px solid #1a1a1a">${fmtCell(aVal, comp1x1CenA, '1x1_a', isMetrics)}</td>`;
      c += `<td class="col-total-cell ${bVal<0?'neg':''}" style="border-left:3px solid #4a7fc1">${fmtCell(bVal, comp1x1CenB, '1x1_b', isMetrics)}</td>`;
      c += `<td class="col-var-cell ${delta>=0?'vpos':'vneg'}">${fmt(delta)}</td>`;
      c += `<td class="col-var-cell ${delta>=0?'vpos':'vneg'}">${pct!=null?pct.toFixed(2)+'%':'—'}</td>`;
      return c;
    }
    if(isComp) {
      // Comparação: delta-only cells (Ref minus each comparison baseline)
      // Values are keyed by colKey → each scenario's byCen holds the right column
      const cenRef  = getCenRef();
      // Helper: sum a colKey across all entries in byCen that have it
      const sumCol = (ck) => {
        let s = 0;
        for(const [, colMap] of byCen) s += (colMap.get(ck)||0);
        return s;
      };
      const refVal  = (byCen.get(cenRef)?.get('comp_ref'))      || sumCol('comp_ref');
      const planVal = (byCen.get('Plan')?.get('comp_plan'))      || sumCol('comp_plan');
      const fcstVal = (byCen.get('Forecast')?.get('comp_fcst'))  || sumCol('comp_fcst');
      const lmVal   = (byCen.get('Realizado')?.get('comp_lm'))   || sumCol('comp_lm');
      const lyVal   = (byCen.get('Realizado')?.get('comp_ly'))   || sumCol('comp_ly');

      // ── Reference value (highlighted) ──
      c += `<td class="col-total-cell bold ${refVal<0?'neg':''}" style="border-left:3px solid #4a7fc1">${fmt(refVal)}</td>`;
      // ── Separator ──
      c += `<td style="background:var(--border);padding:0;width:6px"></td>`;

      function deltaCell(d, base) {
        const cls = d >= 0 ? 'vpos' : 'vneg';
        const pct = base !== 0 ? (d / Math.abs(base) * 100) : null;
        c += `<td class="col-var-cell ${cls}">${fmt(d)}</td>`;
        c += `<td class="col-var-cell ${cls}">${pct != null ? pct.toFixed(2)+'%' : '—'}</td>`;
      }

      // Δ vs Plan
      deltaCell(refVal - planVal, planVal);
      // Δ vs Forecast (only when Forecast data exists globally)
      if(compHasFcst) deltaCell(refVal - fcstVal, fcstVal);
      // Δ vs Real LM
      deltaCell(refVal - lmVal, lmVal);
      // Δ vs Real LY
      deltaCell(refVal - lyVal, lyVal);
      return c;
    }
    if(isTotal) {
      const totals = cens.map(cen => totalVal(byCen, cen));
      totals.forEach((v, i) => c += `<td class="${v<0?'neg':''}">${fmtCell(v, cens[i], '__grand__', isMetrics)}</td>`);
      if(cens.length===2){
        const vv = totals[1]-totals[0];
        const vp = totals[0] ? (vv/Math.abs(totals[0])*100) : null;
        c += `<td class="col-var-cell ${vv>=0?'vpos':'vneg'}">${fmt(vv)}</td>`;
        c += `<td class="col-var-cell ${vv>=0?'vpos':'vneg'}">${vp!=null?vp.toFixed(2)+'%':'—'}</td>`;
      }
    } else if(!multi) {
      const cen = cens[0];
      cols.forEach(k => {
        const v = val(byCen, cen, k);
        c += `<td class="${k==='__total__'?'col-total-cell ':''} ${v<0?'neg':''}">${fmtCell(v, cen, k, isMetrics)}</td>`;
      });
      if(addGrand){
        const t = totalVal(byCen, cen);
        c += `<td class="col-total-cell bold ${t<0?'neg':''}">${fmtCell(t, cen, '__grand__', isMetrics)}</td>`;
      }
    } else {
      cols.forEach(k => {
        cens.forEach(cen => {
          const v = val(byCen, cen, k);
          c += `<td class="${k==='__total__'?'col-total-cell ':''} ${v<0?'neg':''}">${fmtCell(v, cen, k, isMetrics)}</td>`;
        });
      });
      if(addGrand){
        const tots = cens.map(cen => totalVal(byCen, cen));
        tots.forEach((v, i) => c += `<td class="col-total-cell bold ${v<0?'neg':''}">${fmtCell(v, cens[i], '__grand__', isMetrics)}</td>`);
        if(cens.length===2){
          const vv = tots[1]-tots[0];
          const vp = tots[0] ? (vv/Math.abs(tots[0])*100) : null;
          c += `<td class="col-var-cell ${vv>=0?'vpos':'vneg'}">${fmt(vv)}</td>`;
          c += `<td class="col-var-cell ${vv>=0?'vpos':'vneg'}">${vp!=null?vp.toFixed(2)+'%':'—'}</td>`;
        }
      }
    }
    return c;
  }

  // ── Row click: single = highlight toggle, double = chart ──
  function chartClickAttr(chartKey) {
    const k = escAttr(chartKey);
    return `onclick="handleRowClick(event,'${k}')" ondblclick="handleRowDblClick(event,'${k}')"`;
  }
  // Apply pre-existing highlight state to freshly rendered rows
  function applySelectionClass() {
    document.querySelectorAll('#pnlBody tr[data-rk]').forEach(tr => {
      tr.classList.toggle('row-selected', selectedRows.has(tr.dataset.rk));
    });
  }

  // ── P&L Waterfall rendering ────────────────────────────
  // MNG_1 = subtotal row (shown at BOTTOM of each P&L section)
  // MNG_2 = expandable component row
  // MNG_3 = detail row (shown when MNG_2 is expanded) - now expandable for L4
  // Exception: "Metrics" section uses MNG_1 as dark header (top)

  // Feature 7: cumulative P&L totals
  const cumByCen = new Map();

  for(const [k1, n1] of sortedBy(l1map, MNG1_ORDER)) {
    // Skip sections not selected in Seção P&L filter
    if(selSecao.length > 0 && !selSecao.includes(k1)) continue;
    const isMetrics = k1 === 'Metrics';

    // Gap row between sections
    html += `<tr class="pnl-gap"><td colspan="99"></td></tr>`;

    // Store in chartData
    const chartKey1 = k1;
    chartData.set(chartKey1, n1.byCen);

    if(isMetrics) {
      // Metrics: dark header at top, MNG_2 as flat rows below
      const open1 = expL1.has(k1);
      html += `<tr class="row-l1" data-k1="${escAttr(k1)}" data-rk="${escAttr(chartKey1)}" ${chartClickAttr(chartKey1)}>
        <td class="sticky-col">
          <span class="xbtn" onclick="toggleL1(event,this)">
            <span class="xarr${open1?' open':''}">▶</span>METRICS
          </span>
        </td>${cells(n1.byCen, true)}</tr>`;
      if(open1) {
        for(const [k2, n2] of sortedBy(n1.children, MNG2_ORDER[k1])) {
          const chartKey2 = k1+'|||'+k2;
          chartData.set(chartKey2, n2.byCen);
          html += `<tr class="row-l3" data-rk="${escAttr(chartKey2)}" ${chartClickAttr(chartKey2)}>
            <td class="sticky-col i2">${k2}</td>${cells(n2.byCen, true)}</tr>`;
          // YoY Growth row for TPV and NMV
          if((k2 === 'TPV' || k2 === 'NMV') && !isComp && !isTotal && !is1x1) {
            const yoyMap = computeYoYMap(k2, cols);
            html += `<tr class="row-yoy">
              <td class="sticky-col i3">↳ YoY Realizado</td>
              ${yoyCells(yoyMap, cols, cens, addGrand)}</tr>`;
          }
        }
      }
    } else {
      // P&L section: MNG_2 rows first, MNG_1 cumulative subtotal at bottom
      for(const [k2, n2] of sortedBy(n1.children, MNG2_ORDER[k1])) {
        const l2k = k1+'|||'+k2;
        const open2 = expL2.has(l2k);
        const hasCh = n2.children.size > 0;
        const chartKey2 = l2k;
        chartData.set(chartKey2, n2.byCen);
        html += `<tr class="row-l2" data-l2k="${escAttr(l2k)}" data-rk="${escAttr(chartKey2)}" ${chartClickAttr(chartKey2)}>
          <td class="sticky-col i2">
            <span class="xbtn" onclick="toggleL2(event,this)">
              <span class="xarr${open2?' open':''}${hasCh?'':' invisible'}">▶</span>${k2}
            </span>
          </td>${cells(n2.byCen, false)}</tr>`;
        if(open2 && hasCh) {
          for(const [k3, n3] of n2.children) {
            const l3k = l2k+'|||'+k3;
            const open3 = expL3.has(l3k);
            const hasCh3 = n3.children && n3.children.size > 0;
            const chartKey3 = l3k;
            chartData.set(chartKey3, n3.byCen);
            html += `<tr class="row-l3" data-l3k="${escAttr(l3k)}" data-rk="${escAttr(chartKey3)}" ${chartClickAttr(chartKey3)}>
              <td class="sticky-col i3">
                <span class="xbtn" onclick="toggleL3(event,this)">
                  <span class="xarr${open3?' open':''}${hasCh3?'':' invisible'}">▶</span>${k3}
                </span>
              </td>${cells(n3.byCen, false)}</tr>`;
            // Feature 3: L4 rows (MNG_4)
            if(open3 && hasCh3) {
              for(const [k4, n4] of n3.children) {
                const chartKey4 = l3k+'|||'+k4;
                chartData.set(chartKey4, n4.byCen);
                html += `<tr class="row-l4" data-rk="${escAttr(chartKey4)}" ${chartClickAttr(chartKey4)}>
                  <td class="sticky-col i4">${k4}</td>${cells(n4.byCen, false)}</tr>`;
              }
            }
          }
        }
      }
      // Feature 7: Cumulative subtotal
      addByCen(cumByCen, n1.byCen);
      const chartKeyCum = '__cum__'+k1;
      const cumSnapshot = new Map();
      addByCen(cumSnapshot, cumByCen);
      chartData.set(chartKeyCum, cumSnapshot);
      html += `<tr class="row-subtotal" data-rk="${escAttr(chartKey1)}" ${chartClickAttr(chartKey1)}>
        <td class="sticky-col">${k1}</td>${cells(cumByCen, false)}</tr>`;

      // ── Take Rate row (after Net Monetization, Acquiring-only) ──
      if(k1 === 'Net Monetization') {
        const acqOnly = selMacro.length > 0 && selMacro.every(m => m === 'Acquiring');
        if(acqOnly) {
          const cfByCen = l1map.get('Variable Contribution')?.children?.get('Collection Fees')?.byCen || new Map();
          const trByCen = new Map();
          addByCen(trByCen, cumByCen); // PM + NM accumulated so far
          addByCen(trByCen, cfByCen); // + Collection Fees
          chartData.set('__takerate__', trByCen);
          html += `<tr class="row-takerate" data-rk="__takerate__" ${chartClickAttr('__takerate__')}>
            <td class="sticky-col">Take Rate</td>${cells(trByCen, false)}</tr>`;
        }
      }
    }
  }

  if(!html.includes('<td') || !l1map.size)
    html = '<tr><td colspan="99" class="empty">Nenhum dado para os filtros selecionados.</td></tr>';
  body.innerHTML = html;
  applySelectionClass();
}

// ═══════════════════════════════════════════════════════════
//  YoY GROWTH  — computes Realizado YoY% per column key
// ═══════════════════════════════════════════════════════════
function computeYoYMap(metricKey, cols) {
  // Returns Map<colKey, pct_or_null>
  // Queries allData Realizado regardless of year filter so prior-year is always available
  const realByMes = new Map();
  for(const d of allData) {
    if(d.Cenario !== 'Realizado') continue;
    if(d.MNG_1   !== 'Metrics')  continue;
    if(d.MNG_2   !== metricKey)  continue;
    if(selMacro.length>0 && !selMacro.includes(d.Macro_BU)) continue;
    if(selProd.length>0  && !selProd.includes(d.Product))   continue;
    const mes = d.MES;
    realByMes.set(mes, (realByMes.get(mes)||0) + (d.Value||0));
  }
  const result = new Map();
  for(const col of cols) {
    let cur = 0, py = 0;
    if(/^\d{6}$/.test(col)) {
      const m   = parseInt(col);
      // No Realizado for this month → nothing to compare
      if(!realByMes.has(m)) { result.set(col, null); continue; }
      const yr  = Math.floor(m/100);
      const mon = m % 100;
      cur = realByMes.get(m)||0;
      py  = realByMes.get((yr-1)*100+mon)||0;
    } else if(/^Q\d\/\d{2}$/.test(col)) {
      const qn   = parseInt(col[1]);
      const yr   = 2000 + parseInt(col.slice(3));
      const pyYr = yr - 1;
      const start = (qn-1)*3+1;
      // Only compare months that have Realizado data in the current year
      for(let mi=0; mi<3; mi++) {
        const m = start+mi;
        if(realByMes.has(yr*100+m)) {
          cur += realByMes.get(yr  *100+m)||0;
          py  += realByMes.get(pyYr*100+m)||0;
        }
      }
    } else if(/^\d{4}$/.test(col)) {
      const yr   = parseInt(col);
      const pyYr = yr - 1;
      // Only compare months with Realizado data in current year (avoids partial-year distortion)
      for(let m=1; m<=12; m++) {
        if(realByMes.has(yr*100+m)) {
          cur += realByMes.get(yr  *100+m)||0;
          py  += realByMes.get(pyYr*100+m)||0;
        }
      }
    } else if(col === 'ytd') {
      const cut = cutoffMes || getAutoCutoff();
      if(cut) {
        const cutYr = Math.floor(cut/100);
        const cutMn = cut % 100;
        const pyYr  = cutYr - 1;
        for(let m=1; m<=cutMn; m++) {
          cur += realByMes.get(cutYr*100+m)||0;
          py  += realByMes.get(pyYr *100+m)||0;
        }
      }
    } else {
      result.set(col, null);
      continue;
    }
    result.set(col, py !== 0 ? (cur-py)/Math.abs(py)*100 : null);
  }
  return result;
}

function yoyCells(yoyMap, cols, cens, addGrand) {
  let c = '';
  const multi   = cens.length >= 2;

  function yoyTd(pct, colSpan) {
    const sp = colSpan > 1 ? ` colspan="${colSpan}"` : '';
    if(pct == null)
      return `<td${sp} style="text-align:center;color:var(--muted);font-style:italic">—</td>`;
    const cls  = pct >= 0 ? 'vpos' : 'vneg';
    const sign = pct >= 0 ? '+' : '';
    return `<td${sp} class="${cls}" style="text-align:center;font-style:italic">${sign}${pct.toFixed(2)}%</td>`;
  }

  if(!multi) {
    cols.forEach(col => { c += yoyTd(yoyMap.get(col)??null, 1); });
    if(addGrand) c += yoyTd(null, 1);
  } else {
    cols.forEach(col => { c += yoyTd(yoyMap.get(col)??null, cens.length); });
    if(addGrand) {
      c += yoyTd(null, cens.length);
      if(cens.length === 2) c += `<td></td><td></td>`;
    }
  }
  return c;
}

// ═══════════════════════════════════════════════════════════
//  HTML ATTRIBUTE ESCAPING  (fixes drill-down onclick bug)
// ═══════════════════════════════════════════════════════════
function escAttr(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function toggleL3(e, el) {

}

// ═══════════════════════════════════════════════════════════
//  FEATURE 6: CHART ON CLICK
// ═══════════════════════════════════════════════════════════
function handleRowClick(e, chartKey) {
  // Don't fire if clicking the expand arrow
  if(e.target.closest('.xbtn')) return;
  // Single click = toggle row highlight
  const tr = e.currentTarget || e.target.closest('tr');
  if(!tr) return;
  const rk = tr.dataset.rk || chartKey;
  if(selectedRows.has(rk)) {
    selectedRows.delete(rk);
    tr.classList.remove('row-selected');
  } else {
    selectedRows.add(rk);
    tr.classList.add('row-selected');
  }
  updateSelectionBar();
}

function updateSelectionBar() {
  const bar = document.getElementById('selectionBar');
  if(!bar) return;
  if(selectedRows.size === 0) { bar.style.display = 'none'; return; }
  bar.style.display = '';

  // Build name chips
  const chipsDiv = document.getElementById('selChips');
  if(chipsDiv) {
    chipsDiv.innerHTML = '';
    for(const rk of selectedRows) {
      const parts = rk.replace(/^__cum__/,'').split('|||');
      const name  = parts[parts.length-1];
      const chip  = document.createElement('span');
      chip.className   = 'sel-chip';
      chip.textContent = name;
      chipsDiv.appendChild(chip);
    }
  }

  // Aggregate sums per scenario
  const sumsDiv = document.getElementById('selSums');
  if(sumsDiv) {
    sumsDiv.innerHTML = '';
    const sumByCen = new Map();
    for(const rk of selectedRows) {
      const byCen = chartData.get(rk);
      if(!byCen) continue;
      for(const [cen, colMap] of byCen) {
        let s = 0;
        for(const [, v] of colMap) s += v;
        sumByCen.set(cen, (sumByCen.get(cen)||0) + s);
      }
    }
    const displayedCens = selCen.filter(c => sumByCen.has(c));
    for(const cen of displayedCens) {
      const v    = sumByCen.get(cen)||0;
      const item = document.createElement('div');
      item.className = 'sel-sum-item';
      const cls = v < 0 ? ' class="vneg"' : '';
      item.innerHTML  =
        `<span class="sel-sum-cen">${shortCen(cen)}</span>` +
        `<span class="sel-sum-val"${cls}>${fmt(v)}</span>`;
      sumsDiv.appendChild(item);
    }
  }
}

function clearSelection() {
  selectedRows.clear();
  document.querySelectorAll('#pnlBody tr.row-selected')
    .forEach(tr => tr.classList.remove('row-selected'));
  const bar = document.getElementById('selectionBar');
  if(bar) bar.style.display = 'none';
}

function handleRowDblClick(e, chartKey) {
  // Don't fire if clicking the expand arrow
  if(e.target.closest('.xbtn')) return;
  e.preventDefault();
  const byCen = chartData.get(chartKey);
  if(!byCen) return;
  const parts = chartKey.split('|||');
  const label = parts[parts.length-1].replace(/^__cum__/,'');
  showChart(label, byCen);
}

function showChart(rowLabel, byCen) {
  const isDark    = document.documentElement.dataset.theme === 'dark';
  const gridColor = isDark ? 'rgba(255,255,255,.1)' : 'rgba(0,0,0,.08)';
  const textColor = isDark ? '#c8d4e8' : '#333';

  const palette = [
    'rgba(21,101,192,0.85)',
    'rgba(2,136,209,0.85)',
    'rgba(0,188,212,0.85)',
    'rgba(0,150,136,0.85)',
    'rgba(56,142,60,0.85)',
    'rgba(123,31,162,0.85)',
  ];

  let labels, datasets;

  if(viewMode === 'comparacao') {
    // ── Comparação chart: absolute values per benchmark (ref + baselines) ──
    const cenRef = getCenRef();
    const ref    = getMesRef();
    const { ly, lm } = getCompPeriods(ref);

    const sumCol = (ck) => {
      let s = 0;
      for(const [, colMap] of byCen) s += (colMap.get(ck)||0);
      return s;
    };
    const refVal  = byCen.get(cenRef)?.get('comp_ref')      ?? sumCol('comp_ref');
    const planVal = byCen.get('Plan')?.get('comp_plan')      ?? sumCol('comp_plan');
    const lmVal   = byCen.get('Realizado')?.get('comp_lm')   ?? sumCol('comp_lm');
    const lyVal   = byCen.get('Realizado')?.get('comp_ly')   ?? sumCol('comp_ly');
    const fcstVal = compHasFcst
      ? (byCen.get('Forecast')?.get('comp_fcst') ?? sumCol('comp_fcst'))
      : null;

    // Build series in desired order: Ref | Plan | Fcst? | Real LM | Real LY
    const series = [
      { label: `${shortCen(cenRef)} ${mesLabel(ref)}`, val: refVal,  color: 'rgba(21,101,192,0.9)'  },
      { label: `Plan ${mesLabel(ref)}`,                 val: planVal, color: 'rgba(2,136,209,0.75)'  },
      ...(compHasFcst ? [{ label: `Fcst ${mesLabel(ref)}`, val: fcstVal, color: 'rgba(0,150,136,0.75)' }] : []),
      { label: `Real ${mesLabel(lm)}`,                  val: lmVal,   color: 'rgba(123,31,162,0.75)' },
      { label: `Real ${mesLabel(ly)}`,                  val: lyVal,   color: 'rgba(198,40,40,0.65)'  },
    ];

    labels   = series.map(s => s.label);
    datasets = [{
      label: rowLabel,
      data:  series.map(s => s.val / unitDiv),
      backgroundColor: series.map(s => s.color),
      borderRadius: 4,
    }];

  } else {
    // ── Evolutivo / Total chart: one dataset per scenario ──
    const cens = selCen.filter(c => optCen.includes(c));
    const { cols } = aggregate(getFiltered());
    const displayCols = cols.length > 0 ? cols : [];
    labels   = displayCols.map(k => colLabel(k));
    datasets = cens.map((cen, i) => {
      const cenMap = byCen.get(cen);
      const vals = displayCols.map(k => {
        if(!cenMap) return 0;
        if(k === '__total__') return [...cenMap.values()].reduce((s,v)=>s+v, 0) / unitDiv;
        return (cenMap.get(k) || 0) / unitDiv;
      });
      return { label: shortCen(cen), data: vals,
               backgroundColor: palette[i % palette.length], borderRadius: 4 };
    });
  }

  if(chartInstance) { chartInstance.destroy(); chartInstance = null; }

  document.getElementById('chartTitle').textContent = rowLabel;
  document.getElementById('chartModal').classList.add('open');

  const ctx = document.getElementById('chartCanvas').getContext('2d');
  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets },
    options: {
      responsive: true,
      plugins: {
        legend: { labels: { color: textColor, font: { size: 11 } } },
        tooltip: {
          callbacks: {
            label: c => `${c.dataset.label}: ${c.parsed.y != null
              ? c.parsed.y.toLocaleString('pt-BR', {minimumFractionDigits:1,maximumFractionDigits:1})
              : '—'}`
          }
        }
      },
      scales: {
        x: { ticks: { color: textColor, font:{size:10} }, grid: { color: gridColor } },
        y: { ticks: { color: textColor, font:{size:10} }, grid: { color: gridColor } }
      }
    }
  });
}

function closeChart() {
  document.getElementById('chartModal').classList.remove('open');
  if(chartInstance) { chartInstance.destroy(); chartInstance = null; }
}

function closeChartOnOverlay(e) {
  if(e.target === document.getElementById('chartModal')) closeChart();
}

// ═══════════════════════════════════════════════════════════
//  FORMAT NUMBER
// ═══════════════════════════════════════════════════════════
function fmt(v) {
  if(v===0 || v==null) return '—';
  const neg = v < 0;
  const abs = Math.abs(v) / unitDiv;
  const dec = unitDiv >= 1_000_000 ? 1 : 0;
  const str = abs.toLocaleString('pt-BR',
    {minimumFractionDigits:dec, maximumFractionDigits:dec});
  return neg ? `(${str})` : str;
}

    allData
      .filter(d => d.MNG_2 === 'Customer Acquisition Cost' && d.Cenario === 'Realizado')
      .map(d => d.MES)
  )].sort((a,b) => a-b);

  ['cpaMesSel','mposMesSel','mposLightMesSel'].forEach(id => {

  });

// ── Populate Macro BU selects for CPA/MPOS/Light tabs ────
function populateMacroBUSelects() {
  const vals = ['', ...([...new Set(allData.map(d => d.Macro_BU).filter(Boolean))].sort())];
  const selCfg = [
    { id:'cpaMacroBUSel',       current:()=>cpaMacroBU },
    { id:'mposMacroBUSel',      current:()=>mposMacroBU },
    { id:'mposLightMacroBUSel', current:()=>mposLightMacroBU },
  ];
  selCfg.forEach(({id, current}) => {
    const sel = document.getElementById(id);
    if(!sel) return;
    sel.innerHTML = vals.map(v =>
      `<option value="${v}" ${v===current()?'selected':''}>${v||'Todos'}</option>`
    ).join('');
  });
}

function mbuFmt(v) {
  if(v == null) return '—';
  const scaled = v / mbuUnitDiv;
  const dec = mbuUnitDiv >= 1000 ? 1 : 0;
  return scaled.toLocaleString('pt-BR',{minimumFractionDigits:dec,maximumFractionDigits:dec});
}
function mbuPct(v, base) {
  if(!base || base === 0) return null;
  return v / Math.abs(base) * 100;
}

function buildMbuFilters() {
  // Populate Ano buttons from available years
  const anos = [...new Set(allData.map(d => d.ANO))].filter(Boolean).sort((a,b)=>a-b);
  const grp  = document.getElementById('mbuAnoGrp');
  if(!grp) return;

  // Default = latest year with Forecast or Plan data
  const latestYear = anos[anos.length-1] || new Date().getFullYear();
  if(!mbuAno) mbuAno = String(latestYear);

  grp.innerHTML = anos.map(y =>
    `<button data-ano="${y}" onclick="setMbuAno(this)"${String(y)===String(mbuAno)?' class="on"':''}>${y}</button>`
  ).join('') +
  `<button data-ano="custom" onclick="setMbuAno(this)"${mbuAno==='custom'?' class="on"':''}>Custom</button>`;

  // Populate De/Até selects (used in custom mode)
  const meses = [...new Set(allData.map(d => d.MES))].sort((a,b)=>a-b);
  ['mbuFromSel','mbuToSel'].forEach((id, i) => {

  });
}

  else mbuExpanded.add(k1);

function mbuToggleK2(tr) {

  if(mbuExpandedK2.has(key)) mbuExpandedK2.delete(key);
  else mbuExpandedK2.add(key);
  renderMbuTab();
}

function renderMbuTab() {
  // Resolve date range from mbuAno or custom selects
  let fromMes, toMes;
  if(mbuAno === 'custom') {
    fromMes = parseInt(document.getElementById('mbuFromSel')?.value || 0);
    toMes   = parseInt(document.getElementById('mbuToSel')?.value   || 999999);
  } else {
    const yr = parseInt(mbuAno) || new Date().getFullYear();
    fromMes  = yr * 100 + 1;
    toMes    = yr * 100 + 12;
  }

  // Resolve scenario labels from mbuComp
  const compMap = {
    plan_fcast:  { cenA:'Plan', cenAFill:null,        cenB:'Forecast', cenBFill:'Realizado', lblA:'Plan', lblB:'Fcast' },
    plan_real:   { cenA:'Plan', cenAFill:null,        cenB:'Realizado',cenBFill:null,        lblA:'Plan', lblB:'Real'  },
    fcast_real:  { cenA:'Forecast', cenAFill:'Realizado', cenB:'Realizado',cenBFill:null,    lblA:'Fcast',lblB:'Real'  },
  };
  const comp = compMap[mbuComp] || compMap.plan_fcast;

  // Ordered BUs within this Macro BU
  // Exclude any product whose name === mbuMacro (it's the aggregate — becomes the Total col)
  const allBus = [...new Set(
    allData.filter(d => d.Macro_BU === mbuMacro).map(d => d.Product)
  )].filter(b => b && b !== mbuMacro);
  const preferred = MBU_BU_ORDER[mbuMacro] || [];
  const inOrder   = preferred.filter(b => allBus.includes(b));
  const rest      = allBus.filter(b => !preferred.includes(b)).sort();
  const bus       = [...inOrder, ...rest]; // individual BUs (no Total yet)

  const headEl = document.getElementById('mbuHead');
  const bodyEl = document.getElementById('mbuBody');
  if(!bus.length) {
    headEl.innerHTML = '';
    bodyEl.innerHTML = '<tr><td colspan="20" class="empty">Sem dados para o Macro BU selecionado.</td></tr>';
    return;
  }

  // Metric for % columns
  const pctMetric = mbuMacro === 'Commerce' ? 'NMV'
                  : mbuMacro === 'Acquiring' ? 'TPV' : null;
  const hasPct    = pctMetric !== null;
  const pLabel    = hasPct ? `${comp.lblA}/${pctMetric}%` : '';
  const fLabel    = hasPct ? `${comp.lblB}/${pctMetric}%` : '';
  const colsPerBU = hasPct ? 6 : 3;

  // ── Aggregate ──
  const buData  = new Map(); // BU → Map<k1, Map<k2, {a,b}>>
  const buData3 = new Map(); // BU → Map<k1+'|||'+k2, Map<k3, {a,b}>>
  const buVol   = new Map(); // BU → {aVol, bVol}
  const buL1    = new Map(); // BU → Map<k1, {a,b}>

  // Helper: does cenario match A or B?
  function cenSlot(cen) {
    if(cen === comp.cenA || (comp.cenAFill && cen === comp.cenAFill)) {
      // For fill: only use fill if primary not present (handled below)
      return cen === comp.cenA ? 'A' : 'Afill';
    }
    if(cen === comp.cenB || (comp.cenBFill && cen === comp.cenBFill)) {
      return cen === comp.cenB ? 'B' : 'Bfill';
    }
    return null;
  }

  // Two passes: primary then fill (fill only for months without primary)
  const mesHasA = new Set(); // (bu+'|'+mes) that have primary A
  const mesHasB = new Set();

  const data = allData.filter(d =>
    d.Macro_BU === mbuMacro && d.MES >= fromMes && d.MES <= toMes
  );

  // Pass 1: primary scenarios
  for(const d of data) {
    const slot = cenSlot(d.Cenario);
    if(!slot) continue;
    if(slot !== 'A' && slot !== 'B') continue; // fills done in pass 2
    const bu = d.Product || ''; if(!bu) continue;
    const k  = bu+'|'+d.MES;
    if(slot==='A') mesHasA.add(k);
    if(slot==='B') mesHasB.add(k);

    const v = d.Value||0;
    if(!buData.has(bu)) buData.set(bu, new Map());
    const buMap = buData.get(bu);
    if(!buMap.has(d.MNG_1||'')) buMap.set(d.MNG_1||'', new Map());
    const k1map = buMap.get(d.MNG_1||'');
    if(!k1map.has(d.MNG_2||'')) k1map.set(d.MNG_2||'', {a:0,b:0});
    const cell = k1map.get(d.MNG_2||'');
    if(slot==='A') cell.a += v;
    if(slot==='B') cell.b += v;
    // k3 rollup
    if(d.MNG_3) {
      const k3key = (d.MNG_1||'')+'|||'+(d.MNG_2||'');
      if(!buData3.has(bu)) buData3.set(bu, new Map());
      const b3 = buData3.get(bu);
      if(!b3.has(k3key)) b3.set(k3key, new Map());
      const k3m = b3.get(k3key);
      if(!k3m.has(d.MNG_3)) k3m.set(d.MNG_3, {a:0,b:0});
      const c3 = k3m.get(d.MNG_3);
      if(slot==='A') c3.a += v;
      if(slot==='B') c3.b += v;
    }
    if(hasPct && d.MNG_1==='Metrics' && d.MNG_2===pctMetric) {
      if(!buVol.has(bu)) buVol.set(bu,{aVol:0,bVol:0});
      const bv = buVol.get(bu);
      if(slot==='A') bv.aVol += v;
      if(slot==='B') bv.bVol += v;
    }
  }
  // Pass 2: fill scenarios (for months without primary)
  for(const d of data) {
    const slot = cenSlot(d.Cenario);
    if(slot !== 'Afill' && slot !== 'Bfill') continue;
    const bu = d.Product || ''; if(!bu) continue;
    const k  = bu+'|'+d.MES;
    if(slot==='Afill' && mesHasA.has(k)) continue; // primary exists
    if(slot==='Bfill' && mesHasB.has(k)) continue;

    const v = d.Value||0;
    if(!buData.has(bu)) buData.set(bu, new Map());
    const buMap = buData.get(bu);
    if(!buMap.has(d.MNG_1||'')) buMap.set(d.MNG_1||'', new Map());
    const k1map = buMap.get(d.MNG_1||'');
    if(!k1map.has(d.MNG_2||'')) k1map.set(d.MNG_2||'', {a:0,b:0});
    const cell = k1map.get(d.MNG_2||'');
    if(slot==='Afill') cell.a += v;
    if(slot==='Bfill') cell.b += v;
    if(d.MNG_3) {
      const k3key = (d.MNG_1||'')+'|||'+(d.MNG_2||'');
      if(!buData3.has(bu)) buData3.set(bu, new Map());
      const b3 = buData3.get(bu);
      if(!b3.has(k3key)) b3.set(k3key, new Map());
      const k3m = b3.get(k3key);
      if(!k3m.has(d.MNG_3)) k3m.set(d.MNG_3, {a:0,b:0});
      const c3 = k3m.get(d.MNG_3);
      if(slot==='Afill') c3.a += v;
      if(slot==='Bfill') c3.b += v;
    }
    if(hasPct && d.MNG_1==='Metrics' && d.MNG_2===pctMetric) {
      if(!buVol.has(bu)) buVol.set(bu,{aVol:0,bVol:0});
      const bv = buVol.get(bu);
      if(slot==='Afill') bv.aVol += v;
      if(slot==='Bfill') bv.bVol += v;
    }
  }

  // Roll up MNG_1 totals per BU
  for(const [bu, k1map] of buData) {
    if(!buL1.has(bu)) buL1.set(bu, new Map());
    const l1 = buL1.get(bu);
    for(const [k1, k2map] of k1map) {
      let a=0, b=0;
      for(const [, v] of k2map) { a+=v.a; b+=v.b; }
      l1.set(k1, {a,b});
    }
  }

  // ── Compute Total column (sum of all BUs) ──
  const TOTAL = '__total__';
  const totData  = new Map(); // k1 → Map<k2, {a,b}>
  const totData3 = new Map(); // k1k2key → Map<k3, {a,b}>
  const totL1    = new Map(); // k1 → {a,b}
  const totVol   = {aVol:0, bVol:0};
  for(const bu of bus) {
    const k1map = buData.get(bu);
    if(!k1map) continue;
    for(const [k1, k2map] of k1map) {
      if(!totData.has(k1)) totData.set(k1, new Map());
      const tk1 = totData.get(k1);
      if(!totL1.has(k1)) totL1.set(k1, {a:0,b:0});
      const tl = totL1.get(k1);
      for(const [k2, v] of k2map) {
        if(!tk1.has(k2)) tk1.set(k2, {a:0,b:0});
        const tc = tk1.get(k2); tc.a+=v.a; tc.b+=v.b;
        tl.a+=v.a; tl.b+=v.b;
      }
    }
    // Aggregate k3 data for total
    const b3map = buData3.get(bu);
    if(b3map) {
      for(const [k3key, k3m] of b3map) {
        if(!totData3.has(k3key)) totData3.set(k3key, new Map());
        const tk3 = totData3.get(k3key);
        for(const [k3, v] of k3m) {
          if(!tk3.has(k3)) tk3.set(k3, {a:0,b:0});
          const tc = tk3.get(k3); tc.a+=v.a; tc.b+=v.b;
        }
      }
    }
    const vol = buVol.get(bu)||{aVol:0,bVol:0};
    totVol.aVol += vol.aVol;
    totVol.bVol += vol.bVol;
  }
  // Inject total into buData/buVol/buL1/buData3 with key TOTAL
  buData.set(TOTAL,  totData);
  buData3.set(TOTAL, totData3);
  buVol.set(TOTAL,   totVol);
  buL1.set(TOTAL,    totL1);

  // ── Compute cumulative waterfall totals (each row = sum of all preceding P&L levels) ──
  // e.g. VC row = PM + NM + VC items combined
  const WATERFALL = ['Product Monetization','Net Monetization','Variable Contribution',
                     'Direct Contribution','Business Contribution','Business Margin',
                     'EBIT','Below EBIT'];
  const buCum = new Map(); // BU → Map<k1, {a,b}>
  for(const bu of [...buL1.keys()]) {
    const l1  = buL1.get(bu);
    const cum = new Map();
    let ca = 0, cb = 0;
    for(const k1 of WATERFALL) {
      const {a=0, b=0} = l1.get(k1)||{};
      ca += a; cb += b;
      cum.set(k1, {a: ca, b: cb});
    }
    buCum.set(bu, cum);
  }

  // Column order: Total first, then ordered BUs
  const colBus = [TOTAL, ...bus];
  const colLabels = {[TOTAL]: mbuMacro};
  bus.forEach(b => colLabels[b] = b);

  // ── Build thead ──
  let h = `<tr><th class="mbu-desc-hdr">Linha P&L</th>`;
  colBus.forEach((bu, bi) => {
    if(bi > 0) h += `<th class="mbu-sep"></th>`;
    const isTot = bu === TOTAL;
    h += `<th class="${isTot?'mbu-grp-total':'mbu-grp-hdr'}" colspan="${colsPerBU}">${colLabels[bu]}</th>`;
  });
  h += `</tr><tr><th class="mbu-desc-hdr"></th>`;
  colBus.forEach((_, bi) => {
    if(bi > 0) h += `<th class="mbu-sep"></th>`;
    h += `<th class="mbu-sub-hdr mbu-sub-first">${comp.lblA}</th>`;
    h += `<th class="mbu-sub-hdr">${comp.lblB}</th>`;
    h += `<th class="mbu-sub-hdr">Δ</th>`;
    if(hasPct) {
      h += `<th class="mbu-sub-hdr mbu-pct-col">${pLabel}</th>`;
      h += `<th class="mbu-sub-hdr mbu-pct-col">${fLabel}</th>`;
      h += `<th class="mbu-sub-hdr mbu-pct-col">Δpp</th>`;
    }
  });
  h += `</tr>`;
  headEl.innerHTML = h;

  // ── Helper: render value cells for one BU (or total) ──
  function buCells(colBuList, getVals, getVol) {
    let c = '';
    colBuList.forEach((bu, bi) => {
      const {a,b}   = getVals(bu);
      const delta   = b - a;
      const dcls    = delta >= 0 ? 'mbu-dpos' : 'mbu-dneg';
      const vol     = getVol ? getVol(bu) : null;
      if(bi > 0) c += `<td class="mbu-sep"></td>`;
      c += `<td class="mbu-sub-first">${mbuFmt(a)}</td>`;
      c += `<td>${mbuFmt(b)}</td>`;
      c += `<td class="${dcls}">${mbuFmt(delta)}</td>`;
      if(hasPct) {
        if(vol) {
          const ap  = mbuPct(a, vol.aVol);
          const bp  = mbuPct(b, vol.bVol);
          const dpp = (ap!=null&&bp!=null) ? bp-ap : null;
          const dppcls = dpp==null?'':(dpp>=0?'mbu-dpos':'mbu-dneg');
          c += `<td class="mbu-pct-col">${ap==null?'—':ap.toFixed(2)+'%'}</td>`;
          c += `<td class="mbu-pct-col">${bp==null?'—':bp.toFixed(2)+'%'}</td>`;
          c += `<td class="mbu-pct-col ${dppcls}">${dpp==null?'—':(dpp>=0?'+':'')+dpp.toFixed(2)+'pp'}</td>`;
        } else {
          // Volume row itself: keep column count aligned with blank cells
          c += `<td class="mbu-pct-col" style="color:var(--muted)">—</td>`;
          c += `<td class="mbu-pct-col" style="color:var(--muted)">—</td>`;
          c += `<td class="mbu-pct-col" style="color:var(--muted)">—</td>`;
        }
      }
    });
    return c;
  }

  // ── Build tbody ──
  let bHtml = '';

  // Volume metric row
  if(hasPct) {
    bHtml += `<tr class="mbu-row-vol"><td class="mbu-desc-cell">${pctMetric}</td>`;
    bHtml += buCells(colBus,
      bu => { const v=buVol.get(bu)||{aVol:0,bVol:0}; return {a:v.aVol,b:v.bVol}; },
      null // no % for the volume row itself
    );
    bHtml += `</tr>`;
  }

  // P&L sections (skip Metrics)
  const k1s = MNG1_ORDER.filter(k1 =>
    k1 !== 'Metrics' &&
    colBus.some(bu => buData.get(bu)?.has(k1))
  );
  const getVol = hasPct ? bu => { const v=buVol.get(bu)||{aVol:0,bVol:0}; return {aVol:v.aVol,bVol:v.bVol}; } : null;

  for(const k1 of k1s) {
    const isOpen = mbuExpanded.has(k1);
    bHtml += `<tr class="mbu-gap"><td colspan="99"></td></tr>`;
    bHtml += `<tr class="mbu-row-sec" data-k1="${escAttr(k1)}" onclick="mbuToggleSec(this)">`;
    bHtml += `<td class="mbu-desc-cell"><span style="margin-right:5px">${isOpen?'▼':'▶'}</span>${k1}</td>`;
    // Use CUMULATIVE total for section header (P&L waterfall)
    bHtml += buCells(colBus,
      bu => buCum.get(bu)?.get(k1)||{a:0,b:0},
      getVol
    );
    bHtml += `</tr>`;

    if(isOpen) {
      const k2s = MNG2_ORDER[k1] ||
        [...new Set(colBus.flatMap(bu => [...(buData.get(bu)?.get(k1)?.keys()||[])]))].filter(Boolean);
      for(const k2 of k2s) {
        if(!colBus.some(bu => buData.get(bu)?.get(k1)?.has(k2))) continue;
        const k3key = k1+'|||'+k2;
        // Check if any BU has k3 children for this k2
        const hasK3 = colBus.some(bu => (buData3.get(bu)?.get(k3key)?.size||0) > 0);
        const isOpenK2 = mbuExpandedK2.has(k3key);
        const arrow = hasK3
          ? `<span style="margin-right:5px">${isOpenK2?'▼':'▶'}</span>`
          : `<span style="display:inline-block;width:14px;margin-right:5px"></span>`;
        bHtml += `<tr class="mbu-row-item${hasK3?' expandable':''}"
          ${hasK3?`data-k2key="${escAttr(k3key)}" onclick="mbuToggleK2(this)"`:''}>`;
        bHtml += `<td class="mbu-desc-cell">${arrow}${k2}</td>`;
        bHtml += buCells(colBus,
          bu => buData.get(bu)?.get(k1)?.get(k2)||{a:0,b:0},
          getVol
        );
        bHtml += `</tr>`;

        if(isOpenK2) {
          // k3 items from all BUs combined
          const allK3 = [...new Set(
            colBus.flatMap(bu => [...(buData3.get(bu)?.get(k3key)?.keys()||[])])
          )].filter(Boolean);
          for(const k3 of allK3) {
            bHtml += `<tr class="mbu-row-k3">`;
            bHtml += `<td class="mbu-desc-cell">${k3}</td>`;
            bHtml += buCells(colBus,
              bu => buData3.get(bu)?.get(k3key)?.get(k3)||{a:0,b:0},
              getVol
            );
            bHtml += `</tr>`;
          }
        }
      }
    }
    // ── Inject Take Rate after Net Monetization (Acquiring only) ──
    if(k1 === 'Net Monetization' && mbuMacro === 'Acquiring') {
      bHtml += `<tr class="mbu-gap"><td colspan="99"></td></tr>`;
      bHtml += `<tr class="mbu-row-sec" style="background:#E8F5E9;color:#1B5E20;border-top:2px solid #2E7D32;border-bottom:3px solid #81C784">`;
      bHtml += `<td class="mbu-desc-cell" style="background:#E8F5E9;color:#1B5E20;font-weight:700;border-left:4px solid #2E7D32">Take Rate</td>`;
      bHtml += buCells(colBus,
        bu => {
          const nm = buCum.get(bu)?.get('Net Monetization')||{a:0,b:0};
          const cf = buData.get(bu)?.get('Variable Contribution')?.get('Collection Fees')||{a:0,b:0};
          return {a: nm.a + cf.a, b: nm.b + cf.b};
        },
        getVol
      );
      bHtml += `</tr>`;
    }
  }

  bodyEl.innerHTML = bHtml ||
    '<tr><td colspan="30" class="empty">Sem dados para o período selecionado.</td></tr>';
}

// ── Normalize MNG names with encoding issues ─────────────
function normalizeName(s) {
  if(!s) return s;
  if(s.includes('Telemet'))                          return 'Telemetría';
  if(s.includes('Previsi') && s.includes('Costo'))   return 'Previsión Costo MPOS';
  return s;
}

// ── Generic line aggregator ───────────────────────────────
// filterFn(row) → bool; key derived from MNG_4 (or MNG_3 fallback), normalized
function aggregateLines(filterFn, mes) {
  if(!mes || !allData.length) return { total:{real:0,plan:0,pm:0,ytdReal:0,ytdPlan:0}, items:new Map() };
  const year = Math.floor(mes/100);
  const month = mes%100;
  const janOfYear = year*100+1;
  const pmMes = month===1 ? (year-1)*100+12 : year*100+(month-1);

  const items = new Map();
  const total = {real:0,plan:0,pm:0,ytdReal:0,ytdPlan:0};

  for(const d of allData) {
    if(!filterFn(d)) continue;
    const k4 = normalizeName(d.MNG_4 || d.MNG_3 || '(outros)');
    if(!items.has(k4)) items.set(k4, {real:0,plan:0,pm:0,ytdReal:0,ytdPlan:0});
    const item = items.get(k4);
    const v = d.Value || 0;
    if(d.MES===mes   && d.Cenario==='Realizado')                                { item.real+=v;    total.real+=v; }
    if(d.MES===mes   && d.Cenario==='Plan')                                     { item.plan+=v;    total.plan+=v; }
    if(d.MES===pmMes && d.Cenario==='Realizado')                               { item.pm+=v;      total.pm+=v; }
    if(d.MES>=janOfYear&&d.MES<=mes&&d.Cenario==='Realizado')                  { item.ytdReal+=v; total.ytdReal+=v; }
    if(d.MES>=janOfYear&&d.MES<=mes&&d.Cenario==='Plan')                       { item.ytdPlan+=v; total.ytdPlan+=v; }
  }
  return {total, items};
}

// ── Data filters per section ──────────────────────────────
const CPA_FILTER = d =>
  (d.MNG_2==='Customer Acquisition Cost' && d.MNG_3==='CPA') ||
  (d.MNG_2==='Direct Variable Costs'     && d.MNG_4==='Consultor Certificado') ||
  (d.MNG_2==='Direct Variable Costs'     && d.MNG_4==='Cashbacks');

const MPOS_FILTERS = {
  'Sales':    d => d.MNG_2==='Customer Acquisition Cost' && d.MNG_3==='Sales MPOS',
  'PointCogs': d =>
    (d.MNG_2==='Customer Acquisition Cost' && d.MNG_3==='Point COGS') ||
    (d.MNG_2==='Customer Acquisition Cost' && d.MNG_3 && d.MNG_3.includes('MPOS Cost')) ||
    (d.MNG_2==='Direct Variable Costs'     && d.MNG_3 && d.MNG_3.includes('Telemet')) ||
    (d.MNG_2==='Shipping Ops Fixed'        && d.MNG_3==='S&W Fixed')
};

// ── Format value for CPA/MPOS tables ──────────────────────
function fmtCpa(v, ud) {
  if(v===0 || v==null) return '—';
  const neg = v < 0;
  const abs = Math.abs(v) / ud;
  const dec = ud >= 1_000_000 ? 1 : 0;
  const str = abs.toLocaleString('pt-BR', {minimumFractionDigits:dec, maximumFractionDigits:dec});
  return neg ? `(${str})` : str;
}

function deltaCell(d, ud) {
  const cls = d >= 0 ? 'vpos' : 'vneg';
  return `<td class="cpa-delta-cell ${cls}">${fmtCpa(d, ud)}</td>`;
}

// ── Build CPA/MPOS table header ─────────────────────────────
function buildCpaHead(mes, ud, tableId) {
  const mm = String(mes).slice(4,6);
  const yy = '20' + String(mes).slice(2,4);
  const mesLbl = (MN[mm]||mm) + '/' + String(mes).slice(2,4);
  const year = Math.floor(mes / 100);
  const month = mes % 100;
  let pmMes;
  if(month === 1) pmMes = (year - 1) * 100 + 12;
  else pmMes = year * 100 + (month - 1);
  const pmMm = String(pmMes).slice(4,6);
  const pmLbl = (MN[pmMm]||pmMm) + '/' + String(pmMes).slice(2,4);
  const unitLbl = ud >= 1e6 ? 'R$ M' : ud >= 1e3 ? 'R$ mil' : 'R$';
  const ytdLbl = 'YTD ' + year;

  return `<tr>
    <th class="cpa-name-hdr" style="background:#1a1a1a;color:#FFE600">P&amp;L</th>
    <th class="cpa-hdr-real" style="min-width:90px">Realizado<br><span style="font-size:10px;font-weight:400">${mesLbl} · ${unitLbl}</span></th>
    <th class="cpa-hdr-monthly" style="min-width:90px">Plan<br><span style="font-size:10px;font-weight:400">${mesLbl}</span></th>
    <th class="cpa-hdr-monthly" style="min-width:90px">Prior Month<br><span style="font-size:10px;font-weight:400">${pmLbl}</span></th>
    <th class="cpa-hdr-ytd" style="min-width:100px">Actual YTD<br><span style="font-size:10px;font-weight:400">${ytdLbl}</span></th>
    <th class="cpa-hdr-ytd" style="min-width:100px">Plan YTD<br><span style="font-size:10px;font-weight:400">${ytdLbl}</span></th>
    <th class="cpa-hdr-sep" style="border:none"></th>
    <th class="cpa-hdr-delta" style="min-width:85px">Δ Plan<br><span style="font-size:9px;font-weight:400">${mesLbl}</span></th>
    <th class="cpa-hdr-delta" style="min-width:85px">Δ Prior Month<br><span style="font-size:9px;font-weight:400">${pmLbl}</span></th>
    <th class="cpa-hdr-delta" style="min-width:95px">Δ Plan YTD<br><span style="font-size:9px;font-weight:400">${ytdLbl}</span></th>
  </tr>`;
}

// ── Build a row from aggregated data ─────────────────────
function buildCpaRow(label, data, ud, rowClass, isNameOnly) {
  if(isNameOnly) {
    // Block header row (no data)
    return `<tr class="${rowClass}">
      <td class="cpa-name-cell" colspan="10">${label}</td>
    </tr>`;
  }
  const { real, plan, pm, ytdReal, ytdPlan } = data;
  return `<tr class="${rowClass}">
    <td class="cpa-name-cell">${label}</td>
    <td class="cpa-real-cell ${real<0?'neg':''}">${fmtCpa(real,ud)}</td>
    <td class="${plan<0?'neg':''}">${fmtCpa(plan,ud)}</td>
    <td class="${pm<0?'neg':''}">${fmtCpa(pm,ud)}</td>
    <td class="cpa-ytd-cell ${ytdReal<0?'neg':''}">${fmtCpa(ytdReal,ud)}</td>
    <td class="cpa-ytd-cell ${ytdPlan<0?'neg':''}">${fmtCpa(ytdPlan,ud)}</td>
    <td class="cpa-td-sep" style="background:#e8e8ee;padding:0;width:10px"></td>
    ${deltaCell(real-plan, ud)}
    ${deltaCell(real-pm, ud)}
    ${deltaCell(ytdReal-ytdPlan, ud)}
  </tr>`;
}

const CPA_DEFAULT_ORDER = [
  'Paid On Media','MGM','Fuerza de Venta Propia Point',
  'Fuerza de Venta de Terceros Point','Comisiones a Resellers Point',
  'Televentas','Venta en pagina web de terceros','Other Sales Expenses Point',
  'Consultor Certificado','Cashbacks'
];
const MPOS_BLOCKS_DEF = [
  { key:'Sales',    label:'Sales MPOS', defOrder:['Sales MPOS Gross','Alquiler MPOS','Bad Debt MPOS','Descuentos MPOS','Sales Tax MPOS'] },
  { key:'PointCogs',label:'MPOS COGS',  defOrder:['Cost of Product Sold','Insumos Point','Reacondicionamiento','Shipping Costs Point','Warehousing Point','Other MPOS Cogs','Previsión Costo MPOS','Telemetría','S&W Fixed'] },
];

let cpaLineOrder  = [...CPA_DEFAULT_ORDER];
let cpaLineHidden = new Set();
let mposLineCfg   = {};
MPOS_BLOCKS_DEF.forEach(b => { mposLineCfg[b.key] = { order:[...b.defOrder], hidden:new Set() }; });

let cpaDensity       = 0;   // 0=Normal 1=Compact 2=Dense 3=Ultra
let mposDensity      = 0;
let mposLightDensity = 1; // default: Compact

const DENSITY_LABELS = ['Normal','Compact','Dense','Ultra'];
const MAX_DENSITY = 3;

// Load persisted config
(function loadLineCfg(){
  try {
    const c = localStorage.getItem('acq_cpa_cfg');
    if(c){ const p=JSON.parse(c); if(p.order) cpaLineOrder=p.order; cpaLineHidden=new Set(p.hidden||[]); }
    const m = localStorage.getItem('acq_mpos_cfg');
    if(m){ const p=JSON.parse(m); for(const[k,v] of Object.entries(p)) if(mposLineCfg[k]){ mposLineCfg[k].order=v.order||mposLineCfg[k].order; mposLineCfg[k].hidden=new Set(v.hidden||[]); } }
    const cp = localStorage.getItem('acq_compact');
    if(cp){ const p=JSON.parse(cp); cpaDensity=Math.min(MAX_DENSITY,Math.max(0,parseInt(p.cpa)||0)); mposDensity=Math.min(MAX_DENSITY,Math.max(0,parseInt(p.mpos)||0)); }
  } catch(e){}
})();

function persistLineCfg(tab){
  try{
    if(tab==='cpa') localStorage.setItem('acq_cpa_cfg', JSON.stringify({order:cpaLineOrder,hidden:[...cpaLineHidden]}));
    else { const obj={}; for(const[k,v] of Object.entries(mposLineCfg)) obj[k]={order:v.order,hidden:[...v.hidden]}; localStorage.setItem('acq_mpos_cfg',JSON.stringify(obj)); }
    localStorage.setItem('acq_compact',JSON.stringify({cpa:cpaDensity,mpos:mposDensity}));
  } catch(e){}
}

// ── Density stepper ────────────────────────────────────────
function stepDensity(tab, dir){
  if(tab==='cpa'){
    cpaDensity = Math.max(0, Math.min(MAX_DENSITY, cpaDensity + dir));
    const tbl = document.getElementById('cpaTable');
    if(tbl){ if(cpaDensity===0) tbl.removeAttribute('data-density'); else tbl.dataset.density=cpaDensity; }
    const lbl = document.getElementById('cpaDensityLbl');
    if(lbl) lbl.textContent = DENSITY_LABELS[cpaDensity];
    const wb = document.getElementById('cpaWidenBtn');
    const nb = document.getElementById('cpaNarrowBtn');
    if(wb) wb.disabled = cpaDensity===0;
    if(nb) nb.disabled = cpaDensity===MAX_DENSITY;
    persistLineCfg('cpa');
  } else if(tab==='mpos') {
    mposDensity = Math.max(0, Math.min(MAX_DENSITY, mposDensity + dir));
    const tbl = document.getElementById('mposTable');
    if(tbl){ if(mposDensity===0) tbl.removeAttribute('data-density'); else tbl.dataset.density=mposDensity; }
    const lbl = document.getElementById('mposDensityLbl');
    if(lbl) lbl.textContent = DENSITY_LABELS[mposDensity];
    const wb = document.getElementById('mposWidenBtn');
    const nb = document.getElementById('mposNarrowBtn');
    if(wb) wb.disabled = mposDensity===0;
    if(nb) nb.disabled = mposDensity===MAX_DENSITY;
    persistLineCfg('mpos');
  } else {
    mposLightDensity = Math.max(0, Math.min(MAX_DENSITY, mposLightDensity + dir));
    const tbl = document.getElementById('mposLightTable');
    if(tbl){ if(mposLightDensity===0) tbl.removeAttribute('data-density'); else tbl.dataset.density=mposLightDensity; }
    const lbl = document.getElementById('mposLightDensityLbl');
    if(lbl) lbl.textContent = DENSITY_LABELS[mposLightDensity];
    const wb = document.getElementById('mposLightWidenBtn');
    const nb = document.getElementById('mposLightNarrowBtn');
    if(wb) wb.disabled = mposLightDensity===0;
    if(nb) nb.disabled = mposLightDensity===MAX_DENSITY;
  }
}

function syncDensity(){
  // CPA
  const ct = document.getElementById('cpaTable');
  if(ct){ if(cpaDensity===0) ct.removeAttribute('data-density'); else ct.dataset.density=cpaDensity; }
  const cl = document.getElementById('cpaDensityLbl');
  if(cl) cl.textContent = DENSITY_LABELS[cpaDensity];
  const cw = document.getElementById('cpaWidenBtn');  if(cw) cw.disabled = cpaDensity===0;

  const ml = document.getElementById('mposDensityLbl');
  if(ml) ml.textContent = DENSITY_LABELS[mposDensity];
  const mw = document.getElementById('mposWidenBtn');  if(mw) mw.disabled = mposDensity===0;

// ── CPA Tab renderer (uses line config) ──────────────────
function renderCpaTab() {
  const mes = parseInt(document.getElementById('cpaMesSel').value || 0);
  if(!mes || !allData.length) return;
  const ud = cpaUnitDiv;

  const macroBuFnCpa = d => !cpaMacroBU || d.Macro_BU === cpaMacroBU;
  const data = aggregateLines(d => CPA_FILTER(d) && macroBuFnCpa(d), mes);
  if(!data) return;

  // ── CPA Plan adjustments (display only, P&L tab unchanged) ──────────────
  const mo = mes % 100; // number of months Jan→mes
  const ADJ_CONSULTOR = 2.6e6; // 2.6M/month moved from Other Sales Expenses Point

  // 1. Move MGM plan → Cashbacks (MGM has no Realizado, only Plan)
  const mgmItem = data.items.get('MGM');
  const cashbacksItem = data.items.get('Cashbacks');
  if(mgmItem && cashbacksItem) {
    cashbacksItem.plan    += mgmItem.plan;
    cashbacksItem.ytdPlan += mgmItem.ytdPlan;
    data.items.delete('MGM');
  }

  // 2. Move 2.6M/month from Other Sales Expenses Point plan → Consultor Certificado
  const otherItem     = data.items.get('Other Sales Expenses Point');
  const consultorItem = data.items.get('Consultor Certificado');
  if(otherItem && consultorItem) {
    otherItem.plan        += ADJ_CONSULTOR;          // cost is negative, +2.6M reduces it
    otherItem.ytdPlan     += ADJ_CONSULTOR * mo;
    consultorItem.plan    -= ADJ_CONSULTOR;          // add 2.6M cost to Consultor
    consultorItem.ytdPlan -= ADJ_CONSULTOR * mo;
  }

  document.getElementById('cpaHead').innerHTML = buildCpaHead(mes, ud, 'cpaTable');

  // Merge config order with any new lines from data, sort by |real| descending
  const dataKeys = [...data.items.keys()];
  const allKeys  = [...new Set([...cpaLineOrder, ...dataKeys])];

  // Label overrides for CPA tab only
  const CPA_LABELS = {
    'Consultor Certificado'           : 'Consultor Certificado e Virtual',
    'Fuerza de Venta Propia Point'    : 'FDVP',
    'Paid On Media'                   : 'POM',
    'Fuerza de Venta de Terceros Point': 'FDVT',
  };

  const sortedCpaKeys = allKeys
    .filter(k => !cpaLineHidden.has(k) && data.items.has(k))
    .sort((a, b) => Math.abs(data.items.get(b).real) - Math.abs(data.items.get(a).real));

  // Visible total: only sum non-hidden lines
  const cpaVisTotal = {real:0,plan:0,pm:0,ytdReal:0,ytdPlan:0};
  for(const k of sortedCpaKeys) {
    const v = data.items.get(k);
    if(v){ cpaVisTotal.real+=v.real; cpaVisTotal.plan+=v.plan; cpaVisTotal.pm+=v.pm; cpaVisTotal.ytdReal+=v.ytdReal; cpaVisTotal.ytdPlan+=v.ytdPlan; }
  }

  let html = '';
  html += buildCpaRow('CPA Total', cpaVisTotal, ud, 'cpa-row-total', false);

  for(const k4 of sortedCpaKeys) {
    const label = CPA_LABELS[k4] || k4;
    html += buildCpaRow(label, data.items.get(k4), ud, 'cpa-row-item', false);
  }

  // Footnote
  document.getElementById('cpaFootnote').innerHTML =
    '<b>Ajustes no plano (visão CPA):</b> ' +
    '① MGM incorporado ao Cashbacks (plan only). ' +
    '② R$ 2,6M/mês realocados de Other Sales Expenses Point para Consultor Certificado e Virtual (plan only). ' +
    'Valores do Realizado e da aba P&L não foram alterados.';

  if(!data.items.size)
    html = '<tr><td colspan="10" class="empty">Sem dados para o mês selecionado.</td></tr>';

  document.getElementById('cpaBody').innerHTML = html;
  requestAnimationFrame(() => {
    document.querySelectorAll('#cpaTable thead tr th').forEach(th => th.style.top='0px');
    syncDensity();
  });
}

// ── Point & MPOS Tab renderer (uses line config) ─────────
function renderMposTab() {
  const mes = parseInt(document.getElementById('mposMesSel').value || 0);
  if(!mes || !allData.length) return;
  const ud = mposUnitDiv;

  const macroBuFnMpos = d => !mposMacroBU || d.Macro_BU === mposMacroBU;

  document.getElementById('mposHead').innerHTML = buildCpaHead(mes, ud, 'mposTable');

  // Pre-compute all block data
  const blockDataMap = {};
  for(const blockDef of MPOS_BLOCKS_DEF) {
    const filterFn = MPOS_FILTERS[blockDef.key];
    if(!filterFn) continue;
    blockDataMap[blockDef.key] = aggregateLines(d => filterFn(d) && macroBuFnMpos(d), mes);
  }

  // Build visible keys per block, compute visible block totals
  const mposNet = {real:0,plan:0,pm:0,ytdReal:0,ytdPlan:0};
  const blockVisKeys = {};
  const blockVisTotals = {};

  for(const blockDef of MPOS_BLOCKS_DEF) {
    const data = blockDataMap[blockDef.key];
    if(!data) continue;
    const cfg = mposLineCfg[blockDef.key] || { order: blockDef.defOrder, hidden: new Set() };
    const dataKeys = [...data.items.keys()];
    const allKeys  = [...new Set([...cfg.order, ...dataKeys])];
    const visKeys = allKeys
      .filter(k => !(cfg.hidden && cfg.hidden.has(k)) && data.items.has(k))
      .sort((a, b) => Math.abs(data.items.get(b).real) - Math.abs(data.items.get(a).real));
    blockVisKeys[blockDef.key] = visKeys;

    const bt = {real:0,plan:0,pm:0,ytdReal:0,ytdPlan:0};
    for(const k of visKeys) {
      const v = data.items.get(k);
      if(v){ bt.real+=v.real; bt.plan+=v.plan; bt.pm+=v.pm; bt.ytdReal+=v.ytdReal; bt.ytdPlan+=v.ytdPlan; }
    }
    blockVisTotals[blockDef.key] = bt;
    mposNet.real+=bt.real; mposNet.plan+=bt.plan; mposNet.pm+=bt.pm;
    mposNet.ytdReal+=bt.ytdReal; mposNet.ytdPlan+=bt.ytdPlan;
  }

  let html = '';
  html += buildCpaRow('MPOS NET', mposNet, ud, 'cpa-row-total', false);

  for(const blockDef of MPOS_BLOCKS_DEF) {
    const data = blockDataMap[blockDef.key];
    if(!data) continue;
    const visKeys = blockVisKeys[blockDef.key] || [];

    html += '<tr class="cpa-gap"><td colspan="10"></td></tr>';
    html += buildCpaRow(blockDef.label + ' Total', blockVisTotals[blockDef.key], ud, 'cpa-row-total', false);

    for(const k4 of visKeys) {
      html += buildCpaRow(k4, data.items.get(k4), ud, 'cpa-row-item', false);
    }
  }

  if(!html) html = '<tr><td colspan="10" class="empty">Sem dados para o mês selecionado.</td></tr>';
  document.getElementById('mposBody').innerHTML = html;
  requestAnimationFrame(() => {
    document.querySelectorAll('#mposTable thead tr th').forEach(th => th.style.top='0px');
    syncDensity();
  });
}

// ── Sum specific items from aggregated items Map ──────────
function sumItems(itemsMap, keys) {
  const r = {real:0,plan:0,pm:0,ytdReal:0,ytdPlan:0};
  for(const k of keys) {
    const v = itemsMap.get(k);
    if(v){ r.real+=v.real; r.plan+=v.plan; r.pm+=v.pm; r.ytdReal+=v.ytdReal; r.ytdPlan+=v.ytdPlan; }
  }
  return r;
}

let lcmActiveTab = 'cpa';
let lcmDragSrc   = null;

function openLcm(tab) {
  lcmActiveTab = tab;
  document.getElementById('lcmTitle').textContent =
    tab === 'cpa' ? 'Configurar Linhas — CPA' : 'Configurar Linhas — Point & MPOS';
  buildLcmList();
  document.getElementById('lineConfigModal').classList.add('open');
}
function closeLcm() {
  document.getElementById('lineConfigModal').classList.remove('open');
}
function lcmOverlayClick(e) {
  if(e.target === document.getElementById('lineConfigModal')) closeLcm();
}
function lcmToggleAll(show) {
  document.querySelectorAll('#lcmList .lcm-check').forEach(cb => cb.checked = show);
}

function buildLcmList() {
  const container = document.getElementById('lcmList');
  container.innerHTML = '';

  function makeItem(name, isHidden, blockKey) {
    const div = document.createElement('div');
    div.className = 'lcm-item';
    div.draggable = true;
    div.dataset.name  = name;
    div.dataset.block = blockKey || '';
    div.innerHTML =
      `<span class="lcm-handle" title="Arrastar para reordenar">⠿</span>` +
      `<input type="checkbox" class="lcm-check"${isHidden?'':' checked'}>` +
      `<span class="lcm-label" title="${name}">${name}</span>`;
    div.addEventListener('dragstart', e => { lcmDragSrc=div; div.classList.add('lcm-dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',''); });
    div.addEventListener('dragend',   () => { div.classList.remove('lcm-dragging'); container.querySelectorAll('.lcm-item').forEach(i=>i.classList.remove('lcm-over')); lcmDragSrc=null; });
    div.addEventListener('dragover',  e => { e.preventDefault(); if(div!==lcmDragSrc){ container.querySelectorAll('.lcm-item').forEach(i=>i.classList.remove('lcm-over')); div.classList.add('lcm-over'); } });
    div.addEventListener('drop',      e => {
      e.preventDefault(); div.classList.remove('lcm-over');
      if(!lcmDragSrc || lcmDragSrc===div) return;
      if(lcmActiveTab==='mpos' && lcmDragSrc.dataset.block !== div.dataset.block) return;
      const items = [...container.querySelectorAll(`.lcm-item[data-block="${div.dataset.block}"]`)];
      const si = items.indexOf(lcmDragSrc), ti = items.indexOf(div);
      if(ti > si) div.after(lcmDragSrc); else div.before(lcmDragSrc);
    });
    return div;
  }

  if(lcmActiveTab === 'cpa') {
    const dataKeys = [...new Set(allData.filter(CPA_FILTER).map(d => normalizeName(d.MNG_4||d.MNG_3)).filter(Boolean))];
    const allKeys  = [...new Set([...cpaLineOrder, ...dataKeys])];
    allKeys.forEach(name => container.appendChild(makeItem(name, cpaLineHidden.has(name), '')));
  } else {
    MPOS_BLOCKS_DEF.forEach(blockDef => {
      const hdr = document.createElement('div');
      hdr.className = 'lcm-block-hdr';
      hdr.textContent = blockDef.label;
      container.appendChild(hdr);

      const cfg = mposLineCfg[blockDef.key] || { order: blockDef.defOrder, hidden: new Set() };
      const filterFn = MPOS_FILTERS[blockDef.key];
      const dataKeys = filterFn
        ? [...new Set(allData.filter(filterFn).map(d => normalizeName(d.MNG_4||d.MNG_3)).filter(Boolean))]
        : [];
      const allKeys = [...new Set([...cfg.order, ...dataKeys])];
      allKeys.forEach(name => container.appendChild(makeItem(name, cfg.hidden.has(name), blockDef.key)));
    });
  }
}

function applyLcm() {
  const items = [...document.querySelectorAll('#lcmList .lcm-item')];

  if(lcmActiveTab === 'cpa') {
    cpaLineOrder  = items.map(el => el.dataset.name);
    cpaLineHidden = new Set(items.filter(el => !el.querySelector('.lcm-check').checked).map(el => el.dataset.name));
    persistLineCfg('cpa');
    closeLcm();
    renderCpaTab();
  } else {
    const byBlock = {};
    items.forEach(el => {
      const b = el.dataset.block;
      if(!byBlock[b]) byBlock[b] = { order:[], hidden:new Set() };
      byBlock[b].order.push(el.dataset.name);
      if(!el.querySelector('.lcm-check').checked) byBlock[b].hidden.add(el.dataset.name);
    });
    for(const [k, v] of Object.entries(byBlock)) {
      if(mposLineCfg[k]) mposLineCfg[k] = v;
    }
    persistLineCfg('mpos');
    closeLcm();
    renderMposTab();
  }
}

// P&L sections that accumulate — same order as MNG1_ORDER (excluding Metrics)
const KN_PNL_ORDER = [
  'Product Monetization','Net Monetization','Variable Contribution',
  'Direct Contribution','Business Contribution','Business Margin',
  'EBIT','Below EBIT','Bundle'
];

// Returns the set of MNG_1 sections to sum for a given metric (cumulative P&L)
function knCumSections(metric) {
  const idx = KN_PNL_ORDER.indexOf(metric);
  if(idx === -1) return new Set([metric]); // fallback: only that metric
  return new Set(KN_PNL_ORDER.slice(0, idx + 1));
}

function knGetVal(buKey, mes, cenario) {
  const buses = KN_BU_MAP[buKey] || [buKey];
  const sections = knCumSections(knMetric);
  let sum = 0;
  for(const d of allData) {
    if(d.MES === mes && d.Cenario === cenario && buses.includes(d.Product) && sections.has(d.MNG_1))
      sum += d.Value;
  }
  return sum;
}

function knGetYTD(buKey, upToMes, cenario) {
  const buses = KN_BU_MAP[buKey] || [buKey];
  const sections = knCumSections(knMetric);
  const yr = Math.floor(upToMes / 100);
  let sum = 0;
  for(const d of allData) {
    if(d.ANO === yr && d.MES <= upToMes && d.Cenario === cenario && buses.includes(d.Product) && sections.has(d.MNG_1))
      sum += d.Value;
  }
  return sum;
}

function knOneoffSum(buKey, mes) {
  const buses = KN_BU_MAP[buKey] || [buKey];
  let sum = 0;
  for(const oo of knOneoffs) {
    const ooBuses = KN_BU_MAP[oo.bu] || [oo.bu];
    if(oo.mes === mes && ooBuses.some(b => buses.includes(b)))
      sum += oo.valor * 1_000_000; // stored as R$M, data is in R$
  }
  return sum;
}

function knOneoffYTD(buKey, upToMes) {
  const buses = KN_BU_MAP[buKey] || [buKey];
  const yr = Math.floor(upToMes / 100);
  let sum = 0;
  for(const oo of knOneoffs) {
    const ooBuses = KN_BU_MAP[oo.bu] || [oo.bu];
    if(Math.floor(oo.mes / 100) === yr && oo.mes <= upToMes && ooBuses.some(b => buses.includes(b)))
      sum += oo.valor * 1_000_000;
  }
  return sum;
}

function knFmt(v, ud) {
  if(v === 0) return '—';
  const neg = v < 0;
  const abs = Math.abs(v) / ud;
  const str = abs.toLocaleString('pt-BR', {minimumFractionDigits:0, maximumFractionDigits:0});
  return neg ? `(${str})` : str;
}

function knDeltaCell(v, ud) {
  if(v === 0) return '<td class="kn-adj-cell">—</td>';
  const cls = v > 0 ? 'kn-delta-pos' : 'kn-delta-neg';
  return `<td class="kn-adj-cell ${cls}">${knFmt(v, ud)}</td>`;
}

function renderKnOneoffList() {
  const listEl  = document.getElementById('knOneoffList');
  const countEl = document.getElementById('knOneoffCount');
  const noteEl  = document.getElementById('knFootnote');
  if(!listEl) return;

  countEl.textContent = knOneoffs.length ? `(${knOneoffs.length} ajuste${knOneoffs.length>1?'s':''})` : '';

  if(!knOneoffs.length) {
    listEl.innerHTML = '<div style="font-size:11px;color:var(--muted)">Nenhum ajuste adicionado.</div>';
    if(noteEl) noteEl.innerHTML = '';
    return;
  }

  // ── lista editável ──
  listEl.innerHTML = knOneoffs.map((oo,i) => {
    const yr = Math.floor(oo.mes/100), mo = oo.mes%100;
    const mesLbl = new Date(yr,mo-1,1).toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}).replace(' de ','\'').replace('.','').toUpperCase();
    const valFmt = (oo.valor > 0 ? '+' : '') + oo.valor.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + ' R$ M';
    return `<div class="kn-oneoff-item">
      <button class="kn-del" onclick="removeKnOneoff(${i})">×</button>
      <span><b>${mesLbl}</b> · ${oo.bu}</span>
      <span style="color:${oo.valor>0?'#2E7D32':'#C62828'};font-weight:600">${valFmt}</span>
      ${oo.desc ? `<span style="color:var(--muted)">${oo.desc}</span>` : ''}
    </div>`;
  }).join('');

  // ── nota de rodapé: mês → comentário → BUs ──
  if(noteEl) {
    // 1. agrupar por mês
    const byMes = new Map();
    knOneoffs.forEach(oo => {
      if(!byMes.has(oo.mes)) byMes.set(oo.mes, new Map());
      const desc = oo.desc || '(sem descrição)';
      if(!byMes.get(oo.mes).has(desc)) byMes.get(oo.mes).set(desc, []);
      byMes.get(oo.mes).get(desc).push(oo);
    });

    const mesKeys = [...byMes.keys()].sort((a,b) => a-b);
    const mesParts = mesKeys.map(mes => {
      const yr = Math.floor(mes/100), mo = mes%100;
      const mesLbl = new Date(yr,mo-1,1).toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}).replace(' de ','\'').replace('.','').toUpperCase();
      const byDesc = byMes.get(mes);
      // 2. dentro de cada mês, agrupar por comentário
      const descParts = [...byDesc.entries()].map(([desc, oos]) => {
        const buParts = oos.map(oo => {
          const sign = oo.valor > 0 ? '+' : '';
          const v = sign + Math.round(oo.valor).toLocaleString('pt-BR');
          const col = oo.valor > 0 ? '#2E7D32' : '#C62828';
          return `${oo.bu} <span style="color:${col};font-weight:600">${v}</span>`;
        }).join(', ');
        return `<i>${desc}:</i> ${buParts}`;
      }).join(' · ');
      return `<b>${mesLbl}</b> — ${descParts}`;
    }).join(' &nbsp;&nbsp;|&nbsp;&nbsp; ');

    noteEl.innerHTML = `<b>One-offs aplicados:</b> ${mesParts}`;
  }
}

    .replace(' de ',"'").replace('.','').toUpperCase();
}

// Aggregate monthly values into period buckets (quarterly / annual)
function evoBucketize(meses, cenario, metric) {
  const result = new Map(); // periodKey → {sum, count}
  for(const m of meses) {
    const v = evoGetVal(evoBU, m, cenario, metric);
    if(v === 0 && cenario === 'Realizado') continue; // skip empty real months
    const yr = Math.floor(m/100), mo = m%100;
    let key;
    if(evoGran === 'quarterly') key = `${yr}Q${Math.ceil(mo/3)}`;
    else if(evoGran === 'annual') key = String(yr);
    else key = m;
    if(!result.has(key)) result.set(key, 0);
    result.set(key, result.get(key) + v);
  }
  return result;
}

function evoPeriodLabel(key) {
  if(evoGran === 'monthly') return mesLabel(key);
  if(evoGran === 'quarterly') {
    const yr = String(key).slice(2,4), q = String(key).slice(5);
    return `Q${q}'${yr}`;
  }
  return String(key);
}

// Set of values treated as Macro BU (filter by d.Macro_BU)
// Anything else is treated as an individual Product (filter by d.Product)
const BRIDGE_MACRO_LEVEL = new Set(['Acquiring','Commerce','Fintech Services']);

function buildBridgeBUSel() {
  const sel = document.getElementById('bridgeMacroBUSel');
  if(!sel || !allData.length) return;
  // Build unique Macro BU list and Product list from data
  const macroBUs = [...new Set(allData.map(d => d.Macro_BU).filter(Boolean))].sort();
  const products = [...new Set(allData.map(d => d.Product).filter(Boolean))].sort();

  // Build optgroups: Macro BU → individual Products within it
  let html = '';
  for(const mbu of macroBUs) {
    html += `<optgroup label="▸ ${mbu}">`;
    html += `<option value="${mbu}">${mbu} (total)</option>`;

      allData.some(d => d.Macro_BU === mbu && d.Product === p)
    );
    for(const prod of buProds) {
      html += `<option value="${'__prod__' + prod}">${prod}</option>`;
    }

  }
  sel.innerHTML = html;

  // Restore or default selection
  const cur = bridgeMacro;
  const allVals = [
    ...macroBUs,
    ...products.map(p => '__prod__' + p)
  ];

    sel.value = cur;
  } else {
    bridgeMacro = macroBUs[0] || '';
