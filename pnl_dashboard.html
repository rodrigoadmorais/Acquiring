  }
}

function buildBridgeSelects() {
  if(!allData || !allData.length) return;
  buildBridgeBUSel();
  const cens = optCen.length ? optCen : uniq(allData.map(d => d.Cenario)).sort();
  const cenOpts = cens.map(c => `<option value="${c}">${shortCen(c)}</option>`).join('');

  ['bridgeCenASel','bridgeCenBSel'].forEach((id, i) => {
    const el = document.getElementById(id);
    if(!el) return;
    el.innerHTML = cenOpts;
    const def = i === 0 ? (cens.find(c => c==='Plan') || cens[0])
                        : (cens.find(c => c==='Realizado') || cens[cens.length-1]);
    if(i === 0 && !bridgeCenA) bridgeCenA = def;
    if(i === 1 && !bridgeCenB) bridgeCenB = def;
    el.value = i === 0 ? bridgeCenA : bridgeCenB;
  });

  // Period options (same logic as 1×1)
  let periods = [];
  if(bridgeType === 'mes') {
    periods = uniq(allData.map(d => String(d.MES))).sort();
  } else if(bridgeType === 'quarter') {
    const qs = new Set();
    allData.forEach(d => { if(d.QUARTER && d.ANO) qs.add(d.QUARTER + '/' + String(d.ANO).slice(2)); });
    periods = [...qs].sort((a,b) => {
      const [qa,ya] = a.split('/'); const [qb,yb] = b.split('/');
      return (parseInt(ya)*10+parseInt(qa[1])) - (parseInt(yb)*10+parseInt(qb[1]));
    });
  } else if(bridgeType === 'ano') {
    periods = uniq(allData.map(d => String(d.ANO))).sort();
  }

  const periodLbl = p => bridgeType === 'mes' ? mesLabel(parseInt(p)) : p;
  const periodOptsFn = curVal => periods.map(p =>
    `<option value="${p}"${p===curVal?' selected':''}>${periodLbl(p)}</option>`
  ).join('');

  ['bridgePeriodASel','bridgePeriodBSel'].forEach((id, i) => {
    const el = document.getElementById(id);
    if(!el) return;
    const defA = periods.length >= 2 ? periods[periods.length-2] : periods[0];
    const defB = periods.length >= 1 ? periods[periods.length-1] : periods[0];
    if(i === 0 && !bridgePeriodA) bridgePeriodA = defA || null;
    if(i === 1 && !bridgePeriodB) bridgePeriodB = defB || null;
    const curVal = i === 0 ? bridgePeriodA : bridgePeriodB;
    el.innerHTML = periodOptsFn(curVal);
    if(curVal && periods.includes(curVal)) el.value = curVal;
    else if(periods.length) {
      const fb = i === 0 ? (defA||periods[0]) : (defB||periods[0]);
      if(i === 0) bridgePeriodA = fb; else bridgePeriodB = fb;
      el.value = fb;
    }
  });
}

// Aggregate all P&L data for a given set of months + scenario + BU selector
// buSel can be: a Macro BU name (e.g. 'Acquiring') → filter by d.Macro_BU
//               '__prod__' + product name            → filter by d.Product
function getBridgePeriodData(mesSet, cenario, buSel) {
  if(!mesSet || mesSet.size === 0) return { tpv:0, byK1K2: new Map() };
  const isProd   = buSel && buSel.startsWith('__prod__');
  const prodName = isProd ? buSel.slice(8) : null;
  let tpv = 0;
  const byK1K2 = new Map(); // k1 → Map<k2, value>
  for(const d of allData) {
    if(!mesSet.has(d.MES))    continue;
    if(d.Cenario !== cenario) continue;
    if(buSel) {
      if(isProd  && d.Product   !== prodName) continue;
      if(!isProd && d.Macro_BU  !== buSel)    continue;
    }
    const v = d.Value || 0;
    if(d.MNG_1 === 'Metrics' && d.MNG_2 === 'TPV') { tpv += v; continue; }
    if(d.MNG_1 === 'Metrics') continue;
    if(!byK1K2.has(d.MNG_1)) byK1K2.set(d.MNG_1, new Map());
    const k2map = byK1K2.get(d.MNG_1);
    const k2 = d.MNG_2 || '';
    k2map.set(k2, (k2map.get(k2) || 0) + v);
  }
  return { tpv, byK1K2 };
}

// Sum Take Rate value from a k1k2 map: PM + NM + Collection Fees (from VC)
function getTRFromK1K2(byK1K2) {
  let tr = 0;
  const pm = byK1K2.get('Product Monetization');
  if(pm) pm.forEach(v => { tr += v; });
  const nm = byK1K2.get('Net Monetization');
  if(nm) nm.forEach(v => { tr += v; });
  const vc = byK1K2.get('Variable Contribution');
  if(vc) tr += (vc.get('Collection Fees') || 0);
  return tr;
}

// Sum metric total (cumulative) from period data
function getBridgeMetricTotal(data, metric) {
  const { byK1K2 } = data;
  if(metric === 'Take Rate') return getTRFromK1K2(byK1K2);
  const LEVELS = {
    'VC': ['Product Monetization','Net Monetization','Variable Contribution'],
    'DC': ['Product Monetization','Net Monetization','Variable Contribution','Direct Contribution'],
    'BM': ['Product Monetization','Net Monetization','Variable Contribution',
           'Direct Contribution','Business Contribution','Business Margin'],
  };
  let total = 0;
  for(const k1 of (LEVELS[metric] || [])) {
    const k2map = byK1K2.get(k1);
    if(k2map) k2map.forEach(v => { total += v; });
  }
  return total;
}

// Build waterfall segments for the bridge
function buildBridgeSegments(dataA, dataB, metric) {
  const { tpv: tpvA, byK1K2: k1k2A } = dataA;
  const { tpv: tpvB, byK1K2: k1k2B } = dataB;
  const startVal = getBridgeMetricTotal(dataA, metric);
  const endVal   = getBridgeMetricTotal(dataB, metric);
  const trA = getTRFromK1K2(k1k2A);
  const trB = getTRFromK1K2(k1k2B);

  const segments = [];
  segments.push({ label: 'A', value: startVal, type: 'start' });

  // Volume + TR rate effects on the Take Rate lines
  const trDelta   = trB - trA;
  const tpvDelta  = tpvB - tpvA;
  const rateA     = tpvA !== 0 ? trA / tpvA : 0;
  const volEffect = rateA * tpvDelta;
  const trEffect  = trDelta - volEffect;

  if(Math.abs(volEffect) > 0.01)
    segments.push({ label: 'Volume (TPV)', value: volEffect, type: 'effect', group: 'vol' });
  if(Math.abs(trEffect) > 0.01)
    segments.push({ label: 'Take Rate %', value: trEffect,  type: 'effect', group: 'tr'  });

  // Below-TR lines (absolute delta), depending on bridge metric
  const BELOW_TR = [];
  if(metric === 'VC' || metric === 'DC' || metric === 'BM') {
    BELOW_TR.push({ k1: 'Variable Contribution', excludeK2: 'Collection Fees' });
  }
  if(metric === 'DC' || metric === 'BM') {
    BELOW_TR.push({ k1: 'Direct Contribution', excludeK2: null });
  }
  if(metric === 'BM') {
    BELOW_TR.push({ k1: 'Business Contribution', excludeK2: null });
    BELOW_TR.push({ k1: 'Business Margin',        excludeK2: null });
  }

  for(const { k1, excludeK2 } of BELOW_TR) {
    const k2mapA = k1k2A.get(k1) || new Map();
    const k2mapB = k1k2B.get(k1) || new Map();
    const allK2 = [...new Set([...k2mapA.keys(), ...k2mapB.keys()])].filter(Boolean);
    // Use defined order if available
    const orderedK2 = MNG2_ORDER[k1] ? MNG2_ORDER[k1].filter(k2 => allK2.includes(k2))
                                      .concat(allK2.filter(k2 => !MNG2_ORDER[k1].includes(k2)))
                    : allK2;
    for(const k2 of orderedK2) {
      if(excludeK2 && k2 === excludeK2) continue;
      const vA    = k2mapA.get(k2) || 0;
      const vB    = k2mapB.get(k2) || 0;
      const delta = vB - vA;
      if(Math.abs(delta) < 0.01) continue;
      segments.push({ label: k2, value: delta, type: 'effect', group: k1 });
    }
  }

  segments.push({ label: 'B', value: endVal, type: 'end' });
  return segments;
}

function bridgeFmt(v) {
  if(v === 0 || v == null) return '—';
  const neg = v < 0;
  const abs = Math.abs(v) / bridgeUnitDiv;
  const dec = bridgeUnitDiv >= 1_000_000 ? 1 : 0;
  const str = abs.toLocaleString('pt-BR', {minimumFractionDigits:dec, maximumFractionDigits:dec});
  return neg ? `(${str})` : str;
}

function renderBridgesTab() {
  if(!allData || !allData.length) return;
  buildBridgeSelects();

  const mesSetA = get1x1MesSet(bridgePeriodA, bridgeType);
  const mesSetB = get1x1MesSet(bridgePeriodB, bridgeType);
  const ud      = bridgeUnitDiv;
  const udLbl   = ud >= 1e6 ? 'R$ M' : ud >= 1e3 ? 'R$ mil' : 'R$';

  const summaryEl = document.getElementById('bridgesSummary');
  const legendEl  = document.getElementById('bridgesLegend');

  const msgEl    = document.getElementById('bridgesChartMsg');
  const canvasEl = document.getElementById('bridgeChart');

  function clearChart(msg) {
    if(_bridgeChart) { try{_bridgeChart.destroy()}catch(e){} _bridgeChart = null; }
    legendEl.innerHTML  = '';
    summaryEl.innerHTML = '';
    canvasEl.style.display = 'none';
    msgEl.style.display    = 'flex';
    msgEl.textContent      = msg;
  }

  function showCanvas() {
    canvasEl.style.display = 'block';
    msgEl.style.display    = 'none';
    msgEl.textContent      = '';
  }

  if(!bridgePeriodA || !bridgePeriodB || !bridgeCenA || !bridgeCenB) {
    clearChart('Selecione os períodos e cenários para gerar a bridge.');
    return;
  }

  const dataA = getBridgePeriodData(mesSetA, bridgeCenA, bridgeMacro);
  const dataB = getBridgePeriodData(mesSetB, bridgeCenB, bridgeMacro);

  const hasDataA = dataA.byK1K2.size > 0 || dataA.tpv > 0;
  const hasDataB = dataB.byK1K2.size > 0 || dataB.tpv > 0;
  if(!hasDataA || !hasDataB) {
    const who = (!hasDataA && !hasDataB) ? 'A e B' : !hasDataA ? 'A' : 'B';
    clearChart(`⚠️ Sem dados para o período ${who}.\nVerifique se o período e cenário existem na base.`);
    return;
  }

  showCanvas();

  const segments = buildBridgeSegments(dataA, dataB, bridgeMetric);

  // ── Build waterfall float-bar data ──
  const labels   = [];
  const chartData = [];
  const colors   = [];
  const segRefs  = [];
  const DARK_A  = '#1a1a1a';
  const DARK_B  = '#4a7fc1';
  const COL_VOL = 'rgba(21,101,192,0.85)';
  const COL_TR  = 'rgba(106,27,154,0.85)';
  const COL_POS = 'rgba(46,125,50,0.85)';
  const COL_NEG = 'rgba(198,40,40,0.85)';

  // ── Pass 1: compute running totals → Y scale ──
  // (A and B values + all intermediate running totals)
  const allRunning = [];
  {
    let r = 0;
    for(const seg of segments) {
      const v = seg.value / ud;
      if(seg.type === 'start')    { allRunning.push(v); r = v; }
      else if(seg.type === 'end') { allRunning.push(v); }
      else                        { r += v; allRunning.push(r); }
    }
  }
  const yMin      = Math.min(...allRunning);
  const yMax      = Math.max(...allRunning);
  const yRange    = Math.max(yMax - yMin, Math.abs(yMax) * 0.05, 1);
  const yPad      = yRange * 0.18;
  const yScaleMin = yMin - yPad;
  const yScaleMax = yMax + yPad;

  // ── Pass 2: build float-bar data ──
  // A and B bars start at yScaleMin (fills chart bottom → value = "broken" visual)
  let running = 0;
  for(const seg of segments) {
    labels.push(seg.label);
    segRefs.push(seg);
    const v = seg.value / ud;
    if(seg.type === 'start') {
      chartData.push([yScaleMin, v]);   // ← base at axis min, not 0
      colors.push(DARK_A);
      running = v;
    } else if(seg.type === 'end') {
      chartData.push([yScaleMin, v]);   // ← same for B
      colors.push(DARK_B);
    } else {
      const base = running;
      const next = running + v;
      chartData.push([Math.min(base, next), Math.max(base, next)]);
      colors.push(seg.group === 'vol' ? COL_VOL
                : seg.group === 'tr'  ? COL_TR
                : v >= 0              ? COL_POS : COL_NEG);
      running = next;
    }
  }

  // ── Connector line plugin (+ break symbol on A/B bars) ──
  const connectorPlugin = {
    id: 'bridgeConnectors',
    afterDatasetsDraw(chart) {
      const meta = chart.getDatasetMeta(0);
      if(!meta || !meta.data.length) return;
      const { ctx } = chart;
      ctx.save();

      // Dashed connectors between bars
      ctx.strokeStyle = 'rgba(128,128,128,0.35)';
      ctx.lineWidth   = 1;
      ctx.setLineDash([4,3]);
      for(let i = 0; i < meta.data.length - 1; i++) {
        const seg  = segRefs[i];
        if(seg.type === 'end') continue;
        const bar  = meta.data[i];
        const barN = meta.data[i+1];
        const hw   = (bar.width  || 20) / 2;
        const hwN  = (barN.width || 20) / 2;
        const landingVal = seg.type === 'start'
          ? chartData[i][1]
          : seg.value >= 0 ? chartData[i][1] : chartData[i][0];
        const y = chart.scales.y.getPixelForValue(landingVal);
        ctx.beginPath();
        ctx.moveTo(bar.x + hw,  y);
        ctx.lineTo(barN.x - hwN, y);
        ctx.stroke();
      }

      // Break symbol (zigzag) near the bottom of A and B bars
      ctx.setLineDash([]);
      ctx.lineWidth = 2;
      meta.data.forEach((bar, i) => {
        const seg = segRefs[i];
        if(seg.type !== 'start' && seg.type !== 'end') return;
        const hw   = (bar.width || 20) / 2;
        const yBot = chart.chartArea.bottom - 8; // near bottom of chart area
        const amp  = 5;  // zigzag amplitude
        const step = hw * 0.35;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth   = 3;
        ctx.beginPath();
        ctx.moveTo(bar.x - hw, yBot);
        ctx.lineTo(bar.x - step, yBot - amp);
        ctx.lineTo(bar.x + step, yBot + amp);
        ctx.lineTo(bar.x + hw, yBot);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(0,0,0,0.25)';
        ctx.lineWidth   = 1;
        ctx.beginPath();
        ctx.moveTo(bar.x - hw, yBot);
        ctx.lineTo(bar.x - step, yBot - amp);
        ctx.lineTo(bar.x + step, yBot + amp);
        ctx.lineTo(bar.x + hw, yBot);
        ctx.stroke();
      });

      ctx.restore();
    }
  };

  // ── Value label plugin ──
  const valueLabelPlugin = {
    id: 'bridgeValueLabels',
    afterDatasetsDraw(chart) {
      const { ctx } = chart;
      const meta = chart.getDatasetMeta(0);
      ctx.save();
      ctx.font      = '700 10px system-ui,sans-serif';
      ctx.textAlign = 'center';
      meta.data.forEach((bar, i) => {
        const seg = segRefs[i];
        const v   = seg.value;
        if(Math.abs(v) < 0.005 * ud) return;
        const isAnchored = seg.type === 'start' || seg.type === 'end';
        const lbl = isAnchored ? bridgeFmt(v) : (v >= 0 ? '+' : '') + bridgeFmt(v);
        ctx.fillStyle = isAnchored ? '#1a1a1a'
                      : v < 0     ? '#B71C1C' : '#1B5E20';
        // Position label above the bar's top edge
        const topVal = isAnchored ? chartData[i][1]
                                  : Math.max(chartData[i][0], chartData[i][1]);
        const pxY = chart.scales.y.getPixelForValue(topVal) - 5;
        ctx.fillText(lbl, bar.x, pxY);
      });
      ctx.restore();
    }
  };

  if(_bridgeChart) { try{_bridgeChart.destroy()}catch(e){} _bridgeChart = null; }

  const ctx = document.getElementById('bridgeChart').getContext('2d');
  _bridgeChart = new Chart(ctx, {
    type: 'bar',
    plugins: [connectorPlugin, valueLabelPlugin],
    data: {
      labels,
      datasets: [{
        label: bridgeMetric,
        data:  chartData,
        backgroundColor: colors,
        borderRadius: 3,
        barPercentage: 0.6,
        categoryPercentage: 0.75,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { top: 30, left: 8, right: 8 } },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: c => {
              const seg = segRefs[c.dataIndex];
              const v   = seg.value;
              const isAnchored = seg.type === 'start' || seg.type === 'end';
              return `${isAnchored ? '' : v >= 0 ? '+' : ''}${bridgeFmt(v)} ${udLbl}`;
            }
          }
        }
      },
      scales: {
        x: { grid:{ display:false }, ticks:{ font:{size:10}, color:'#888', maxRotation:30, minRotation:0 } },
        y: {
          min: yScaleMin,
          max: yScaleMax,
          grid: { color:'rgba(128,128,128,0.1)' },
          ticks: { callback: v => bridgeFmt(v * ud), font:{size:10} }
        }
      }
    }
  });

  // ── Legend ──
  const lA = format1x1PeriodLabel(bridgePeriodA, bridgeType);
  const lB = format1x1PeriodLabel(bridgePeriodB, bridgeType);
  legendEl.innerHTML = `
    <span class="bridges-legend-item"><span class="bridges-legend-dot" style="background:${DARK_A}"></span>A: ${lA} / ${shortCen(bridgeCenA)}</span>
    <span class="bridges-legend-item"><span class="bridges-legend-dot" style="background:${DARK_B}"></span>B: ${lB} / ${shortCen(bridgeCenB)}</span>
    <span class="bridges-legend-item"><span class="bridges-legend-dot" style="background:${COL_VOL}"></span>Efeito Volume</span>
    <span class="bridges-legend-item"><span class="bridges-legend-dot" style="background:${COL_TR}"></span>Efeito Take Rate %</span>
    <span class="bridges-legend-item"><span class="bridges-legend-dot" style="background:${COL_POS}"></span>Absoluto +</span>
    <span class="bridges-legend-item"><span class="bridges-legend-dot" style="background:${COL_NEG}"></span>Absoluto −</span>`;

  // ── Summary table ──
  const tpvA  = dataA.tpv, tpvB = dataB.tpv;
  const trA   = getTRFromK1K2(dataA.byK1K2);
  const trB   = getTRFromK1K2(dataB.byK1K2);
  const rateA = tpvA ? (trA / tpvA * 100) : null;
  const rateB = tpvB ? (trB / tpvB * 100) : null;
  const baseA = getBridgeMetricTotal(dataA, bridgeMetric);

  let rows = '';
  for(const seg of segments) {
    const v   = seg.value;
    const isAnchored = seg.type === 'start' || seg.type === 'end';
    const dPct = (!isAnchored && baseA !== 0) ? (v / Math.abs(baseA) * 100) : null;
    const dPctStr = dPct != null ? `${dPct >= 0 ? '+' : ''}${dPct.toFixed(2)}%` : '—';
    const fv  = isAnchored ? bridgeFmt(v) : (v >= 0 ? '+' : '') + bridgeFmt(v);
    const rc  = seg.type === 'start' ? 'bsm-start'
              : seg.type === 'end'   ? 'bsm-end'
              : seg.group === 'vol'  ? 'bsm-vol'
              : seg.group === 'tr'   ? 'bsm-tr'
              : v >= 0              ? 'bsm-pos' : 'bsm-neg';
    rows += `<tr class="${rc}"><td>${seg.label}</td><td>${fv}</td><td class="bsm-delta">${dPctStr}</td></tr>`;
  }

  const tpvRow = (tpvA || tpvB) ? `
    <tr style="border-top:2px solid var(--border)">
      <td style="color:var(--muted)">TPV A → B</td>
      <td style="color:var(--muted)">${bridgeFmt(tpvA)} → ${bridgeFmt(tpvB)}</td>
      <td style="color:var(--muted)">${tpvA ? ((tpvB-tpvA)/Math.abs(tpvA)*100).toFixed(2)+'%' : '—'}</td>
    </tr>` : '';

  const rateRow = (rateA != null || rateB != null) ? `
    <tr>
      <td style="color:var(--muted)">Take Rate % A → B</td>
      <td style="color:var(--muted)">${rateA != null ? rateA.toFixed(2)+'%' : '—'} → ${rateB != null ? rateB.toFixed(2)+'%' : '—'}</td>
      <td style="color:var(--muted)">${(rateA!=null&&rateB!=null) ? (rateB-rateA>=0?'+':'')+(rateB-rateA).toFixed(2)+'pp' : '—'}</td>
    </tr>` : '';

  summaryEl.innerHTML = `
    <table>
      <thead><tr>
        <th style="text-align:left">Componente</th>
        <th>${udLbl}</th>
        <th>% de A</th>
      </tr></thead>
      <tbody>${rows}${tpvRow}${rateRow}</tbody>
    </table>`;
}

function renderEvoTab() {
  if(!allData || !allData.length) return;
  buildEvoBUSel();

  const ud    = evoUnitDiv;
  const udLbl = ud >= 1e6 ? 'R$ M' : 'R$ K';
  const buses = KN_BU_MAP[evoBU] || [evoBU];

  const realMeses = [...new Set(
    allData.filter(d=>d.Cenario==='Realizado'&&buses.includes(d.Product)).map(d=>d.MES)
  )].sort();
  const planMeses = [...new Set(
    allData.filter(d=>d.Cenario==='Plan'&&buses.includes(d.Product)).map(d=>d.MES)
  )].sort();
  const allMeses = [...new Set([...realMeses,...planMeses])].sort();

  // Build period keys (respects granularity)
  function toPeriodKey(m) {
    const yr=Math.floor(m/100), mo=m%100;
    if(evoGran==='quarterly') return `${yr}Q${Math.ceil(mo/3)}`;
    if(evoGran==='annual')    return String(yr);
    return m;
  }
  const allPeriods = [...new Set(allMeses.map(toPeriodKey))];
  const labels = allPeriods.map(evoPeriodLabel);

  // Destroy old charts
  Object.values(_evoCharts).forEach(c=>{ try{c.destroy()}catch(e){} });
  _evoCharts = {};

  const grid = document.getElementById('evoGrid');
  grid.innerHTML = '';

  EVO_METRICS.forEach(({key, abbr, label, takerate}) => {
    // Take Rate: only show for Acquiring-related BUs
    if(takerate && !EVO_ACQUIRING_BUS.has(evoBU)) return;

    // Aggregate by period
    const realByPeriod = new Map();
    const planByPeriod = new Map();
    allPeriods.forEach(p => { realByPeriod.set(p, null); planByPeriod.set(p, 0); });

    for(const m of allMeses) {
      const p = toPeriodKey(m);
      if(realMeses.includes(m)) {
        const v = takerate ? evoGetTakeRate(evoBU, m, 'Realizado') : evoGetVal(evoBU, m, 'Realizado', key);
        realByPeriod.set(p, (realByPeriod.get(p) || 0) + v);
      }
      const vp = takerate ? evoGetTakeRate(evoBU, m, 'Plan') : evoGetVal(evoBU, m, 'Plan', key);
      planByPeriod.set(p, (planByPeriod.get(p) || 0) + vp);
    }

    const realVals = allPeriods.map(p => {
      const v = realByPeriod.get(p);
      return v === null ? null : v / ud;
    });
    const planVals = allPeriods.map(p => planByPeriod.get(p) / ud);

    if(realVals.every(v=>v===null||v===0) && planVals.every(v=>v===0)) return;

    const displayLabel = label || key;
    const card = document.createElement('div');
    card.className = 'evo-chart-card' + (takerate ? ' evo-chart-takerate' : '');
    card.innerHTML = `
      <div class="evo-chart-header">
        <span class="evo-chart-abbr">${abbr}</span>
        <span class="evo-chart-full">${displayLabel}</span>
      </div>
      <canvas id="evoC_${abbr}"></canvas>`;
    grid.appendChild(card);

    const barColors = realVals.map(v => v===null ? 'transparent' : v>=0 ? '#1a1a1a' : '#C62828');

    // Plugin inline: rótulos de dados acima das barras (sem dependência externa)
    const barLabelPlugin = {
      id:'barLabels',
      afterDatasetsDraw(chart) {
        const meta = chart.getDatasetMeta(0);
        if(!meta || meta.type !== 'bar') return;
        const { ctx } = chart;
        ctx.save();
        ctx.font = '600 9px system-ui,sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        meta.data.forEach((bar, i) => {
          const v = chart.data.datasets[0].data[i];
          if(v === null || v === undefined || v === 0) return;
          const lbl = v.toLocaleString('pt-BR',{maximumFractionDigits:0});
          ctx.fillStyle = v < 0 ? '#C62828' : '#444';
          ctx.fillText(lbl, bar.x, bar.y - 2);
        });
        ctx.restore();
      }
    };

    _evoCharts[abbr] = new Chart(
      card.querySelector('canvas').getContext('2d'), {
      plugins: [barLabelPlugin],
      type: 'bar',
      data: {
        labels,
        datasets: [
          { label:'Realizado', data:realVals,
            backgroundColor:barColors, borderRadius:4, order:2 },
          { label:'Plan', data:planVals, type:'line',
            borderColor:'#FFE600', backgroundColor:'transparent',
            borderWidth:2, borderDash:[5,3],
            pointBackgroundColor:'#FFE600', pointRadius:3,
            tension:0.25, order:1 }
        ]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        layout:{ padding:{ top:20 } },
        plugins: {
          legend:{ display:false },
          tooltip:{ callbacks:{
            label: ctx => {
              const v = ctx.parsed.y;
              if(v===null) return null;
              return `${ctx.dataset.label}: ${v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})} ${udLbl}`;
            }
          }}
        },
        scales: {
          x:{ grid:{display:false}, ticks:{font:{size:10}, color:'#888'} },
          y:{ display:false }
        }
      }
    });
  });
}
</script>
